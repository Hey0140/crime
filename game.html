<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>죽은 자의 생일파티 · 추리 게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
@font-face{font-family:'MaruBuri';src:url('assets/fonts/MaruBuri-ExtraLight.ttf') format('truetype');font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('assets/fonts/MaruBuri-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('assets/fonts/MaruBuri-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('assets/fonts/MaruBuri-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('assets/fonts/MaruBuri-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0a0806; --bg2:#130d09; --panel:#16100b; --panel2:#1e160e;
  --gold:#c8a767; --gold2:#ecd49a; --goldsoft:rgba(200,167,103,.16);
  --text:#ece3d4; --muted:#a59377; --dim:#7d6d58; --line:#3a2e21;
  --danger:#cf6b5e; --ok:#8fbf86;
  --serif:'MaruBuri','Gowun Batang','Nanum Myeongjo',serif;
  --sans:'MaruBuri','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a1c10 0%, var(--bg2) 42%, var(--bg) 78%);
  color:var(--text); font-family:var(--sans); line-height:1.75;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::after{ /* vignette + grain */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(120% 120% at 50% 30%, transparent 55%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.hidden{display:none !important}
a{color:var(--gold2);text-decoration:none}
::selection{background:rgba(200,167,103,.3)}
/* scrollbar */
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2c2116;border-radius:8px}

#roomBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity .55s ease;will-change:opacity}
#roomBg.show{opacity:1}
/* ---------- INTRO ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 50% 0%,#1b120a,#070504 70%);overflow:auto;padding:40px 18px}
.intro-card{max-width:760px;width:100%;text-align:center;animation:rise .9s ease both}
#intro{display:block;align-items:initial;justify-content:initial;padding:0;background:#070504}
#introBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center top;background-repeat:no-repeat;
  animation:kenburns 30s ease-in-out infinite alternate;transform-origin:center 30%}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
#intro::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,5,4,.22) 0%,rgba(7,5,4,.30) 38%,rgba(7,5,4,.72) 74%,rgba(7,5,4,.96) 100%)}
.intro-content{position:relative;z-index:1;min-height:100vh;max-width:720px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 54px;animation:fade 1.1s ease both}
.intro-top{min-height:56vh;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:20px}
.intro-content h1{font-family:var(--serif);font-weight:700;font-size:clamp(40px,8.5vw,70px);margin:6px 0 0;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff7e2,#e7c987 58%,#b48f52);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 26px rgba(0,0,0,.9))}
.scrolldown{margin-top:14px;color:var(--gold2);font-size:11.5px;letter-spacing:.32em;animation:bob 2.1s ease-in-out infinite;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.enter-note{margin-top:14px;color:var(--dim);font-size:12.5px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
#enterBtn{margin-top:8px}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:.95}}
.kicker{letter-spacing:.5em;color:var(--gold2);font-size:12px;margin:0;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.intro-card h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,58px);margin:0;
  letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.7);
  background:linear-gradient(180deg,#fff5dc,#c8a767 70%,#8a6f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-sub{color:#d9c8ab;font-size:14px;letter-spacing:.3em;margin:12px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.brief{text-align:left;width:100%;margin:8px 0 26px;border:1px solid var(--line);border-radius:16px;padding:24px 28px;
  background:linear-gradient(180deg,rgba(14,10,7,.85),rgba(8,6,4,.92));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 22px 64px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.35)}
.brief img{display:block;width:100%;max-width:540px;height:auto;margin:2px auto 20px;border-radius:13px;border:1px solid var(--line);box-shadow:0 16px 46px rgba(0,0,0,.6)}
.brief h2{font-family:var(--serif);color:var(--gold2);font-size:20px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.brief h3{color:var(--gold);font-size:16px;margin:14px 0 6px}
.brief p{margin:8px 0;color:#ded3c0}
.bloodline{color:#d98a7e !important;font-family:var(--serif);font-size:18px;letter-spacing:.04em}
.btn-primary{font-family:var(--serif);font-size:19px;letter-spacing:.2em;cursor:pointer;
  color:#1a130b;background:linear-gradient(180deg,#f0d9a0,#c8a767);border:0;border-radius:999px;
  padding:15px 46px;box-shadow:0 10px 30px rgba(200,167,103,.35);transition:.25s;font-weight:700}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(200,167,103,.5)}
.intro-note{color:var(--dim);font-size:12.5px;margin-top:16px}

/* ---------- TOPBAR ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:11px 16px;background:linear-gradient(180deg,rgba(12,9,6,.92),rgba(12,9,6,.7));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#topbar button{font-family:var(--sans);cursor:pointer;color:var(--text);background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;transition:.18s}
#topbar button:hover{border-color:var(--gold);color:var(--gold2)}
#crumb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
#crumb b{color:var(--gold2);font-weight:500}
.spacer{flex:1 1 auto}
#nowplaying{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;max-width:34vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#nowplaying .eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
#nowplaying .eq i{width:2px;background:var(--gold);animation:eq 1s ease-in-out infinite}
#nowplaying.paused .eq i{animation-play-state:paused;opacity:.3}
#nowplaying .eq i:nth-child(2){animation-delay:.2s}#nowplaying .eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
#muteBtn{min-width:42px}
#volSlider{width:82px;height:4px;cursor:pointer;accent-color:var(--gold);background:transparent;vertical-align:middle}
@media(max-width:640px){#volSlider{width:58px}}

/* ---------- VIEW ---------- */
#view{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:86px 20px 110px;animation:fade .5s ease}
.view-head{margin:6px 0 22px}
.eyebrow{letter-spacing:.32em;font-size:11px;color:var(--gold);text-transform:uppercase}
.view-head h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5vw,40px);margin:8px 0 0;letter-spacing:.03em;color:#f3e7cc}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:14px 0 0}

/* HUB */
.hub-intro{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));min-height:150px;display:flex;flex-direction:column;
  transition:.22s;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.card .thumb{height:138px;background-size:cover;background-position:center;background-color:#0c0907;
  filter:brightness(.74) saturate(.96);transition:.3s}
.card:hover .thumb{filter:brightness(.85) saturate(1)}
.card .meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .name{font-family:var(--serif);font-size:17px;color:#f0e3c8;letter-spacing:.02em}
.card .tag{font-size:11.5px;color:var(--dim)}
.card .lockbadge{position:absolute;top:10px;right:10px;font-size:11px;padding:4px 9px;border-radius:999px;
  background:rgba(8,6,4,.78);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(4px)}
.card.unlocked .lockbadge{color:var(--ok);border-color:rgba(143,191,134,.4)}
.card.locked .lockbadge{color:var(--gold2);border-color:rgba(200,167,103,.4)}
.section-label{display:flex;align-items:center;gap:12px;margin:34px 0 16px;color:var(--gold);font-size:13px;letter-spacing:.28em}
.section-label::before,.section-label::after{content:"";height:1px;background:var(--line);flex:1}
.special-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.chip-card{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  display:flex;align-items:center;gap:12px;transition:.2s;flex:1;min-width:200px}
.chip-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.chip-card .ic{font-size:22px}
.chip-card .t{font-family:var(--serif);font-size:16px;color:#efe2c7}
.chip-card .s{font-size:11.5px;color:var(--dim)}
.danger-card{border-color:rgba(207,107,94,.35)}
.danger-card .t{color:#e6a99f}

/* CONTENT (evidence/doc) */
.content{background:linear-gradient(180deg,rgba(26,19,12,.82),rgba(17,12,8,.9));
  border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;
  padding:26px 30px;box-shadow:0 14px 50px rgba(0,0,0,.4)}
.content h1{font-family:var(--serif);font-size:24px;color:var(--gold2);margin:18px 0 8px}
.content h2{font-family:var(--serif);font-size:21px;color:#f0d99a;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.content h3{font-size:17px;color:var(--gold);margin:18px 0 6px}
.content p{margin:11px 0;color:#e2d7c4}
.content ul,.content ol{padding-left:22px}.content li{margin:7px 0}
.content blockquote{border-left:3px solid var(--gold);background:var(--goldsoft);padding:12px 18px;border-radius:10px;margin:16px 0;color:#ecdfca;font-family:var(--serif)}
.content hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.content code,.content pre{font-family:ui-monospace,Consolas,monospace;color:#ffe0a1;background:#0b0806;border:1px solid #2c2116;border-radius:8px;padding:2px 6px}
.content pre{padding:14px;overflow:auto}
.content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.content th,.content td{border:1px solid var(--line);padding:9px 11px;text-align:left}
.content th{background:rgba(200,167,103,.1);color:var(--gold2);font-weight:500}
.content tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.content img{display:block;max-width:100%;width:auto;height:auto;max-height:84vh;object-fit:contain;margin:18px auto;border-radius:12px;border:1px solid #2c2116;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.content strong{color:#f3deb0}
/* navlinks inside content -> evidence buttons */
.content a.navlink, a.navlink{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:linear-gradient(180deg,rgba(40,30,18,.9),rgba(26,19,11,.9));border:1px solid var(--line);
  color:#f0e3c8 !important;border-radius:10px;padding:10px 15px;margin:5px 6px 5px 0;font-size:14.5px;transition:.18s;border-bottom:1px solid var(--line)}
.content a.navlink::before{content:"›";color:var(--gold);font-size:18px;line-height:1}
.content a.navlink:hover{border-color:var(--gold);color:#fff4d6 !important;transform:translateX(3px)}.content .cluegrid{margin:14px 0}.card.cluecard{text-align:left;font:inherit;width:100%;color:inherit;min-height:150px}.card.cluecard .name{font-size:15.5px;line-height:1.3}.card.cluecard .tag{color:var(--gold2)}.card.cluecard .thumb-emoji{display:flex;align-items:center;justify-content:center;font-size:46px;filter:none;background-color:#15100b}#lightbox .lb-inner{max-width:min(92vw,820px);text-align:center;padding:10px}#lightbox .lb-inner img{max-width:100%;max-height:76vh;border-radius:10px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.6)}#lightbox .lb-cap{margin-top:12px;color:var(--gold2);font-size:15px}#lightbox .lb-close{margin-top:14px}
.content li>a.navlink{margin:3px 0}
.content li{list-style:none}
.content ul:has(a.navlink){padding-left:0}
.subnav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}

/* CHARACTER CAROUSEL */
.carousel{position:relative;display:flex;align-items:center;gap:10px;margin-top:6px}
.carwin{overflow:hidden;flex:1;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(26,19,12,.82),rgba(17,12,8,.9));box-shadow:0 14px 50px rgba(0,0,0,.4)}
.cardstage{display:flex;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.pcard{flex:0 0 100%;display:flex;min-height:420px;max-height:64vh}
.pcard-img{flex:0 0 40%;background:#0c0907;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block}
.pcard-body{flex:1;padding:26px 30px;text-align:left;overflow:auto}
.pcard-body h2{font-family:var(--serif);font-size:27px;color:#f3e7cc;margin:0 0 6px;font-weight:700}
.pcard-meta{color:var(--gold2);font-size:13px;letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.pcard-desc{color:#e2d7c4;font-size:14.5px;line-height:1.8}
.pcard-desc p{margin:10px 0}
.cararrow{flex:0 0 auto;width:46px;height:46px;border-radius:50%;cursor:pointer;background:linear-gradient(180deg,rgba(40,30,18,.95),rgba(20,15,9,.95));border:1px solid var(--line);color:var(--gold2);font-size:24px;line-height:1;transition:.18s}
.cararrow:hover{border-color:var(--gold);color:#fff4d6;transform:scale(1.08)}
.cardots{display:flex;justify-content:center;gap:9px;margin-top:18px}
.cardots .dot{width:9px;height:9px;border-radius:50%;background:#4a3a28;cursor:pointer;transition:.2s}
.cardots .dot.on{background:var(--gold);transform:scale(1.25)}
.carcount{text-align:center;color:var(--dim);font-size:12px;margin-top:8px;letter-spacing:.1em}
@media(max-width:680px){
  .pcard{flex-direction:column;max-height:none;min-height:0}
  .pcard-img{flex:none;height:230px}
  .pcard-img img{object-position:center 10%}
  .pcard-body{padding:18px 18px 22px}
  .cararrow{width:38px;height:38px;font-size:20px}
}
/* LOCK SCREEN */
.lockwrap{display:flex;justify-content:center;padding:14px 0}
.lockcard{max-width:460px;width:100%;text-align:center;background:linear-gradient(180deg,var(--panel2),#0f0b07);
  border:1px solid var(--line);border-radius:20px;padding:38px 30px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lockcard .lockic{font-size:42px;filter:drop-shadow(0 0 14px rgba(200,167,103,.4))}
.lockcard h2{font-family:var(--serif);color:var(--gold2);font-size:22px;margin:14px 0 4px}
.lockcard p.l{color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.pwrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pwrow input{flex:1;min-width:160px;background:#070504;border:1px solid #4a3a28;color:#fff;border-radius:12px;
  padding:14px 16px;font-size:17px;text-align:center;letter-spacing:.15em;font-family:var(--sans)}
.pwrow input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,167,103,.18)}
.seqrow{display:flex;gap:10px;justify-content:center}
.seqrow .dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.seqrow .dial span{font-size:11px;color:var(--dim);letter-spacing:.2em}
.seqrow input{width:84px;text-align:center}
.lockbtn{margin-top:16px;font-family:var(--serif);letter-spacing:.18em;cursor:pointer;color:#1a130b;
  background:linear-gradient(180deg,#f0d9a0,#c8a767);border:0;border-radius:999px;padding:13px 40px;font-size:16px;font-weight:700;transition:.2s}
.lockbtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,167,103,.4)}
.lockhint{color:var(--dim);font-size:12px;margin-top:14px}
.lockerr{color:var(--danger);font-size:13.5px;margin-top:12px;min-height:18px;font-family:var(--serif)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* solution modal */
#solModal .intro-card{max-width:520px}
.sol-warn{background:linear-gradient(180deg,rgba(60,24,20,.6),rgba(20,12,9,.6));border:1px solid rgba(207,107,94,.4);
  border-radius:16px;padding:26px;text-align:center}
.sol-warn .ic{font-size:40px}
.sol-warn h2{font-family:var(--serif);color:#e9a99f;font-size:22px;margin:12px 0}
.sol-warn p{color:var(--muted);font-size:14px}
.sol-btns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn-ghost{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:12px 26px;font-size:14px;font-family:var(--sans);transition:.2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--text)}
.btn-danger{cursor:pointer;background:linear-gradient(180deg,#b9564a,#7e3329);border:0;color:#fff;border-radius:999px;padding:12px 28px;font-size:14px;font-family:var(--serif);letter-spacing:.1em}
#accuseModal .intro-card{max-width:640px}
.accuse-box{background:linear-gradient(180deg,rgba(26,19,12,.97),rgba(12,9,6,.98));border:1px solid var(--line);border-radius:20px;padding:30px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.accuse-box .ic{font-size:38px}
.accuse-box h2{font-family:var(--serif);color:var(--gold2);font-size:23px;margin:10px 0 6px}
.accuse-box #accuseDesc{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.suspect-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.suspect{cursor:pointer;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;color:var(--text);transition:.18s;display:flex;flex-direction:column;font-family:var(--sans)}
.suspect img{width:100%;height:118px;object-fit:cover;object-position:center 18%;display:block;filter:brightness(.92) saturate(.97);background:#0c0907}
.suspect .sinfo{padding:9px 8px 11px}
.suspect:hover{border-color:var(--gold);transform:translateY(-3px)}
.suspect:hover img{filter:brightness(1.04)}
.suspect b{display:block;font-family:var(--serif);font-size:15.5px;color:#f0e3c8}
.suspect span{font-size:11px;color:var(--dim)}
.suspect.wrong{animation:shake .4s;border-color:var(--danger)}
.suspect.chosen{border-color:var(--ok);box-shadow:0 0 0 2px rgba(143,191,134,.35)}
.suspect:disabled{opacity:.45;cursor:default;transform:none}
.accuse-feedback{min-height:22px;margin:16px 0 4px;font-family:var(--serif);font-size:16px}
.accuse-feedback.no{color:var(--danger)}
.accuse-feedback.ok{color:var(--ok)}
.accuse-actions{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}

<script>
let DATA = null;
fetch('game.json')
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){ DATA = d; validateData(d); startApp(); })
  .catch(function(e){
    document.body.innerHTML = '<pre style="color:#e7b6c8;background:#140d08;padding:24px;font:14px/1.6 monospace;white-space:pre-wrap">game.json \uB85C\uB4DC \uC2E4\uD328\n'+(e&&e.message?e.message:e)+'\n\nfile:// \uB85C \uC5F4\uBA74 \uCC28\uB2E8\uB429\uB2C8\uB2E4. \uB85C\uCEEC \uC11C\uBC84\uB85C \uC5F4\uC138\uC694:\n  python -m http.server 8000</pre>';
  });
function validateData(d){
  var problems=[], N=d.nodes||{};
  ['rootId','charactersId','solutionId'].forEach(function(k){ if(!(d[k] in N)) problems.push(k+' \uB178\uB4DC \uC5C6\uC74C: '+d[k]); });
  (d.locIds||[]).forEach(function(id){ if(!(id in N)) problems.push('locIds \uB178\uB4DC \uC5C6\uC74C: '+id); });
  Object.keys(N).forEach(function(id){ (N[id].children||[]).forEach(function(c){ if(c.indexOf('custom_')!==0 && !(c in N)) problems.push('children \uB178\uB4DC \uC5C6\uC74C: '+id+' -> '+c); }); });
  ['bg','locImages','triggers'].forEach(function(m){ Object.keys(d[m]||{}).forEach(function(id){ if(!(id in N)) problems.push(m+' \uD0A4 \uB178\uB4DC \uC5C6\uC74C: '+id); }); });
  if(problems.length) console.warn('[game.json \uAC80\uC99D] \uBB38\uC81C '+problems.length+'\uAC74:\n'+problems.join('\n'));
  else console.log('[game.json \uAC80\uC99D] OK \u2014 \uB178\uB4DC '+Object.keys(N).length+'\uAC1C');
}
</script>
<script>
function startApp(){
"use strict";
const N=DATA.nodes, HUB='__HUB__', BRIEF='__BRIEF__';
const $=s=>document.querySelector(s), el=$('#view'), $$=s=>document.querySelectorAll(s);
const store={
  get:()=>{try{return JSON.parse(localStorage.getItem('dsbp_unlocked_v2')||'{}')}catch(e){return {}}},
  set:o=>{try{localStorage.setItem('dsbp_unlocked_v2',JSON.stringify(o))}catch(e){}}
};
let unlocked=store.get();
let stack=[]; // navigation history of ids (HUB or node id)
let enteredExploration=false;

// ---- parent map ----
const parent={};
for(const id in N){ for(const c of N[id].children){ if(!(c in parent)) parent[c]=id; } }

// ---- audio manager ----
const A={els:[$('#aud0'),$('#aud1')],cur:0,target:0.5,muted:false,ready:false,track:null,fadeT:null};
function prettyTrack(src){
  if(!src) return '';
  let f=src.split('/').pop().replace('.mp3','');
  f=f.split('-by-')[0].replace(/-/g,' ');
  return f.replace(/\b\w/g,c=>c.toUpperCase());
}
function setNow(src){
  const np=$('#nowplaying'); const t=$('#nowplaying .nowtext');
  t.textContent = (A.muted||!src)?'음악 꺼짐':('♪ '+prettyTrack(src));
  np.classList.toggle('paused', A.muted||!src);
}
function playTrack(src){
  if(!A.ready||!src){A.track=src;setNow(src);return;}
  if(src===A.track){return;}
  A.track=src; setNow(src);
  if(A.muted) return;
  const old=A.els[A.cur], nw=A.els[1-A.cur]; A.cur=1-A.cur;
  nw.src=src; nw.volume=0; nw.play().catch(()=>{});
  clearInterval(A.fadeT); let step=0,steps=28;
  A.fadeT=setInterval(()=>{ step++; const k=step/steps;
    nw.volume=Math.min(A.target,A.target*k);
    old.volume=Math.max(0,A.target*(1-k));
    if(step>=steps){clearInterval(A.fadeT); try{old.pause()}catch(e){}}
  },45);
}
function toggleMute(){
  A.muted=!A.muted; $('#muteBtn').textContent=A.muted?'🔇':'♪';
  if(A.muted){A.els.forEach(a=>{try{a.pause()}catch(e){}});}
  else { const cur=A.els[A.cur]; cur.volume=A.target; if(A.track){cur.src=cur.src||A.track; cur.play().catch(()=>{});} else {const t=A.track;A.track=null;playTrack(t);} }
  setNow(A.track);
}
$('#muteBtn').onclick=toggleMute;
(function(){
  const sv=parseFloat(localStorage.getItem('dsbp_vol'));
  if(!isNaN(sv)) A.target=Math.max(0,Math.min(1,sv));
  const sl=$('#volSlider'); sl.value=Math.round(A.target*100);
  sl.addEventListener('input',e=>{
    A.target=(+e.target.value)/100; try{localStorage.setItem('dsbp_vol',A.target)}catch(_){}
    if(A.muted && A.target>0){A.muted=false;$('#muteBtn').textContent='♪';}
    const cur=A.els[A.cur];
    if(!A.muted){ cur.volume=A.target; if(A.track && cur.paused){ cur.src=cur.src||A.track; cur.play().catch(()=>{}); } }
    setNow(A.track);
  });
})();

// ---- normalize password (mirror of original) ----
function normPw(s){return (s||'').toLowerCase().replace(/[월일년]/g,'').replace(/[^0-9a-z가-힣]/g,'');}
function pwHintLabel(s){
  const v=normPw(s);
  const kinds=[];
  if(/[a-z]/.test(v)) kinds.push('영문');
  if(/[0-9]/.test(v)) kinds.push('숫자');
  if(/[가-힣]/.test(v)) kinds.push('한글');
  return v.length+'자리 · '+(kinds.length?kinds.join('+'):'문자');
}
function lockHint(n){
  if(!n.answers || !n.answers.length) return '';
  if(n.title==='녹음기') return '영어입니다.';
  if(n.lock_type==='sequence'){
    return n.answers.map((a,i)=>(i+1)+'번 '+pwHintLabel(a)).join(' / ');
  }
  const labels=[...new Set(n.answers.map(pwHintLabel))];
  return labels.join(' 또는 ');
}

// ---- helpers ----
function firstImg(html){const m=html&&html.match(/<img[^>]+src="([^"]+)"/);return m?m[1]:null;}
function isUnlocked(id){return !N[id].locked || unlocked[id];}
function clueType(n){
  var t=n.title||'', h=n.html||'';
  var txt=h.replace(/<[^>]+>/g,'');
  var strongs=(h.match(/<strong>/g)||[]).length;
  var chats=(txt.match(/\d\d:\d\d/g)||[]).length;
  var imgs=(h.match(/<img/g)||[]).length;
  var L=txt.length;
  function kw(){for(var i=0;i<arguments.length;i++){if(t.indexOf(arguments[i])>=0)return true;}return false;}
  if(kw('CCTV','영상','캡처','녹화')) return 'VIDEO';
  if(kw('녹음')||txt.indexOf('녹음 종료')>=0) return 'AUDIO';
  if(kw('메신저','대화','문자','메시지')||(chats>=6&&strongs>=6)) return 'CHAT';
  var official=kw('조사','감정','점검','로그','보고','검토','설명서')||t.indexOf('접근 기록')>=0||t.indexOf('명단')>=0;
  if(!official&&(kw('다이어리','일기','편지','카드','수첩')||t.indexOf('개인 메모')>=0||t.indexOf('000 000 메모')>=0||/에게$/.test(t)||/지$/.test(t))) return 'NOTE';
  if(kw('사진','초대장')||(imgs>=1&&L<60)) return 'PHOTO';
  return 'DOC';
}
var TYPE_META={PHOTO:['📷','현장·물품'],DOC:['📄','문서'],NOTE:['📝','메모'],CHAT:['💬','대화'],AUDIO:['🎙️','녹음'],VIDEO:['🎞️','영상']};
function clueThumb(ty,img){
  if(img) return '<div class="thumb" style="background-image:url('+img+')"></div>';
  return '<div class="thumb thumb-emoji">'+((TYPE_META[ty]||TYPE_META.DOC)[0])+'</div>';
}
function clueMeta(ty,title,locked,open){
  var badge=locked?(open?'✓ 열람':'🔒 잠김'):'개방';
  return '<div class="lockbadge">'+badge+'</div><div class="meta"><div class="name">'+title+'</div><div class="tag">'+((TYPE_META[ty]||TYPE_META.DOC)[1])+'</div></div>';
}
function evPhotoCard(title,src){
  var b=document.createElement('button'); b.type='button'; b.className='card cluecard';
  b.innerHTML=clueThumb('PHOTO',src)+clueMeta('PHOTO',title,false,true);
  b.onclick=function(){ openLightbox(src,title); };
  return b;
}
function openLightbox(src,cap){
  var lb=document.getElementById('lightbox'); if(!lb) return;
  document.getElementById('lbImg').src=src;
  document.getElementById('lbCap').textContent=cap||'';
  lb.classList.remove('hidden');
}
function renderClues(id){
  var c=el.querySelector('.content'); if(!c) return;
  var isRoom=DATA.locIds.indexOf(id)>=0;
  if(isRoom){
    var kids=Array.prototype.slice.call(c.childNodes);
    var out=document.createDocumentFragment(); var i=0;
    while(i<kids.length){
      var node=kids[i]; var tag=node.nodeType===1?node.tagName.toLowerCase():'';
      if(tag==='h3'||tag==='h4'){
        var sect=[], j=i+1;
        while(j<kids.length){ var nt=kids[j].nodeType===1?kids[j].tagName.toLowerCase():''; if(nt==='h1'||nt==='h2'||nt==='h3'||nt==='h4') break; sect.push(kids[j]); j++; }
        var img=null, link=false;
        sect.forEach(function(s){ if(s.querySelector){ var q=s.querySelector('img'); if(q&&!img)img=q; if(s.querySelector('a.navlink'))link=true; } });
        if(img&&!link){ out.appendChild(evPhotoCard((node.textContent||'').trim()||'현장 사진', img.getAttribute('src'))); i=j; continue; }
        if(link&&!img){ sect.forEach(function(s){ out.appendChild(s); }); i=j; continue; }
        out.appendChild(node); i++; continue;
      }
      if(tag==='p' && node.querySelector('img') && !node.querySelector('a')){
        out.appendChild(evPhotoCard('현장 사진', node.querySelector('img').getAttribute('src'))); i++; continue;
      }
      out.appendChild(node); i++;
    }
    while(c.firstChild) c.removeChild(c.firstChild); c.appendChild(out);
  }
  c.querySelectorAll('a.navlink[data-target]').forEach(function(a){
    var tid=a.getAttribute('data-target'); var n=N[tid]; if(!n) return;
    var ty=clueType(n); var open=isUnlocked(tid);
    var img=(ty==='PHOTO')?firstImg(n.html):null;
    a.className='card cluecard '+(n.locked?(open?'unlocked':'locked'):'');
    a.innerHTML=clueThumb(ty,img)+clueMeta(ty,n.title,n.locked,open);
    var pp=a.parentNode; if(pp&&pp.tagName==='P'&&pp.childNodes.length===1){ pp.parentNode.replaceChild(a,pp); }
  });
  var ns=Array.prototype.slice.call(c.childNodes);
  var out2=document.createDocumentFragment(); var grid=null;
  ns.forEach(function(node){
    if(node.nodeType!==1){ if(/\S/.test(node.textContent||'')){ grid=null; out2.appendChild(node); } return; }
    var isCard=node.classList && node.classList.contains('card');
    if(isCard){ if(!grid){ grid=document.createElement('div'); grid.className='grid cluegrid'; out2.appendChild(grid); } grid.appendChild(node); }
    else { grid=null; out2.appendChild(node); }
  });
  while(c.firstChild) c.removeChild(c.firstChild); c.appendChild(out2);
}
(function(){ var lb=document.getElementById('lightbox'); if(!lb) return;
  var b=document.getElementById('lbClose'); if(b) b.onclick=function(){ lb.classList.add('hidden'); };
  lb.addEventListener('click',function(e){ if(e.target===lb) lb.classList.add('hidden'); });
})();
const RECORDER_ID='37281d1c9e1480009b17e98839289adb';
function recorderReady(){return lockedIds.every(function(id){return id===RECORDER_ID||unlocked[id];});}
function hideRecorderLink(){if(recorderReady())return;var rl=el.querySelector('[data-target="'+RECORDER_ID+'"]');if(rl){var p=rl.closest('p')||rl;p.style.display='none';}}
function maybeRevealRecorder(){if(recorderReady()&&!localStorage.getItem('dsbp_recorder_revealed')){try{localStorage.setItem('dsbp_recorder_revealed','1');}catch(e){}var m=$('#recorderModal');if(m)m.classList.remove('hidden');}}
function trigTrack(id){ return (DATA.triggers && DATA.triggers[id]) || null; }
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ---- breadcrumb ----
function crumbFor(id){
  const path=[]; let c=id;
  while(c && c!==HUB){ path.unshift(N[c]?N[c].title:c); c=parent[c]; }
  const parts=['<b onclick="">전시관</b>'].concat(path.map((t,i)=> i===path.length-1?('<b>'+t+'</b>'):t ));
  return parts.join(' <span style="color:var(--dim)">›</span> ');
}

// ---- render hub ----
function renderHub(){
  let h='<div class="view-head"><div class="eyebrow">도원관 · 나의 완벽한 가족</div>'+
        '<h1>전시관 도면</h1><div class="rule"></div></div>'+
        '<p class="hub-intro">각 공간을 조사해 단서를 모으세요. 🔒 표시된 공간과 문서는 다른 곳에서 찾은 비밀번호로 열립니다.</p>';
  h+='<div class="grid">';
  for(const id of DATA.locIds){
    const n=N[id]; const th=(DATA.bg&&DATA.bg[id])||firstImg(n.html); const open=isUnlocked(id);
    const badge = n.locked ? (open?'✓ 열림':'🔒 잠김') : '· 개방';
    h+='<div class="card '+(n.locked?(open?'unlocked':'locked'):'')+'" data-go="'+id+'">'+
       '<div class="lockbadge">'+badge+'</div>'+
       '<div class="thumb" style="'+(th?('background-image:url(\''+th+'\')'):'')+'"></div>'+
       '<div class="meta"><div class="name">'+n.title+'</div>'+
       '<div class="tag">'+(n.children.length?(n.children.length+'개 단서'):'현장')+'</div></div></div>';
  }
  h+='</div>';
  h+='<div class="section-label">자료실</div><div class="special-row">';
  if(DATA.charactersId){const c=N[DATA.charactersId];
    h+='<div class="chip-card" data-go="'+DATA.charactersId+'"><div class="ic">👥</div><div><div class="t">등장인물</div><div class="s">초대된 6인과 회장</div></div></div>';}
  h+='<div class="chip-card danger-card" id="accuseOpen"><div class="ic">🔎</div><div><div class="t">탐색 종료하기</div><div class="s">범인을 지목하세요</div></div></div>';
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>navigate(c.getAttribute('data-go')));
  $('#accuseOpen').onclick=openAccuse;
  $('#crumb').innerHTML='<b>전시관</b>';
}

// ---- render 등장인물 carousel ----
function renderCharacters(){
  const cs=DATA.characters||[];
  let h='<div class="view-head"><div class="eyebrow">자료실</div><h1>등장인물</h1><div class="rule"></div></div>';
  h+='<div class="carousel"><button class="cararrow" id="charPrev" aria-label="이전">‹</button>';
  h+='<div class="carwin"><div class="cardstage" id="charStage">';
  cs.forEach(c=>{ h+='<article class="pcard"><div class="pcard-img"><img src="'+c.img+'" alt="'+c.name+'" loading="lazy"></div><div class="pcard-body"><h2>'+c.name+'</h2><div class="pcard-meta">'+c.meta+'</div><div class="pcard-desc">'+c.desc+'</div></div></article>'; });
  h+='</div></div><button class="cararrow" id="charNext" aria-label="다음">›</button></div>';
  h+='<div class="cardots" id="charDots"></div><div class="carcount" id="charCount"></div>';
  el.innerHTML=h;
  const stage=$('#charStage'), dots=$('#charDots'), cnt=$('#charCount');
  dots.innerHTML=cs.map((_,i)=>'<span class="dot" data-i="'+i+'"></span>').join('');
  let idx=0;
  function show(n){ idx=(n+cs.length)%cs.length; stage.style.transform='translateX('+(-idx*100)+'%)';
    Array.from(dots.children).forEach((d,i)=>d.classList.toggle('on',i===idx));
    cnt.textContent=(idx+1)+' / '+cs.length;
    const body=stage.children[idx].querySelector('.pcard-body'); if(body) body.scrollTop=0; }
  window._charShow=show; window._charIdx=()=>idx;
  $('#charPrev').onclick=()=>show(idx-1); $('#charNext').onclick=()=>show(idx+1);
  Array.from(dots.children).forEach(d=>d.onclick=()=>show(+d.getAttribute('data-i')));
  // swipe
  let sx=null; const win=stage.parentNode;
  win.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  win.addEventListener('touchend',e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45){ show(dx<0?idx+1:idx-1);} sx=null; },{passive:true});
  show(0);
  $('#crumb').innerHTML=crumbFor(DATA.charactersId);
}
// ---- render briefing (도입부) ----
function renderBrief(){
  let h='<div class="view-head"><div class="eyebrow">사건 도입부</div><h1>사건 개요</h1><div class="rule"></div></div>';
  h+='<div class="content brief-view">'+DATA.introHtml+'</div>';
  el.innerHTML=h;
  $('#crumb').innerHTML='<b>전시관</b> <span style="color:var(--dim)">\u203a</span> <b>사건 개요</b>';
}
// ---- render a node ----
function renderNode(id){
  const n=N[id];
  if(n.locked && !unlocked[id]){ renderLock(id); }
  else { renderContent(id); }
  $('#crumb').innerHTML=crumbFor(id);
}
function renderContent(id){
  const n=N[id];
  let h='<div class="view-head"><div class="eyebrow">'+(parent[id]&&parent[id]!==DATA.rootId?(N[parent[id]].title):'단서 조사')+'</div>'+
        '<h1>'+n.title+'</h1><div class="rule"></div></div>';
  h+='<div class="content">'+n.html+'</div>';
  el.innerHTML=h;
  bindNav();
  renderClues(id);
  initInviteSlider();
  hideRecorderLink();
}
function initInviteSlider(){
  const box=el.querySelector('[data-invite-slider]');
  if(!box) return;
  const dataEl=box.querySelector('[data-invite-data]');
  if(!dataEl) return;
  let invites=[];
  const rawData=dataEl.textContent||'[]';
  try{invites=JSON.parse(rawData)}catch(e){}
  if(!invites.length) return;
  let current=0;
  const img=box.querySelector('[data-invite-image]');
  const nameEl=box.querySelector('[data-invite-name]');
  const countEl=box.querySelector('[data-invite-count]');
  const dotsEl=box.querySelector('[data-invite-dots]');
  function show(index){
    current=(index+invites.length)%invites.length;
    const invite=invites[current];
    img.src=invite.src; img.alt=invite.name;
    nameEl.textContent=invite.name;
    countEl.textContent=(current+1)+' / '+invites.length;
    dotsEl.innerHTML=invites.map((_,i)=>'<button type="button" class="dot '+(i===current?'active':'')+'" data-i="'+i+'" aria-label="'+invites[i].name+'"></button>').join('');
    dotsEl.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>show(+d.getAttribute('data-i')));
  }
  box.querySelector('[data-invite-prev]').onclick=()=>show(current-1);
  box.querySelector('[data-invite-next]').onclick=()=>show(current+1);
  show(0);
}
function bindNav(){
  el.querySelectorAll('a.navlink').forEach(a=>{
    a.onclick=(e)=>{e.preventDefault();navigate(a.getAttribute('data-target'));};
  });
}
function renderLock(id){
  const n=N[id];
  const hint=lockHint(n);
  let h='<div class="view-head"><div class="eyebrow">잠긴 공간</div><h1>'+n.title+'</h1><div class="rule"></div></div>';
  h+='<div class="lockwrap"><div class="lockcard" id="lc"><div class="lockic">🔒</div>'+
     '<h2>입장 비밀번호</h2><p class="l">이 곳은 잠겨 있습니다. 단서로 얻은 비밀번호를 입력하세요.</p>';
  if(n.lock_type==='sequence'){
    h+='<div class="seqrow">';
    n.answers.forEach((_,i)=>{ h+='<div class="dial"><span>'+(i+1)+'</span><input class="seqinp" inputmode="text" autocomplete="off"></div>'; });
    h+='</div>';
  } else {
    h+='<div class="pwrow"><input id="pwin" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호 입력"></div>';
  }
  h+='<button class="lockbtn" id="pwbtn">입장</button>'+
     (hint?'<div class="lockhint">비밀번호 형식: '+hint+'</div>':'')+
     '<div class="lockhint">입력 시 공백, 점, 하이픈, ‘월/일’ 표기는 자동으로 정리됩니다.</div>'+
     '<div class="lockerr" id="pwerr"></div></div></div>';
  el.innerHTML=h;
  const submit=()=>tryUnlock(id);
  $('#pwbtn').onclick=submit;
  el.querySelectorAll('input').forEach((inp,i,arr)=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(i<arr.length-1 && arr[i+1]) arr[i+1].focus(); else submit(); } });
  });
  const f=el.querySelector('input'); if(f) f.focus();
}
function tryUnlock(id){
  const n=N[id]; let ok=false;
  if(n.lock_type==='sequence'){
    const vals=Array.from(el.querySelectorAll('.seqinp')).map(i=>normPw(i.value));
    ok = vals.length===n.answers.length && vals.every((v,i)=>v===n.answers[i]);
  } else {
    const v=normPw($('#pwin').value);
    ok = n.answers.includes(v);
  }
  if(ok){
    unlocked[id]=true; store.set(unlocked); updateProgress(); maybeRevealRecorder();
    toast('🔓 '+n.title+' 잠금 해제');
    enteredExploration=true;
    const _tt=trigTrack(id); if(_tt) playTrack(_tt);
    renderNode(id);
    refreshHubBadgeMaybe();
  } else {
    const lc=$('#lc'); lc.classList.remove('shake'); void lc.offsetWidth; lc.classList.add('shake');
    $('#pwerr').textContent='비밀번호가 맞지 않습니다.';
  }
}
function refreshHubBadgeMaybe(){}

// ---- navigation ----
function setRoomBg(id){
  const rb=$('#roomBg'); const u=(DATA.bg&&DATA.bg[id])||null;
  if(u){ rb.style.backgroundImage="linear-gradient(180deg,rgba(7,5,4,.52) 0%,rgba(7,5,4,.74) 52%,rgba(7,5,4,.9) 100%), url('"+u+"')"; rb.classList.add('show'); }
  else { rb.classList.remove('show'); }
}
function navigate(id,fromBack){
  if(!fromBack){ if(stack[stack.length-1]!==id) stack.push(id); }
  window.scrollTo({top:0,behavior:'smooth'});
  if(id===HUB) renderHub(); else if(id===BRIEF) renderBrief(); else if(id===DATA.charactersId) renderCharacters(); else renderNode(id);
  setRoomBg(id);
  // BGM: main theme(Wedding) plays from the hub; a trigger evidence (once revealed) changes it and persists.
  const _tt = (N[id] && isUnlocked(id)) ? trigTrack(id) : null;
  if(_tt) playTrack(_tt);
  $('#backBtn').style.visibility = stack.length>1?'visible':'hidden';
}
function goBack(){
  if(stack.length>1){ stack.pop(); navigate(stack[stack.length-1],true); }
}
$('#briefBtn').onclick=()=>navigate(BRIEF);
$('#charBtn').onclick=()=>{ if(DATA.charactersId) navigate(DATA.charactersId); };
function syncTopPad(){ const tb=$('#topbar'); if(tb.classList.contains('hidden')) return; el.style.paddingTop=(tb.offsetHeight+20)+'px'; }
window.addEventListener('resize',syncTopPad);
$('#homeBtn').onclick=()=>{stack=[HUB];navigate(HUB,true);};
$('#backBtn').onclick=goBack;
$('#resetBtn').onclick=()=>{
  if(confirm('진행 상황(해금된 잠금)을 모두 초기화하고 처음부터 시작할까요?')){
    unlocked={};store.set(unlocked);location.reload();
  }
};

// ---- solution modal ----
// ---- progress (password-locked clues explored) ----
const lockedIds=Object.keys(N).filter(id=>N[id].locked);
function updateProgress(){
  const done=lockedIds.filter(id=>unlocked[id]).length, tot=lockedIds.length||1;
  const pct=Math.round(done/tot*100);
  const p=$('#progress'); if(p){ p.textContent='탐색 '+pct+'%'; p.title='비밀번호 잠금 '+done+'/'+tot+' 해제'; }
}
// ---- accusation ----
function ahash(t){var MOD=1000000007,x=0;for(var i=0;i<t.length;i++){x=(x*131+t.charCodeAt(i))%MOD;}return x;}
function openAccuse(){
  const box=$('#suspectList'); const sus=DATA.suspects.slice();
  for(let i=sus.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=sus[i];sus[i]=sus[j];sus[j]=t;}
  box.innerHTML=sus.map(s=>'<button class="suspect" data-n="'+s.name+'"><img src="'+s.img+'" alt="" loading="lazy"><div class="sinfo"><b>'+s.name+'</b><span>'+s.role+'</span></div></button>').join('');
  $('#accuseFb').textContent=''; $('#accuseFb').className='accuse-feedback';
  $('#accuseReveal').classList.add('hidden'); $('#accuseTitle').textContent='범인 지목';
  box.querySelectorAll('.suspect').forEach(b=>b.onclick=()=>guess(b.getAttribute('data-n'),b));
  $('#accuseModal').classList.remove('hidden');
}
function guess(name,btn){
  const fb=$('#accuseFb');
  if(ahash(name)===DATA.answerHash){
    fb.textContent='맞습니다! 당신은 사건의 진상에 도달했습니다.'; fb.className='accuse-feedback ok';
    $$('.suspect').forEach(b=>{b.disabled=true; if(b===btn) b.classList.add('chosen');});
    $('#accuseReveal').classList.remove('hidden');
    $('#accuseTitle').textContent='정답입니다';
  } else {
    fb.textContent='아닙니다! 단서를 다시 살펴보세요.'; fb.className='accuse-feedback no';
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
  }
}
$('#accuseClose').onclick=()=>$('#accuseModal').classList.add('hidden');
var _rm=$('#recorderModal');
$('#recorderClose').onclick=()=>{_rm.classList.add('hidden');};
$('#recorderGo').onclick=()=>{_rm.classList.add('hidden');navigate(parent[RECORDER_ID]||DATA.rootId);};
$('#accuseReveal').onclick=()=>{ $('#accuseModal').classList.add('hidden'); navigate(DATA.solutionId); };

// ---- intro ----
$('#introBg').style.backgroundImage="url('"+DATA.cover+"')";
$('#introBody').innerHTML=DATA.introHtml;
$('#enterBtn').onclick=()=>{
  startIntroMusic(); // 소개 화면: Danse Macabre 재생
  $('#introBody').classList.remove('hidden');
  $('#startBtn').classList.remove('hidden');
  const nt=document.querySelector('.intro-note'); if(nt) nt.classList.remove('hidden');
  const en=document.querySelector('.enter-note'); if(en) en.classList.add('hidden');
  $('#enterBtn').classList.add('hidden');
  setTimeout(()=>{ $('#introBody').scrollIntoView({behavior:'smooth',block:'nearest'}); },60);
};
$('#startBtn').onclick=()=>{
  A.ready=true;
  // prime audio on gesture
  A.els.forEach(a=>{a.volume=0;});
  $('#intro').classList.add('hidden');
  $('#topbar').classList.remove('hidden');
  $('#view').classList.remove('hidden');
  stack=[HUB];
  navigate(HUB,true);
  syncTopPad();
  updateProgress();
  playTrack(DATA.mainTheme); // 전시관 도면(허브)부터는 잔잔한 메인 테마(Wedding)
};
// keyboard: backspace? no. Esc closes modal
// 인트로 화면에서 첫 상호작용 시 Danse Macabre 재생 (자동재생 정책 대응)
var introMusicStarted=false;
function startIntroMusic(){ if(introMusicStarted) return; introMusicStarted=true; A.ready=true; A.els.forEach(a=>a.volume=0); playTrack(DATA.introTheme); }
['pointerdown','wheel','touchstart','keydown'].forEach(ev=>$('#intro').addEventListener(ev,startIntroMusic,{once:true,passive:true}));
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#accuseModal').classList.add('hidden'); var _rm2=$('#recorderModal'); if(_rm2) _rm2.classList.add('hidden'); var _lb=$('#lightbox'); if(_lb) _lb.classList.add('hidden'); } const st=$('#charStage'); if(st){ if(e.key==='ArrowLeft'){$('#charPrev').click();} else if(e.key==='ArrowRight'){$('#charNext').click();} } });
}
</script>
</body>
