<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>발송하는 초대장</title><style>
:root{--bg:#090908;--panel:#151210;--text:#eee8dc;--muted:#b9aa91;--gold:#c8a767;--line:#40362a;--danger:#8d2e2e;}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#21180f,#090908 55%);color:var(--text);font-family:Inter,Apple SD Gothic Neo,Malgun Gothic,sans-serif;line-height:1.75;}
a{color:#e4c77e;text-decoration:none;border-bottom:1px solid rgba(228,199,126,.35)} a:hover{color:#fff2bd}.wrap{max-width:980px;margin:0 auto;padding:44px 22px 90px}.topbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:24px;color:var(--muted);font-size:14px}.home{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.03)}.page{background:rgba(18,15,13,.92);border:1px solid var(--line);border-radius:22px;padding:34px;box-shadow:0 20px 80px rgba(0,0,0,.35)}
h1{font-size:36px;line-height:1.2;margin:0 0 24px;border-bottom:1px solid var(--line);padding-bottom:16px}h2{font-size:25px;margin-top:34px;color:#f4d891}h3{font-size:19px;margin-top:28px;color:#d9c9a9}p{margin:12px 0}blockquote,.aside{border-left:4px solid var(--gold);background:rgba(200,167,103,.08);padding:14px 18px;border-radius:12px;margin:18px 0;color:#eadfca}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted)}
.slider{position:relative;margin-top:24px;border:1px solid var(--line);border-radius:18px;background:#080706;overflow:hidden}.slide-frame{min-height:520px;display:flex;align-items:center;justify-content:center;padding:20px}.slide-frame img{display:block;max-width:100%;max-height:72vh;height:auto;border-radius:12px;border:1px solid #332a22;box-shadow:0 16px 48px rgba(0,0,0,.32);object-fit:contain}.nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid rgba(200,167,103,.7);background:rgba(8,7,6,.8);color:#ffe0a1;font-size:28px;line-height:1;cursor:pointer}.nav-btn:hover{background:rgba(200,167,103,.2)}.prev{left:14px}.next{right:14px}.caption{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:12px 16px;color:var(--muted);font-size:14px}.dots{display:flex;gap:7px;justify-content:center;margin-top:14px}.dot{width:10px;height:10px;border-radius:50%;border:1px solid #6a573e;background:transparent;cursor:pointer}.dot.active{background:var(--gold)}
@media(max-width:640px){.page{padding:22px;border-radius:16px}h1{font-size:28px}.wrap{padding:24px 12px 70px}.slide-frame{min-height:360px;padding:12px}.nav-btn{width:38px;height:38px;font-size:24px}.caption{display:block}.caption span{display:block}}
</style></head><body><main class="wrap"><div class="topbar"><a class="home" href="../../index.html">← 사건 메인으로</a><span class="badge">추리 게임 HTML</span></div><article class="page"><h1>발송하는 초대장</h1>
<p class="aside">초대장의 드레스코드는 각각 도세아가 자체적으로 선정한 것입니다.</p>
<section class="slider" aria-label="발송 초대장">
<div class="slide-frame"><img id="invite-slide" src="초대장/도세아초대장.png" alt="도세아 초대장"></div>
<button class="nav-btn prev" type="button" onclick="moveSlide(-1)" aria-label="이전 초대장">‹</button>
<button class="nav-btn next" type="button" onclick="moveSlide(1)" aria-label="다음 초대장">›</button>
<div class="caption"><strong id="invite-name">도세아 초대장</strong><span id="invite-count">1 / 6</span></div>
</section>
<div class="dots" id="invite-dots" aria-label="초대장 위치"></div>
</article></main><script>
const invites=[
  {name:'도세아 초대장', src:'초대장/도세아초대장.png'},
  {name:'도윤재 초대장', src:'초대장/도윤재초대장.png'},
  {name:'도이준 초대장', src:'초대장/도이준초대장.png'},
  {name:'문해준 초대장', src:'초대장/문해준초대장.png'},
  {name:'백기태 초대장', src:'초대장/백기태초대장.png'},
  {name:'서리나 초대장', src:'초대장/서리나초대장.png'}
];
let current=0;
const img=document.getElementById('invite-slide');
const nameEl=document.getElementById('invite-name');
const countEl=document.getElementById('invite-count');
const dotsEl=document.getElementById('invite-dots');
function renderDots(){
  dotsEl.innerHTML='';
  invites.forEach((invite,index)=>{
    const dot=document.createElement('button');
    dot.type='button';
    dot.className='dot'+(index===current?' active':'');
    dot.setAttribute('aria-label',invite.name);
    dot.onclick=()=>showSlide(index);
    dotsEl.appendChild(dot);
  });
}
function showSlide(index){
  current=(index+invites.length)%invites.length;
  const invite=invites[current];
  img.src=invite.src;
  img.alt=invite.name;
  nameEl.textContent=invite.name;
  countEl.textContent=(current+1)+' / '+invites.length;
  renderDots();
}
function moveSlide(delta){showSlide(current+delta)}
document.addEventListener('keydown',event=>{
  if(event.key==='ArrowLeft')moveSlide(-1);
  if(event.key==='ArrowRight')moveSlide(1);
});
renderDots();
</script></body></html>
