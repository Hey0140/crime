h1{font-size:36px;line-height:1.2;margin:0 0 24px;border-bottom:1px solid var(--line);padding-bottom:16px}h2{font-size:25px;margin-top:34px;color:#f4d891}h3{font-size:19px;margin-top:28px;color:#d9c9a9}p{margin:12px 0}ul,ol{padding-left:24px}li{margin:7px 0}blockquote,.aside{border-left:4px solid var(--gold);background:rgba(200,167,103,.08);padding:14px 18px;border-radius:12px;margin:18px 0;color:#eadfca}pre{background:#080706;border:1px solid #332a22;border-radius:12px;padding:16px;overflow:auto}code{font-family:Consolas,monospace;color:#ffe0a1}hr{border:0;border-top:1px solid var(--line);margin:28px 0}img{display:block;max-width:100%;height:auto;margin:18px auto;border-radius:16px;border:1px solid #332a22;box-shadow:0 16px 48px rgba(0,0,0,.32);object-fit:contain}table{width:100%;border-collapse:collapse;margin:18px 0}td,th{border:1px solid var(--line);padding:9px}.lockbox{border:1px solid rgba(200,167,103,.65);background:linear-gradient(135deg,rgba(70,43,19,.75),rgba(18,15,13,.95));padding:22px;border-radius:18px;margin:0 0 28px}.lock-title{font-size:22px;font-weight:800;color:#ffe0a1;margin-bottom:8px}.lock-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.pw-input{flex:1;min-width:220px;background:#080706;border:1px solid #5b4a36;color:white;border-radius:12px;padding:13px 14px;font-size:16px}.btn{background:var(--gold);border:0;color:#16110b;font-weight:800;border-radius:12px;padding:13px 18px;cursor:pointer}.hint{font-size:13px;color:var(--muted);margin-top:8px}.error{color:#ff9b9b;display:none;margin-top:10px}.locked-content{display:none}.locked .locked-content{display:none}.unlocked .locked-content{display:block}.unlocked .lockbox{display:none}.badge{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted)}
@media(max-width:640px){.page{padding:22px;border-radius:16px}h1{font-size:28px}.wrap{padding:24px 12px 70px}.lock-row{display:block}.pw-input,.btn{width:100%;margin-top:8px}}
</style><script>
function normPw(s){return (s||'').toString().replace(/월|일|년/g,'').replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();}
function unlockPage(id, answers){
  const input=document.getElementById('pw-'+id); const err=document.getElementById('err-'+id);
  const v=normPw(input.value);
  if(answers.map(normPw).includes(v)){
    document.body.classList.add('unlocked'); document.body.classList.remove('locked');
    try{sessionStorage.setItem('unlocked:'+location.pathname,'1')}catch(e){}
  }else{err.style.display='block'; input.focus();}
}
window.addEventListener('DOMContentLoaded',()=>{try{if(sessionStorage.getItem('unlocked:'+location.pathname)==='1'){document.body.classList.add('unlocked');document.body.classList.remove('locked')}}catch(e){}; document.querySelectorAll('.pw-input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')i.nextElementSibling.click()}));});
</script></head><body class="unlocked"><main class="wrap"><div class="topbar"><a class="home" href="../index.html">← 사건 메인으로</a><span class="badge">추리 게임 HTML</span></div><article class="page"><h1>백기태 진료실</h1>
