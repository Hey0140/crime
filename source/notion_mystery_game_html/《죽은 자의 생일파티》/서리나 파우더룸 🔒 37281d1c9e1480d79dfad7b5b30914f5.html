</style><script>
function normPw(s){return (s||'').toString().replace(/월|일|년/g,'').replace(/[^0-9A-Za-z가-힣]/g,'').toLowerCase();}
function unlockPage(id, answers){
  const input=document.getElementById('pw-'+id); const err=document.getElementById('err-'+id);
  const v=normPw(input.value);
  if(answers.map(normPw).includes(v)){
    document.body.classList.add('unlocked'); document.body.classList.remove('locked');
    try{sessionStorage.setItem('unlocked:'+location.pathname,'1')}catch(e){}
  }else{err.style.display='block'; input.focus();}
}
function pwShape(answer){
  const s=normPw(answer);
  const kind=/^[0-9]+$/.test(s)?'숫자':/^[a-z]+$/.test(s)?'영문':/^[0-9a-z]+$/.test(s)?'영문+숫자':'문자';
  return kind+' '+s.length+'자리';
}
function addPwHints(){
  document.querySelectorAll('.lockbox').forEach(box=>{
    const btn=box.querySelector('.btn[onclick^="unlockPage"]'); const hint=box.querySelector('.hint');
    if(!btn||!hint||hint.dataset.shapeAdded==='1')return;
    const m=(btn.getAttribute('onclick')||'').match(/unlockPage\("[^"]+",(\[[^\]]+\])\)/);
    if(!m)return;
    try{const answers=JSON.parse(m[1]); if(answers.length){hint.textContent='비밀번호 형식: '+pwShape(answers[0])+'입니다. '+hint.textContent; hint.dataset.shapeAdded='1';}}catch(e){}
  });
}
window.addEventListener('DOMContentLoaded',()=>{try{if(sessionStorage.getItem('unlocked:'+location.pathname)==='1'){document.body.classList.add('unlocked');document.body.classList.remove('locked')}}catch(e){}; addPwHints(); document.querySelectorAll('.pw-input').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')i.nextElementSibling.click()}));});
</script></head><body class="locked"><main class="wrap"><div class="topbar"><a class="home" href="../index.html">← 사건 메인으로</a><span class="badge">추리 게임 HTML</span></div><article class="page"><section class="lockbox"><div class="lock-title">🔒 입장 비밀번호</div><div>이 문서는 잠겨 있습니다. 단서로 얻은 비밀번호를 입력하면 내용이 열립니다.</div><div class="lock-row"><input class="pw-input" id="pw-5743723" type="password" placeholder="비밀번호 입력" autocomplete="off"><button class="btn" onclick='unlockPage("5743723",["0321"])'>입장</button></div><div class="hint">입력 시 공백, 점, 하이픈, ‘월/일’ 표기는 자동으로 정리됩니다.</div><div class="error" id="err-5743723">비밀번호가 맞지 않습니다.</div></section><div class="locked-content"><h1>서리나 파우더룸  🔒</h1>
