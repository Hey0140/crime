c/p>\n","track":"soundtrack/signal-to-noise-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e1480d3b3c2ebc0565b0daa":{"id":"37381d1c9e1480d3b3c2ebc0565b0daa","title":"생일파티 당일 지하 주차장 CCTV 캡처","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 지하 2층 주차장 CCTV 캡처 기록\u003c/p>\n\u003cp>관리부서: 도원관 보안실\u003c/p>\n\u003cp>촬영 위치: B2 주차구역 / VIP 전용 주차라인\u003c/p>\n\u003cp>촬영일자: 2026년 12월 25일\u003c/p>\n\u003cp>촬영 시각: 19:06 ~ 19:14\u003c/p>\n\u003cp>문서 상태: 캡처 이미지 설명 출력본\u003c/p>\n\u003chr/>\n\u003ch2>CCTV 캡처 설명\u003c/h2>\n\u003ch3>19:06:12\u003c/h3>\n\u003cp>도이준이 엘리베이터에서 내려 지하 2층 주차장으로 이동한다.\u003c/p>\n\u003cp>복장은 생일파티용 정장 차림이지만, 넥타이가 풀려 있고 걸음이 급하다.\u003c/p>\n\u003cp>오른손에는 휴대폰을 들고 있으며, 통화 중인 것으로 보인다.\u003c/p>\n\u003chr/>\n\u003ch3>19:07:48\u003c/h3>\n\u003cp>도이준이 검은색 SUV 차량 뒤쪽으로 이동한다.\u003c/p>\n\u003cp>차량 번호판은 일부 가려져 있으나, 도이준 명의 차량으로 등록된 것으로 확인된다.\u003c/p>\n\u003cp>도이준은 주변을 두 번 이상 확인한 뒤 트렁크를 연다.\u003c/p>\n\u003chr/>\n\u003ch3>19:08:31\u003c/h3>\n\u003cp>도이준이 차량 트렁크에서 검은색 보스턴백을 꺼낸다.\u003c/p>\n\u003cp>가방은 무거워 보이며, 도이준은 한 손으로 들다가 다시 양손으로 고쳐 든다.\u003c/p>\n\u003cp>이 장면만 보면 가방 안에 수상한 물건이 들어 있는 것처럼 보인다.\u003c/p>\n\u003chr/>\n\u003ch3>19:09:42\u003c/h3>\n\u003cp>도이준이 다시 휴대폰 통화를 한다.\u003c/p>\n\u003cp>통화 중 얼굴을 찡그리고, 차량 문을 발로 차는 듯한 행동을 한다.\u003c/p>\n\u003cp>음성은 녹음되지 않았으나, 입 모양상 “기다리라고 했잖아”라고 말하는 듯 보인다.\u003c/p>\n\u003chr/>\n\u003ch3>19:11:56\u003c/h3>\n\u003cp>도이준이 보스턴백을 열어 내부를 확인한다.\u003c/p>\n\u003cp>가방 안에는 두꺼운 서류 봉투 1개와 현금 다발로 보이는 물체 일부가 보인다.\u003c/p>\n\u003cp>도이준은 서류 봉투를 꺼내 확인한 뒤 다시 급하게 가방 안에 넣는다.\u003c/p>\n\u003chr/>\n\u003ch3>19:13:20\u003c/h3>\n\u003cp>도이준이 주차장 기둥 뒤쪽으로 이동해 누군가에게 메시지를 보내는 모습이 포착된다.\u003c/p>\n\u003cp>잠시 후 휴대폰 화면을 보고 고개를 숙인다.\u003c/p>\n\u003chr/>\n\u003ch3>19:14:07\u003c/h3>\n\u003cp>도이준이 보스턴백을 들고 엘리베이터 방향으로 이동한다.\u003c/p>\n\u003cp>이동 방향은 중앙 생일홀이 아니라, 대기실과 연결되는 후방 복도 쪽이다.\u003c/p>\n\u003chr/>\n","track":"soundtrack/signal-to-noise-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480c4a5f0f98e81e1bd47":{"id":"37281d1c9e1480c4a5f0f98e81e1bd47","title":"0000 00 기록실","locked":true,"lock_type":"single","answers":["950505"],"children":["37281d1c9e14804b889ac4ab18734df1","37281d1c9e14805c81a2e4c0243c63d1","37281d1c9e14800cb853f78b0658ada3","37281d1c9e148033b561ed26e9430e79"],"html":"\n\u003ch1>놀이공원 사건 기록실 🔒\u003c/h1>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14804b889ac4ab18734df1\" href=\"javascript:void(0)\">[폐쇄자료] 1996.07.12 도원유원지 서측 리프트 추락 사고 내부 보고\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14805c81a2e4c0243c63d1\" href=\"javascript:void(0)\">스카이캐슬 리프트 일일 안전 점검표\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14800cb853f78b0658ada3\" href=\"javascript:void(0)\">도원랜드 리프트 사고, 탑승객 안전수칙 미준수 가능성\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e148033b561ed26e9430e79\" href=\"javascript:void(0)\">비공개 00 00 00서 🔒\u003c/a>\u003c/p>\n","track":"soundtrack/tragedy-by-alex-productions.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480739967cbf1bc5b8255":{"id":"37281d1c9e1480739967cbf1bc5b8255","title":"도진명이 모아둔 생일카드들","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\u003ch1>도진명이 모아둔 생일카드들\u003c/h1>\n\u003cp>\u003cimg src=\"notion_mystery_game_html/《죽은 자의 생일파티》/회장 개인 전시실 🔒/%EB%8F%84%EC%A7%84%EB%AA%85%EC%9D%B4%20%EB%AA%A8%EC%95%84%EB%91%94%20%EC%83%9D%EC%9D%BC%EC%B9%B4%EB%93%9C%EB%93%A4/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_09_53_17.png\" alt=\"2005년 12월 25일\" />\u003c/p>\n\u003cp>2005년 12월 25일\u003c/p>\n\u003cpre>\u003ccode>[도윤재, 16세]\n\n아빠 생일 축하드려요.\n어제 생일 선물로 주신 만년필로 이 편지를 쓰고 있어요.\n\n저는 아빠가 제일 좋아하는 넥타이를 골라봤어요.\n저도 나중에 아빠처럼 양복 입고 회사에 갈 거예요.\n아빠처럼 회사를 지키는 사람이 될게요.\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>[도세아, 11세]\n생일 축하해. 아빠.\n\n아빠가 저번에 고양이 귀엽다고 했잖아.\n막 간식도 주고 밥도 주던 그 검은 고양이.\n정원 뒤쪽에 있었는데, 내가 가까이 가도 도망 안 가더라구\n\n아빠 주려고 데려오는데 자꾸 할퀴는 거야\n그래서 뭐 좀 먹였더니 조용해지더라구\n\n그래서 금방 데려왔어.\n\n근데,\n처음엔 자는 줄 알았는데,\n계속 안 움직였어.\n\n그래도 괜찮지?\n\n안 움직이니까 더 얌전하고,\n도망도 안 가고,\n아빠 책상 위에 두면 오래 볼 수 있을 것 같아.\n\n내가 리본도 묶어줬어.\n\n아빠가 좋아했으면 좋겠다.\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode>[도이준, 4세]\n\n아빠 새일 추카해\n근데 케이크 쪼꼬로 사주지, 나 딸키 실어\n이따가 나만 케이크 쪼꼬로 사져\n\u003c/code>\u003c/pre>","track":"soundtrack/growing-up-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14801f8bfac557573fb1e7":{"id":"37381d1c9e14801f8bfac557573fb1e7","title":"지갑 속 숨겨둔 사진","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>\u003cimg alt=\"미안해. 사랑해. 정인아.\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%ED%9A%8C%EC%9E%A5%20%EA%B0%9C%EC%9D%B8%20%EC%A0%84%EC%8B%9C%EC%8B%A4%20%F0%9F%94%92/%EC%A7%80%EA%B0%91%20%EC%86%8D%20%EC%88%A8%EA%B2%A8%EB%91%94%20%EC%82%AC%EC%A7%84/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_10_13_31.png\"/>\u003c/p>\n\u003cp>미안해. 사랑해. 정인아.\u003c/p>\n","track":"soundtrack/wildflowers-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14804b889ac4ab18734df1":{"id":"37281d1c9e14804b889ac4ab18734df1","title":"[폐쇄자료] 1996.07.12 도원유원지 서측 리프트 추락 사고 내부 보고","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서 보관번호: DWL-2004-0712-A\u003c/p>\n\u003cp>사고일자: 1996년 07월 12일\u003c/p>\n\u003cp>사고장소: 도원랜드 서측 구역 / 스카이캐슬 리프트 하차 구간\u003c/p>\n\u003cp>보관부서: 도원그룹 시설안전관리팀\u003c/p>\n\u003cp>열람등급: 내부 제한\u003c/p>\n\u003chr/>\n\u003ch2>1. 사고 개요\u003c/h2>\n\u003cp>1996년 7월 12일 오후 15시 42분경, 도원랜드 서측 구역에 위치한 가족형 공중 리프트 놀이기구 ‘스카이캐슬 리프트’의 하차 구간에서 탑승객 1명이 추락하는 사고가 발생하였다.\u003c/p>\n\u003cp>사고자는 현장에서 응급 처치를 받은 뒤 인근 도원중앙병원으로 이송되었으나, 같은 날 17시 18분 사망 판정을 받았다.\u003c/p>\n\u003cp>사망자 인적사항은 다음과 같다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 09_37_14.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%ED%9A%8C%EC%9E%A5%20%EA%B0%9C%EC%9D%B8%20%EC%A0%84%EC%8B%9C%EC%8B%A4%20%F0%9F%94%92/0000%2000%20%EA%B8%B0%EB%A1%9D%EC%8B%A4%20%F0%9F%94%92/%5B%ED%8F%90%EC%87%84%EC%9E%90%EB%A3%8C%5D%201996%2007%2012%20%EB%8F%84%EC%9B%90%EC%9C%A0%EC%9B%90%EC%A7%80%20%EC%84%9C%EC%B8%A1%20%EB%A6%AC%ED%94%84%ED%8A%B8%20%EC%B6%94%EB%9D%BD%20%EC%82%AC%EA%B3%A0%20%EB%82%B4%EB%B6%80%20%EB%B3%B4%EA%B3%A0/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_09_37_14.png\"/>\u003c/p>\n\u003cul>\n\u003cli>성명: 백하린\u003c/li>\n\u003cli>성별: 여\u003c/li>\n\u003cli>나이: 만 25세\u003c/li>\n\u003cli>동행인: 7세 아들 1명\u003c/li>\n\u003cli>사고 당시 탑승 위치: 4번 리프트, 좌측 좌석\u003c/li>\n\u003cli>사고 유형: 하차 중 추락\u003c/li>\n\u003cli>공식 처리 결과: 탑승객 부주의에 의한 안전사고\u003c/li>\n\u003c/ul>\n\u003cp>사고 직후 현장 직원들은 “탑승객이 하차 안내 전에 안전바를 풀고 일어섰다”고 보고하였다.\u003c/p>\n\u003ch2>1. 사고 처리 현황\u003c/h2>\n\u003cp>사고자는 1996년 07월 12일 17시 18분 사망 판정을 받았다.\u003c/p>\n\u003cp>경찰 조사는 진행 중이나, 현재까지 대외 발표는 탑승객 안전수칙 미준수 가능성으로 정리하였다.\u003c/p>\n\u003cp>현장 직원 3명의 진술은 다음 방향으로 통일할 것.\u003c/p>\n\u003cul>\n\u003cli>탑승객이 하차 안내 전 몸을 일으켰다.\u003c/li>\n\u003cli>안전바는 정상 작동했다.\u003c/li>\n\u003cli>사고 전 기구 이상 징후는 없었다.\u003c/li>\n\u003cli>직원은 안전 안내를 정상적으로 수행했다.\u003c/li>\n\u003c/ul>\n\u003ch2>2. 안전 점검 기록 관련\u003c/h2>\n\u003cp>사고 당일 오전 점검표에 4번 리프트 좌측 안전바 관련 특이사항이 기재되어 있음.\u003c/p>\n\u003cp>해당 원본 점검표는 시설안전팀 문서보관함에 별도 보관한다.\u003c/p>\n\u003cp>대외 제출용 점검표에는 ‘점검 보류’ 및 ‘재점검 필요’ 표현을 제외한다.\u003c/p>\n\u003cp>수정 사유:\u003c/p>\n\u003cul>\n\u003cli>실제 사고 원인으로 단정할 수 없음\u003c/li>\n\u003cli>기업 이미지 훼손 가능성 있음\u003c/li>\n\u003cli>언론 대응 시 혼선 발생 우려\u003c/li>\n\u003c/ul>\n\u003ch2>3. 피해자 가족 관련\u003c/h2>\n\u003cp>사망자 백하린은 사고 당시 미성년 자녀 1명과 동행한 것으로 확인된다.\u003c/p>\n\u003cp>사고 직후 아이는 현장 의무실에서 보호되었으며, 이후 관할 아동보호기관으로 인계되었다.\u003c/p>\n\u003cp>확인 가능한 보호자 연락처는 없었고, 친족 관계 확인도 지연되고 있다.\u003c/p>\n\u003cp>아동 인계 기록:\u003c/p>\n\u003cul>\n\u003cli>임시 보호기관: 한빛아동보호센터\u003c/li>\n\u003cli>인계일: 1996년 07월 13일\u003c/li>\n\u003cli>담당자: 이아동\u003c/li>\n\u003cli>비고: 아이가 사고 당시 충격으로 말을 거의 하지 않음\u003c/li>\n\u003c/ul>\n\u003cp>추가 조치:\u003c/p>\n\u003cp>도원그룹 장학재단 명의로 피해 아동에 대한 후원 검토.\u003c/p>\n\u003cp>단, 도원랜드 사고와 직접 연결되지 않도록 일반 후원 형식으로 처리할 것.\u003c/p>\n\u003ch2>4. 의료 지원 명단\u003c/h2>\n\u003cp>사고 직후 현장 의무실 및 응급 이송 지원 인원은 다음과 같다.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>이름\u003c/th>\n\u003cth>당시 소속\u003c/th>\n\u003cth>역할\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>박의무\u003c/td>\n\u003ctd>도원랜드 의무실\u003c/td>\n\u003ctd>1차 응급 처치\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>최응급\u003c/td>\n\u003ctd>도원중앙병원 응급팀\u003c/td>\n\u003ctd>이송 지원\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>백기태\u003c/td>\n\u003ctd>도원중앙병원 외과 수련의\u003c/td>\n\u003ctd>현장 지원 및 보호자 확인\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>이아동\u003c/td>\n\u003ctd>한빛아동보호센터\u003c/td>\n\u003ctd>아동 인계 담당\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>5. 최종 처리 방향\u003c/h2>\n\u003cp>본 사고는 탑승객의 안전수칙 미준수 가능성에 따른 사고로 정리한다.\u003c/p>\n\u003cp>기구 결함 가능성은 내부적으로만 관리하며, 외부 질의 시 “정기 점검 결과 이상 없음”으로 답변한다.\u003c/p>\n\u003cp>피해 아동 관련 내용은 별도 파일로 분리한다.\u003c/p>\n\u003cp>언론 및 경찰 제출 자료에는 포함하지 않는다.\u003c/p>\n","track":"soundtrack/tragedy-by-alex-productions.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14800cb853f78b0658ada3":{"id":"37281d1c9e14800cb853f78b0658ada3","title":"도원랜드 리프트 사고, 탑승객 안전수칙 미준수 가능성","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>자료 출처: 한성일보 사회면\u003c/p>\n\u003cp>발행일: 1996년 07월 13일\u003c/p>\n\u003cp>어제 오후 도원랜드에서 리프트 놀이기구를 이용하던 20대 여성 탑승객이 추락해 사망하는 사고가 발생했다.\u003c/p>\n\u003cp>도원랜드 측은 사고 직후 공식 입장을 통해 “해당 탑승객이 하차 안내 방송이 나오기 전 안전바를 임의로 해제하고 일어서는 과정에서 균형을 잃은 것으로 보인다”고 밝혔다.\u003c/p>\n\u003cp>도원랜드 관계자는 “사고 기구는 매일 운행 전 안전 점검을 실시하고 있으며, \u003cstrong>사고 당일에도 정상 점검을 마쳤다\u003c/strong>”고 설명했다. 또한 “현장 직원들이 수차례 안전 수칙을 안내했으나, 탑승객이 이를 따르지 않은 정황이 있다”고 덧붙였다.\u003c/p>\n\u003cp>경찰은 정확한 사고 경위를 조사 중이며, 현재까지 기구 자체의 결함은 확인되지 않은 것으로 알려졌다.\u003c/p>\n\u003cp>한편 사망자는 어린 아들과 함께 도원랜드를 방문했던 것으로 전해졌다. 사고 직후 아이는 현장 직원의 보호를 받았으며, 이후 관계 기관에 인계된 것으로 알려졌다.\u003c/p>\n\u003cp>도원랜드 측은 “유가족에게 깊은 애도를 표하며, 재발 방지를 위해 안전 안내를 강화하겠다”고 밝혔다.\u003c/p>\n","track":"soundtrack/tragedy-by-alex-productions.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e148033b561ed26e9430e79":{"id":"37281d1c9e148033b561ed26e9430e79","title":"비공개 00 00 00서","locked":true,"lock_type":"single","answers":["960712"],"children":[],"html":"\n\u003cp>윤재 실제 생일\u003c/p>\n\u003ch1>비공개 입양 확정 통지서\u003c/h1>\n\u003cp>문서명: 미성년 아동 비공개 입양 확정 통지서\u003c/p>\n\u003cp>문서번호: HB-93-1224-A\u003c/p>\n\u003cp>작성기관: 한빛아동보호센터\u003c/p>\n\u003cp>작성일자: 1996년 12월 24일\u003c/p>\n\u003cp>문서 상태: 사본\u003c/p>\n\u003cp>보관 등급: 내부 열람 제한\u003c/p>\n\u003chr/>\n\u003ch2>1. 아동 기본 정보\u003c/h2>\n\u003cp>아동 임시 관리번호: HB-93-0712-□\u003c/p>\n\u003cp>아동 성명: 백윤종\u003c/p>\n\u003cp>성별: 남\u003c/p>\n\u003cp>생년월일: 1989년 12월 3일\u003c/p>\n\u003cp>보호 시작일: 1996년 07월 13일\u003c/p>\n\u003cp>보호 시작 당시 연령: 만 7세\u003c/p>\n\u003cp>친모 성명: 백하린\u003c/p>\n\u003cp>친부 정보: 확인 불가\u003c/p>\n\u003cp>보호 사유: 보호자 사망 및 친족 확인 지연\u003c/p>\n\u003cp>아동은 1996년 07월 12일 도원유원지 리프트 추락 사고 이후 임시 보호 조치되었으며, 사고 다음 날인 1996년 07월 13일 한빛아동보호센터로 인계되었다.\u003c/p>\n\u003chr/>\n\u003ch2>2. 보호 경과\u003c/h2>\n\u003cp>아동은 보호 시작 직후 일정 기간 말을 거의 하지 않았으며, 정신적 충격으로 기억의 상당 부분을 기억하지 못하는 것으로 보였다.\u003c/p>\n\u003cp>아동 전문 상담가는 별도 심리 상담을 진행할 것을 건고하였으나 교육 지원만 지원되었다.\u003c/p>\n\u003chr/>\n\u003ch2>3. 입양 전환 사유\u003c/h2>\n\u003cp>아동의 친족 확인이 장기간 지연되었고, 친부 정보 또한 확인되지 않아 장기 보호 전환이 검토되었다.\u003c/p>\n\u003cp>이후 도원그룹 장학재단 측에서 아동에 대한 지속 후원 및 보호 의사를 전달하였으며, 외부 법무 대리인을 통한 입양 절차가 진행되었다.\u003c/p>\n\u003cp>후원 전환 요청 기관: 도원그룹 장학재단\u003c/p>\n\u003cp>외부 법무 대리인: 정대리\u003c/p>\n\u003cp>보호기관 담당자: 이아동\u003c/p>\n\u003chr/>\n\u003ch2>4. 입양 확정 내용\u003c/h2>\n\u003cp>입양 확정일: 1996년 12월 24일\u003c/p>\n\u003cp>입양 처리 구분: 비공개 입양\u003c/p>\n\u003cp>아동 성명 변경: 예정\u003c/p>\n\u003cp>기존 보호기록 공개 여부: 비공개\u003c/p>\n\u003cp>사고 관련 기록 공개 여부: 비공개\u003c/p>\n\u003cp>입양 이후 아동의 기존 성명 및 사고 관련 보호기록은 외부 열람 대상에서 제외한다.\u003c/p>\n\u003cp>아동의 성명 변경 및 가족관계 등록은 외부 법무 대리인을 통해 별도 처리한다.\u003c/p>\n\u003chr/>\n\u003ch2>5. 후원자 측 요청사항\u003c/h2>\n\u003cp>후원자 측은 다음 사항을 요청하였다.\u003c/p>\n\u003cul>\n\u003cli>아동의 기존 사건 기록은 외부 공개하지 않는다.\u003c/li>\n\u003cli>도원유원지 사고와 입양 절차를 직접 연결하지 않는다.\u003c/li>\n\u003cli>보호기관 이동 및 가족관계 정리는 법무 대리인을 통해 진행한다.\u003c/li>\n\u003cli>아동의 기존 성명과 변경 후 성명은 별도 관리한다.\u003c/li>\n\u003cli>추후 도원그룹 장학재단 후원 이력으로만 관리한다.\u003c/li>\n\u003c/ul>\n\u003chr/>\n\u003ch2>6. 결재란\u003c/h2>\n\u003cp>처리일: 1996년 12월 24일\u003c/p>\n\u003cp>담당자: 이아동\u003c/p>\n\u003cp>외부 법무 대리인: 정대리\u003c/p>\n\u003cp>후원기관 확인: 도원그룹 장학재단\u003c/p>\n\u003cp>최종 승인: 한빛아동보호센터 입양심의 담당\u003c/p>\n\u003chr/>\n","track":"soundtrack/tragedy-by-alex-productions.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14805c81a2e4c0243c63d1":{"id":"37281d1c9e14805c81a2e4c0243c63d1","title":"스카이캐슬 리프트 일일 안전 점검표","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>점검일자: 1996년 07월 12일\u003c/p>\n\u003cp>운행 시작 시각: 09시 30분\u003c/p>\n\u003cp>점검 담당자: 시설안전팀 김안전\u003c/p>\n\u003cp>확인 관리자: 운영관리팀 최운영\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>점검 항목\u003c/th>\n\u003cth>기준\u003c/th>\n\u003cth>점검 결과\u003c/th>\n\u003cth>비고\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>리프트 와이어 장력\u003c/td>\n\u003ctd>정상 범위 유지\u003c/td>\n\u003ctd>정상\u003c/td>\n\u003ctd>-\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>탑승구 자동 정지 센서\u003c/td>\n\u003ctd>하차 지연 시 자동 정지\u003c/td>\n\u003ctd>미확인\u003c/td>\n\u003ctd>전일 점검으로 대체\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4번 리프트 안전바 잠금\u003c/td>\n\u003ctd>체결 후 흔들림 없음\u003c/td>\n\u003ctd>이상 있음\u003c/td>\n\u003ctd>재점검 필요\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하차 구간 보조 발판\u003c/td>\n\u003ctd>흔들림 없음\u003c/td>\n\u003ctd>정상\u003c/td>\n\u003ctd>-\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>하차 구간 안내 방송\u003c/td>\n\u003ctd>자동 송출\u003c/td>\n\u003ctd>정상\u003c/td>\n\u003ctd>-\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>비상 정지 버튼\u003c/td>\n\u003ctd>즉시 작동\u003c/td>\n\u003ctd>정상\u003c/td>\n\u003ctd>-\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4번 리프트 좌측 안전바\u003c/td>\n\u003ctd>체결 상태 유지\u003c/td>\n\u003ctd>점검 보류\u003c/td>\n\u003ctd>부품 교체 예정\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>운행 전 최종 관리자 확인\u003c/td>\n\u003ctd>필수\u003c/td>\n\u003ctd>서명 누락\u003c/td>\n\u003ctd>관리자 현장 부재\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>특이사항:\u003c/p>\n\u003cblockquote>\n\u003cp>오전 점검 중 4번 리프트 좌측 안전바 체결부에서 미세한 흔들림이 확인되었다.\u003c/p>\n\u003cp>담당 직원은 해당 리프트의 운행 제외를 요청하였으나, 주말 방문객 증가로 인해 전체 운행 중단은 어렵다는 운영팀 의견이 있었다.\u003c/p>\n\u003c/blockquote>\n\u003cp>점검 담당자 메모:\u003c/p>\n\u003cblockquote>\n\u003cp>“4번 좌측 안전바 체결감 약함. 하차 직전 흔들림 발생 가능. 부품 교체 전까지 해당 좌석 사용 제한 권고.”\u003c/p>\n\u003c/blockquote>\n\u003cp>관리자 확인란:\u003c/p>\n\u003cblockquote>\n\u003cp>서명 없음.\u003c/p>\n\u003c/blockquote>\n\u003cp>추가 메모:\u003c/p>\n\u003cblockquote>\n\u003cp>본 점검표는 사고 이후 재작성된 보고서와 내용이 일부 다름.\u003c/p>\n\u003cp>재작성 보고서에는 ‘4번 리프트 안전바 이상 있음’ 항목이 ‘정상’으로 수정되어 있음.\u003c/p>\n\u003c/blockquote>\n","track":"soundtrack/tragedy-by-alex-productions.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"custom_dosea_invitations":{"id":"custom_dosea_invitations","locked":false,"lock_type":null,"answers":[],"children":[],"track":"soundtrack/reverie-pt-2-by-lucjo.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3","title":"발송하는 초대장","html":"\u003cp class=\"aside\">초대장의 드레스코드는 각각 도세아가 자체적으로 선정한 것입니다.\u003c/p>\n\u003csection class=\"invite-slider\" data-invite-slider>\n  \u003cdiv class=\"invite-frame\">\u003cimg data-invite-image src=\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/도세아초대장.png\" alt=\"도세아 초대장\">\u003c/div>\n  \u003cbutton class=\"invite-nav invite-prev\" type=\"button\" data-invite-prev aria-label=\"이전 초대장\">‹\u003c/button>\n  \u003cbutton class=\"invite-nav invite-next\" type=\"button\" data-invite-next aria-label=\"다음 초대장\">›\u003c/button>\n  \u003cdiv class=\"invite-caption\">\u003cstrong data-invite-name>도세아 초대장\u003c/strong>\u003cspan data-invite-count>1 / 6\u003c/span>\u003c/div>\n  \u003cdiv class=\"invite-dots\" data-invite-dots>\u003c/div>\n  \u003cscript type=\"application/json\" data-invite-data>[{\"name\":\"도세아 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/도세아초대장.png\"},{\"name\":\"도윤재 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/도윤재초대장.png\"},{\"name\":\"도이준 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/도이준초대장.png\"},{\"name\":\"문해준 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/문해준초대장.png\"},{\"name\":\"백기태 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/백기태초대장.png\"},{\"name\":\"서리나 초대장\",\"src\":\"notion_mystery_game_html/《죽은 자의 생일파티》/도세아 작업실 🔒/초대장/서리나초대장.png\"}]\u003c/script>\n\u003c/section>"},"custom_moon_love_letter":{"id":"custom_moon_love_letter","locked":true,"lock_type":"single","answers":["611225"],"children":[],"track":"soundtrack/echoes-of-home-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3","title":"도진명과 000의 00편지","html":"\u003ch2>도진명과 문정인의 연애편지\u003c/h2>\n\n\u003cp>접힌 편지지가 오래된 봉투 안에 들어 있다. 봉투 가장자리에는 오래된 유원지 입장권 조각이 함께 끼워져 있다.\u003c/p>\n\n\u003chr>\n\n\u003ch3>첫 번째 편지\u003c/h3>\n\n\u003cblockquote>\n\u003cp>정인에게.\u003c/p>\n\n\u003cp>오늘 유원지에 사람이 너무 많았다.\u003c/p>\n\n\u003cp>아이들 손을 잡은 부모들, 풍선을 든 아이들, 솜사탕을 입가에 묻힌 아이들.\u003c/p>\n\n\u003cp>온 세상이 아이들을 위해 웃는 날 같았다.\u003c/p>\n\n\u003cp>그런데 나는 하루 종일 너만 보았다.\u003c/p>\n\n\u003cp>네가 회전목마 앞에서 웃을 때, 이상하게도 주변 소리가 전부 멀어졌다.\u003c/p>\n\n\u003cp>그냥 네 옆에서 조금 더 오래 걷고 싶었다.\u003c/p>\n\n\u003cp>아이들보다 네가 더 환하게 웃던 날.\u003c/p>\n\n\u003cp>언젠가 시간이 많이 지나도,\u003c/p>\n\n\u003cp>나는 오늘을 잊지 못할 것 같다.\u003c/p>\n\n\u003cp>너의 20살 생일을 축하해 정인아.\u003c/p>\n\n\u003cp>사랑해.\u003c/p>\n\n\u003cp>1981년 5월 5일.\u003c/p>\n\n\u003cp>도진명.\u003c/p>\n\u003c/blockquote>\n\n\u003chr>\n\n\u003ch3>두 번째 편지\u003c/h3>\n\n\u003cblockquote>\n\u003cp>정인아.\u003c/p>\n\n\u003cp>요즘은 편지를 쓰는 일이 점점 어려워진다.\u003c/p>\n\n\u003cp>해야 할 말은 많아졌는데,\u003c/p>\n\n\u003cp>할 수 있는 말은 점점 줄어든다.\u003c/p>\n\n\u003cp>아버지는 너를 모른다고 하셨다.\u003c/p>\n\n\u003cp>어머니는 네 이름을 다시는 집 안에서 꺼내지 말라고 하셨다.\u003c/p>\n\n\u003cp>나는 그 말들이 틀렸다고 생각했다.\u003c/p>\n\n\u003cp>그런데도 나는 아무 말도 하지 못했다.\u003c/p>\n\n\u003cp>네가 내게 물었지.\u003c/p>\n\n\u003cp>“우리는 어디까지 갈 수 있을까.”\u003c/p>\n\n\u003cp>나는 대답하지 못했다.\u003c/p>\n\n\u003cp>나는 늘 큰 사람이 되고 싶었다.\u003c/p>\n\n\u003cp>내 이름으로 된 회사를 갖고,\u003c/p>\n\n\u003cp>내가 만든 유원지에 사람들이 웃으며 들어오는 걸 보고 싶었다.\u003c/p>\n\n\u003cp>그런데 이상하게,\u003c/p>\n\n\u003cp>그 모든 꿈보다 네가 더 무거웠다.\u003c/p>\n\n\u003cp>그게 사랑이었는지,\u003c/p>\n\n\u003cp>두려움이었는지,\u003c/p>\n\n\u003cp>나는 아직도 모르겠다.\u003c/p>\n\n\u003cp>미안해.\u003c/p>\n\n\u003cp>진명.\u003c/p>\n\u003c/blockquote>\n\n\u003chr>\n\n\u003cp>\u003cem>이 편지 묶음은 문해준이 도진명의 낡은 지갑과 회장실 비공개 서류를 뒤진 뒤, 따로 빼내어 보관한 것으로 보인다.\u003c/em>\u003c/p>"},"custom_doijun_private_memo":{"id":"custom_doijun_private_memo","locked":true,"lock_type":"single","answers":["030604"],"children":[],"track":"soundtrack/signal-to-noise-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3","title":"도이준의 개인 메모","html":"\u003ch2>도이준의 개인 메모\u003c/h2>\n\u003cp>구겨진 메모지가 라운지 테이블 서랍 안쪽에 끼워져 있다.\u003c/p>\n\u003cp>문서명: 휴대폰 메모 앱 임시저장 기록\u003c/p>\n\u003cp>작성자: 도이준\u003c/p>\n\u003cp>작성 시각: 2026년 12월 25일 19:37\u003c/p>\n\u003cp>발견 위치: 도이준 휴대폰 메모 앱 / 잠금 폴더\u003c/p>\n\u003chr>\n\u003ch2>메모 내용\u003c/h2>\n\u003cblockquote>\n\u003cp>아 진짜 미치겠네.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>이걸 말해야 돼, 말아야 돼.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>아니, 말하면 나도 끝이다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>일단 내가 왜 그 시간에 거기 있었는지부터 설명해야 하는데,\u003c/p>\n\u003cp>그걸 설명하는 순간 나도 같이 걸린다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>나는 아버지 금고를 열려고 했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그냥 돈이 필요했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그 미친놈들이 19시까지 3억 안 보내면\u003c/p>\n\u003cp>클럽 사진이랑 영상 다 뿌린다고 했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>약 봉투 어쩌고 하는 것도,\u003c/p>\n\u003cp>내가 한 것도 아닌데 사진만 보면 내가 한 것처럼 보이니까\u003c/p>\n\u003cp>그냥 끝나는 거다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>기사 뜨면 나만 끝나는 게 아니라\u003c/p>\n\u003cp>회사도 난리 나고, 형도 난리 치고, 아버지는 나를 진짜 버릴 거고.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그래서 금고를 보려고 했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>중앙홀 뒤쪽 대기실.\u003c/p>\n\u003cp>벽면 액자 뒤.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>아버지가 중요한 건 다 거기 숨긴다는 거 알고 있었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>현금이 있을지, 인감이 있을지, 보험 서류가 있을지,\u003c/p>\n\u003cp>뭐라도 있겠지 싶었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그래서 사람들 움직임을 보고 있었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그런데 18시 40분 조금 넘어서였나.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>정확히 몇 분인지는 모르겠다.\u003c/p>\n\u003cp>그때 나 진짜 정신이 없었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>계속 전화 오고, 문자 오고,\u003c/p>\n\u003cp>19시까지 돈 안 보내면 터뜨린다고 협박하고,\u003c/p>\n\u003cp>머리가 터질 것 같았다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>근데 그때 봤다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>약품 냉장고 쪽 복도에서 윤재 형을.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>처음엔 그냥 지나가는 줄 알았다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>윤재 형은 원래 조용히 다니니까.\u003c/p>\n\u003cp>사람들 많은 데서도 혼자 다른 생각하는 얼굴로,\u003c/p>\n\u003cp>아무 일 없는 사람처럼 지나가니까.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>근데 이상했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>손.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>검은 장갑을 끼고 있었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>행사장에 장갑 낀 사람이 없었던 건 아니다.\u003c/p>\n\u003cp>서리나도 장갑 꼈고, 진행요원들도 장갑 끼고,\u003c/p>\n\u003cp>뭐 다들 유난스럽게 차려입었으니까.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>근데 윤재 형은 그런 사람 아니다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>정장 입어도 손에 뭘 끼는 거 싫어한다고 전에 말한 적 있다.\u003c/p>\n\u003cp>시계도 답답하다고 자주 풀던 사람이다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그런데 그날은 검은 장갑을 끼고 있었다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그리고 약품 냉장고 쪽에서 나왔다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>나는 그걸 봤다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>근데 그때는 그냥 넘겼다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>아니, 넘긴 게 아니라\u003c/p>\n\u003cp>못 본 척했다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>나도 내 일이 급했으니까.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>내가 그걸 붙잡고\u003c/p>\n\u003cp>“형, 거기서 뭐 해?”\u003c/p>\n\u003cp>이렇게 물었으면?\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그럼 형도 나한테 물었을 거다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>“너는 여기서 뭐 하냐.”\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그럼 나는 뭐라고 말하는데.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>아버지 금고 열려고 했다고?\u003c/p>\n\u003cp>사채한테 협박당하고 있다고?\u003c/p>\n\u003cp>클럽 사진 때문에 돈 훔치려고 했다고?\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>말 못 한다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그래서 그냥 고개 돌렸다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\n\u003cp>근데 이걸 말하면?\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그러면 내 금고 일도 들킨다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>클럽 일도 들킨다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>사채 문자도 들킨다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>다 들킨다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그럼 사람들은 내가 아버지를 죽였다고 할 거다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>돈 필요했으니까.\u003c/p>\n\u003cp>금고 열려고 했으니까.\u003c/p>\n\u003cp>그 시간에 수상하게 돌아다녔으니까.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>아니라고 해도 안 믿겠지.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>나라도 안 믿겠다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>그래서 입 다물고 있어야 한다.\u003c/p>\n\u003cp>&nbsp;\u003c/p>\n\u003cp>말하면 나도 끝이다.\u003c/p>\n\u003c/blockquote>"}},"introTheme":"soundtrack/danse-macabre-busy-strings-by-kevin-macleod.mp3","mainTheme":"soundtrack/wedding-by-alex-productions.mp3","triggers":{"37381d1c9e14809d881afddffe61e0d8":"soundtrack/incredulity-by-scott-buckley.mp3","37381d1c9e1480e6a22bf0148df124f7":"soundtrack/fall-in-love-by-alex-productions.mp3","37381d1c9e148035be74ff60ce0bab04":"soundtrack/an-upsetting-theme-by-kevin-macleod.mp3","37381d1c9e14809ea5bdf82eecddb94a":"soundtrack/the-long-way-home-by-scott-buckley.mp3","37281d1c9e148060ad9df6023e PT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_48_56.png"}],"characters":[{"name":"도진명","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_28_15.png","meta":"65세 / 도원그룹 회장 / 도원랜드 창립자 / 1961.12.25","desc":"\u003cp>국내 대표 테마파크 기업인 도원그룹의 창립자이자 회장이다.\u003c/p>\u003cp>젊은 시절 작은 놀이시설 운영업에서 시작해, 현재의 도원랜드와 도원문화재단, 리조트 사업까지 확장시킨 인물이다. 대중에게는 “상상력을 사업으로 만든 기업가”로 알려져 있으며, 도원랜드의 독특한 테마와 몰입형 전시 기획 역시 그의 취향에서 시작되었다.\u003c/p>\u003cp>도진명은 평범한 형식의 행사를 좋아하지 않는다.\u003c/p>\u003cp>생일, 기념식, 가족 모임까지도 하나의 무대처럼 꾸미는 것을 즐겼고, 이번 65번째 생일파티 역시 자신이 직접 구상한 전시관 〈도원관: 나의 완벽한 가족〉에서 열기로 했다. 이 전시관은 그의 인생과 가족의 시간을 공간별로 재현한 특별한 장소다.\u003c/p>\u003cp>겉으로는 여유롭고 품격 있는 노신사처럼 보이지만, 자신이 세운 기준에는 매우 엄격하다. 사람의 재능과 쓸모를 빠르게 파악하는 편이며, 가까운 가족들에게도 감정보다는 결과와 태도를 중시하는 모습을 보여왔다.\u003c/p>\u003cp>특히 체스를 좋아해 중요한 결정을 앞두면 혼자 체스판을 놓고 생각하는 습관이 있다. 주변 사람들은 그를 두고 “모든 사람을 말판 위에 올려놓고 보는 사람”이라고 말하기도 한다.\u003c/p>\u003cp>이번 생일파티에는 가족과 가장 가까운 측근들만 초대했다.\u003c/p>\u003cp>초대장은 모두 도진명이 직접 고른 문구와 함께 발송되었으며, 그는 이 파티를 자신의 인생을 정리하는 가장 중요한 자리로 여기고 있었다.\u003c/p>"},{"name":"도윤재","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_50_54.png","meta":"35세 / 도진명의 장남 / 도원그룹 전략기획본부장 / 1989.12.24","desc":"\u003cp>도진명 회장의 장남이자 도원그룹의 실무를 가장 가까이에서 맡아온 인물이다.\u003c/p>\u003cp>어릴 때부터 후계자 수업을 받아왔으며, 해외 경영대학원 졸업 후 도원그룹에 입사했다. 현재는 그룹의 신사업과 투자 전략을 총괄하고 있다.\u003c/p>\u003cp>말수가 많지 않고 감정을 쉽게 드러내지 않는 편이다.\u003c/p>\u003cp>책임감이 강하고 예의 바른 태도를 유지하지만, 가족들 사이에서는 다소 거리감이 있는 인물로 보인다. 회장의 뜻을 가장 잘 이해하는 사람으로 평가받으며, 임직원들 사이에서는 “조용하지만 빈틈없는 사람”이라는 평을 듣는다.\u003c/p>\u003cp>공식적인 자리에서는 늘 단정한 정장 차림을 유지하며, 도진명 회장과 함께 그룹 행사에 자주 참석해왔다.\u003c/p>"},{"name":"도세아","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_30_34.png","meta":"30세 / 도진명의 차녀 / 설치미술가, 도원문화재단 이사 / 1994.08.17","desc":"\u003cp>도진명 회장의 둘째 딸이다.\u003c/p>\u003cp>예술대학을 졸업한 뒤 해외에서 설치미술과 전시기획을 공부했고, 현재는 작가 활동과 함께 도원문화재단 이사직을 맡고 있다.\u003c/p>\u003cp>감각적이고 자기표현이 분명한 성격이다.\u003c/p>\u003cp>가족 행사에서도 형식적인 인사보다 분위기와 연출을 신경 쓰는 편이며, 말투는 부드럽지만 자기 기준이 뚜렷하다. 가족들 중 가장 예술적 취향이 강하고, 도진명 회장의 생일 행사나 전시 콘셉트에도 종종 의견을 내왔다.\u003c/p>\u003cp>화려한 옷차림보다는 독특하고 세련된 스타일을 선호하며, 사람들과 대화할 때 상대를 관찰하는 듯한 태도가 있다.\u003c/p>"},{"name":"도이준","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_32_20.png","meta":"23세 / 도진명의 셋째 아들 / 도원그룹 브랜드기획팀 팀장 / 2003.06.04","desc":"\u003cp>도진명 회장의 막내아들이다.\u003c/p>\u003cp>어릴 때부터 자유분방하고 붙임성 있는 성격으로 알려져 있었으며, 정해진 틀 안에 머무르기보다는 새로운 사람을 만나고 분위기를 주도하는 일을 좋아했다. 대학 졸업 후 몇 년간 해외에 머물렀고, 3년 전 도원그룹 브랜드기획팀에 합류했다.\u003c/p>\u003cp>말이 빠르고 농담이 많아 무거운 자리에서도 분위기를 가볍게 만드는 데 능하다. 공식 행사에서는 밝고 사교적인 모습을 보이며, 도진명 회장의 생일파티에서도 손님들을 자연스럽게 맞이하는 역할을 맡았다.\u003c/p>\u003cp>가족들 사이에서는 여전히 철없는 막내처럼 여겨지지만, 의외로 사람의 표정과 기분을 빠르게 읽는 편이다. 다만 진지한 대화나 책임이 따르는 상황에서는 쉽게 농담으로 넘기거나 자리를 피하려는 경향이 있다.\u003c/p>\u003cp>겉으로는 아무 고민 없어 보이는 인물이지만, 최근 몇 년 사이 사생활과 관련된 크고 작은 소문이 이어지며 가족 내에서도 그를 불안하게 바라보는 시선이 생겼다. 도이준은 그런 시선마저 웃어넘기지만, 가까이서 보면 그 밝은 태도에는 어딘가 조급함이 섞여 있다.\u003c/p>"},{"name":"서리나","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_1%EC%9D%BC_%EC%98%A4%ED%9B%84_06_51_01.png","meta":"38세 / 도진명의 아내 / 전 갤러리 운영자 / 1985.08.09","desc":"\u003cp>도진명 회장의 두 번째 아내다.\u003c/p>\u003cp>두 사람은 5년 전 한 자선 미술 행사에서 처음 만났고, 3년 전 정식으로 결혼했다. 결혼 전에는 작은 갤러리를 운영했으며, 예술계와 사교계에 폭넓은 인맥을 가지고 있다.\u003c/p>\u003cp>차분하고 우아한 분위기의 인물이다.\u003c/p>\u003cp>말투가 느리고 부드럽지만, 낯선 사람 앞에서도 쉽게 주눅 들지 않는다. 사람을 대할 때 적당한 거리를 유지하며, 감정을 노골적으로 드러내기보다는 상황을 조용히 살피는 편이다.\u003c/p>\u003cp>도진명 회장과 함께 공식 석상에 자주 모습을 드러냈으며, 최근에는 도원문화재단의 행사에도 참여하고 있다. 가족들 사이에서는 아직 완전히 가까워지지는 못했지만, 겉으로는 늘 품위 있는 태도를 유지한다.\u003c/p>"},{"name":"문해준","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_36_28.png","meta":"40세 / 도진명의 개인 비서 / 도원그룹 회장실 비서팀장 / 1984.01.20","desc":"\u003cp>도진명 회장을 15년째 보좌하고 있는 개인 비서다.\u003c/p>\u003cp>도원그룹 회장실에 입사한 뒤 주요 일정, 외부 행사, 사적인 요청까지 도맡아 처리해왔다. 도진명 회장의 가장 가까운 실무 담당자로, 회장의 취향과 생활 패턴을 누구보다 잘 알고 있다.\u003c/p>\u003cp>조용하고 절제된 성격이다.\u003c/p>\u003cp>불필요한 말을 거의 하지 않고, 필요한 순간에만 정확하게 말한다. 감정을 드러내지 않는 태도 때문에 차갑게 보이기도 하지만, 일 처리만큼은 철저하다는 평가를 받는다.\u003c/p>\u003cp>가족은 아니지만 오랫동안 회장 곁을 지켜왔기 때문에, 도원가 사람들도 그를 단순한 직원 이상으로 대한다. 이번 생일파티에서도 초대장 발송, 좌석 배치, 일정 관리를 담당했다.\u003c/p>"},{"name":"백기태","img":"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_48_56.png","meta":"45세 / 도진명의 주치의 / 심장내과 전문의 / 1981.07.18","desc":"\u003cp>도진명 회장의 건강을 관리해온 주치의다.\u003c/p>\u003cp>대학병원 심장내과 전문의 출신으로, 8년 전부터 도진명 회장의 정기 검진과 건강 관리를 맡고 있다. 현재는 VIP 전담 클리닉을 운영하며, 도원그룹 주요 인사들의 건강 자문도 함께 담당하고 있다.\u003c/p>\u003cp>침착하고 이성적인 성격이다.\u003c/p>\u003cp>말투는 건조한 편이지만, 환자에게 필요한 설명은 빠짐없이 하는 스타일이다. 응급 상황에서도 쉽게 흔들리지 않으며, 주변 사람들에게 신뢰감을 주는 인물이다.\u003c/p>\u003cp>도진명 회장의 오랜 지병과 생활 습관을 잘 알고 있으며, 이번 생일파티에도 회장의 건강 상태를 확인하기 위해 초대받았다. 가족 구성원은 아니지만, 도진명 회장의 사적인 자리에도 종종 함께한 인물이다.\u003c/p>"}]};</script>
<script>
(function(){
"use strict";
const N=DATA.nodes, HUB='__HUB__', BRIEF='__BRIEF__';
const $=s=>document.querySelector(s), el=$('#view'), $$=s=>document.querySelectorAll(s);
const store={
  get:()=>{try{return JSON.parse(localStorage.getItem('dsbp_unlocked_v2')||'{}')}catch(e){return {}}},
  set:o=>{try{localStorage.setItem('dsbp_unlocked_v2',JSON.stringify(o))}catch(e){}}
};
let unlocked=store.get();
let stack=[]; // navigation history of ids (HUB or node id)
let enteredExploration=false;

// ---- parent map ----
const parent={};
for(const id in N){ for(const c of N[id].children){ if(!(c in parent)) parent[c]=id; } }

// ---- audio manager ----
const A={els:[$('#aud0'),$('#aud1')],cur:0,target:0.5,muted:false,ready:false,track:null,fadeT:null};
function prettyTrack(src){
  if(!src) return '';
  let f=src.split('/').pop().replace('.mp3','');
  f=f.split('-by-')[0].replace(/-/g,' ');
  return f.replace(/\b\w/g,c=>c.toUpperCase());
}
function setNow(src){
  const np=$('#nowplaying'); const t=$('#nowplaying .nowtext');
  t.textContent = (A.muted||!src)?'음악 꺼짐':('♪ '+prettyTrack(src));
  np.classList.toggle('paused', A.muted||!src);
}
function playTrack(src){
  if(!A.ready||!src){A.track=src;setNow(src);return;}
  if(src===A.track){return;}
  A.track=src; setNow(src);
  if(A.muted) return;
  const old=A.els[A.cur], nw=A.els[1-A.cur]; A.cur=1-A.cur;
  nw.src=src; nw.volume=0; nw.play().catch(()=>{});
  clearInterval(A.fadeT); let step=0,steps=28;
  A.fadeT=setInterval(()=>{ step++; const k=step/steps;
    nw.volume=Math.min(A.target,A.target*k);
    old.volume=Math.max(0,A.target*(1-k));
    if(step>=steps){clearInterval(A.fadeT); try{old.pause()}catch(e){}}
  },45);
}
function toggleMute(){
  A.muted=!A.muted; $('#muteBtn').textContent=A.muted?'🔇':'♪';
  if(A.muted){A.els.forEach(a=>{try{a.pause()}catch(e){}});}
  else { const cur=A.els[A.cur]; cur.volume=A.target; if(A.track){cur.src=cur.src||A.track; cur.play().catch(()=>{});} else {const t=A.track;A.track=null;playTrack(t);} }
  setNow(A.track);
}
$('#muteBtn').onclick=toggleMute;
(function(){
  const sv=parseFloat(localStorage.getItem('dsbp_vol'));
  if(!isNaN(sv)) A.target=Math.max(0,Math.min(1,sv));
  const sl=$('#volSlider'); sl.value=Math.round(A.target*100);
  sl.addEventListener('input',e=>{
    A.target=(+e.target.value)/100; try{localStorage.setItem('dsbp_vol',A.target)}catch(_){}
    if(A.muted && A.target>0){A.muted=false;$('#muteBtn').textContent='♪';}
    const cur=A.els[A.cur];
    if(!A.muted){ cur.volume=A.target; if(A.track && cur.paused){ cur.src=cur.src||A.track; cur.play().catch(()=>{}); } }
    setNow(A.track);
  });
})();

// ---- normalize password (mirror of original) ----
function normPw(s){return (s||'').toLowerCase().replace(/[월일년]/g,'').replace(/[^0-9a-z가-힣]/g,'');}
function pwHintLabel(s){
  const v=normPw(s);
  const kinds=[];
  if(/[a-z]/.test(v)) kinds.push('영문');
  if(/[0-9]/.test(v)) kinds.push('숫자');
  if(/[가-힣]/.test(v)) kinds.push('한글');
  return v.length+'자리 · '+(kinds.length?kinds.join('+'):'문자');
}
function lockHint(n){
  if(!n.answers || !n.answers.length) return '';
  if(n.title==='녹음기') return '영어입니다.';
  if(n.lock_type==='sequence'){
    return n.answers.map((a,i)=>(i+1)+'번 '+pwHintLabel(a)).join(' / ');
  }
  const labels=[...new Set(n.answers.map(pwHintLabel))];
  return labels.join(' 또는 ');
}

// ---- helpers ----
function firstImg(html){const m=html&&html.match(/<img[^>]+src="([^"]+)"/);return m?m[1]:null;}
function isUnlocked(id){return !N[id].locked || unlocked[id];}
function trigTrack(id){ return (DATA.triggers && DATA.triggers[id]) || null; }
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}

// ---- breadcrumb ----
function crumbFor(id){
  const path=[]; let c=id;
  while(c && c!==HUB){ path.unshift(N[c]?N[c].title:c); c=parent[c]; }
  const parts=['<b onclick="">전시관</b>'].concat(path.map((t,i)=> i===path.length-1?('<b>'+t+'</b>'):t ));
  return parts.join(' <span style="color:var(--dim)">›</span> ');
}

// ---- render hub ----
function renderHub(){
  let h='<div class="view-head"><div class="eyebrow">도원관 · 나의 완벽한 가족</div>'+
        '<h1>전시관 도면</h1><div class="rule"></div></div>'+
        '<p class="hub-intro">각 공간을 조사해 단서를 모으세요. 🔒 표시된 공간과 문서는 다른 곳에서 찾은 비밀번호로 열립니다.</p>';
  h+='<div class="grid">';
  for(const id of DATA.locIds){
    const n=N[id]; const th=(DATA.bg&&DATA.bg[id])||firstImg(n.html); const open=isUnlocked(id);
    const badge = n.locked ? (open?'✓ 열림':'🔒 잠김') : '· 개방';
    h+='<div class="card '+(n.locked?(open?'unlocked':'locked'):'')+'" data-go="'+id+'">'+
       '<div class="lockbadge">'+badge+'</div>'+
       '<div class="thumb" style="'+(th?('background-image:url(\''+th+'\')'):'')+'"></div>'+
       '<div class="meta"><div class="name">'+n.title+'</div>'+
       '<div class="tag">'+(n.children.length?(n.children.length+'개 단서'):'현장')+'</div></div></div>';
  }
  h+='</div>';
  h+='<div class="section-label">자료실</div><div class="special-row">';
  if(DATA.charactersId){const c=N[DATA.charactersId];
    h+='<div class="chip-card" data-go="'+DATA.charactersId+'"><div class="ic">👥</div><div><div class="t">등장인물</div><div class="s">초대된 6인과 회장</div></div></div>';}
  h+='<div class="chip-card danger-card" id="accuseOpen"><div class="ic">🔎</div><div><div class="t">탐색 종료하기</div><div class="s">범인을 지목하세요</div></div></div>';
  h+='</div>';
  el.innerHTML=h;
  el.querySelectorAll('[data-go]').forEach(c=>c.onclick=()=>navigate(c.getAttribute('data-go')));
  $('#accuseOpen').onclick=openAccuse;
  $('#crumb').innerHTML='<b>전시관</b>';
}

// ---- render 등장인물 carousel ----
function renderCharacters(){
  const cs=DATA.characters||[];
  let h='<div class="view-head"><div class="eyebrow">자료실</div><h1>등장인물</h1><div class="rule"></div></div>';
  h+='<div class="carousel"><button class="cararrow" id="charPrev" aria-label="이전">‹</button>';
  h+='<div class="carwin"><div class="cardstage" id="charStage">';
  cs.forEach(c=>{ h+='<article class="pcard"><div class="pcard-img"><img src="'+c.img+'" alt="'+c.name+'" loading="lazy"></div><div class="pcard-body"><h2>'+c.name+'</h2><div class="pcard-meta">'+c.meta+'</div><div class="pcard-desc">'+c.desc+'</div></div></article>'; });
  h+='</div></div><button class="cararrow" id="charNext" aria-label="다음">›</button></div>';
  h+='<div class="cardots" id="charDots"></div><div class="carcount" id="charCount"></div>';
  el.innerHTML=h;
  const stage=$('#charStage'), dots=$('#charDots'), cnt=$('#charCount');
  dots.innerHTML=cs.map((_,i)=>'<span class="dot" data-i="'+i+'"></span>').join('');
  let idx=0;
  function show(n){ idx=(n+cs.length)%cs.length; stage.style.transform='translateX('+(-idx*100)+'%)';
    Array.from(dots.children).forEach((d,i)=>d.classList.toggle('on',i===idx));
    cnt.textContent=(idx+1)+' / '+cs.length;
    const body=stage.children[idx].querySelector('.pcard-body'); if(body) body.scrollTop=0; }
  window._charShow=show; window._charIdx=()=>idx;
  $('#charPrev').onclick=()=>show(idx-1); $('#charNext').onclick=()=>show(idx+1);
  Array.from(dots.children).forEach(d=>d.onclick=()=>show(+d.getAttribute('data-i')));
  // swipe
  let sx=null; const win=stage.parentNode;
  win.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
  win.addEventListener('touchend',e=>{ if(sx===null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45){ show(dx<0?idx+1:idx-1);} sx=null; },{passive:true});
  show(0);
  $('#crumb').innerHTML=crumbFor(DATA.charactersId);
}
// ---- render briefing (도입부) ----
function renderBrief(){
  let h='<div class="view-head"><div class="eyebrow">사건 도입부</div><h1>사건 개요</h1><div class="rule"></div></div>';
  h+='<div class="content brief-view">'+DATA.introHtml+'</div>';
  el.innerHTML=h;
  $('#crumb').innerHTML='<b>전시관</b> <span style="color:var(--dim)">\u203a</span> <b>사건 개요</b>';
}
// ---- render a node ----
function renderNode(id){
  const n=N[id];
  if(n.locked && !unlocked[id]){ renderLock(id); }
  else { renderContent(id); }
  $('#crumb').innerHTML=crumbFor(id);
}
function renderContent(id){
  const n=N[id];
  let h='<div class="view-head"><div class="eyebrow">'+(parent[id]&&parent[id]!==DATA.rootId?(N[parent[id]].title):'단서 조사')+'</div>'+
        '<h1>'+n.title+'</h1><div class="rule"></div></div>';
  h+='<div class="content">'+n.html+'</div>';
  el.innerHTML=h;
  bindNav();
  initInviteSlider();
}
function initInviteSlider(){
  const box=el.querySelector('[data-invite-slider]');
  if(!box) return;
  const dataEl=box.querySelector('[data-invite-data]');
  if(!dataEl) return;
  let invites=[];
  const rawData=dataEl.textContent||'[]';
  try{invites=JSON.parse(rawData)}catch(e){}
  if(!invites.length) return;
  let current=0;
  const img=box.querySelector('[data-invite-image]');
  const nameEl=box.querySelector('[data-invite-name]');
  const countEl=box.querySelector('[data-invite-count]');
  const dotsEl=box.querySelector('[data-invite-dots]');
  function show(index){
    current=(index+invites.length)%invites.length;
    const invite=invites[current];
    img.src=invite.src; img.alt=invite.name;
    nameEl.textContent=invite.name;
    countEl.textContent=(current+1)+' / '+invites.length;
    dotsEl.innerHTML=invites.map((_,i)=>'<button type="button" class="dot '+(i===current?'active':'')+'" data-i="'+i+'" aria-label="'+invites[i].name+'"></button>').join('');
    dotsEl.querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>show(+d.getAttribute('data-i')));
  }
  box.querySelector('[data-invite-prev]').onclick=()=>show(current-1);
  box.querySelector('[data-invite-next]').onclick=()=>show(current+1);
  show(0);
}
function bindNav(){
  el.querySelectorAll('a.navlink').forEach(a=>{
    a.onclick=(e)=>{e.preventDefault();navigate(a.getAttribute('data-target'));};
  });
}
function renderLock(id){
  const n=N[id];
  const hint=lockHint(n);
  let h='<div class="view-head"><div class="eyebrow">잠긴 공간</div><h1>'+n.title+'</h1><div class="rule"></div></div>';
  h+='<div class="lockwrap"><div class="lockcard" id="lc"><div class="lockic">🔒</div>'+
     '<h2>입장 비밀번호</h2><p class="l">이 곳은 잠겨 있습니다. 단서로 얻은 비밀번호를 입력하세요.</p>';
  if(n.lock_type==='sequence'){
    h+='<div class="seqrow">';
    n.answers.forEach((_,i)=>{ h+='<div class="dial"><span>'+(i+1)+'</span><input class="seqinp" inputmode="text" autocomplete="off"></div>'; });
    h+='</div>';
  } else {
    h+='<div class="pwrow"><input id="pwin" type="password" inputmode="text" autocomplete="off" placeholder="비밀번호 입력"></div>';
  }
  h+='<button class="lockbtn" id="pwbtn">입장</button>'+
     (hint?'<div class="lockhint">비밀번호 형식: '+hint+'</div>':'')+
     '<div class="lockhint">입력 시 공백, 점, 하이픈, ‘월/일’ 표기는 자동으로 정리됩니다.</div>'+
     '<div class="lockerr" id="pwerr"></div></div></div>';
  el.innerHTML=h;
  const submit=()=>tryUnlock(id);
  $('#pwbtn').onclick=submit;
  el.querySelectorAll('input').forEach((inp,i,arr)=>{
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ if(i<arr.length-1 && arr[i+1]) arr[i+1].focus(); else submit(); } });
  });
  const f=el.querySelector('input'); if(f) f.focus();
}
function tryUnlock(id){
  const n=N[id]; let ok=false;
  if(n.lock_type==='sequence'){
    const vals=Array.from(el.querySelectorAll('.seqinp')).map(i=>normPw(i.value));
    ok = vals.length===n.answers.length && vals.every((v,i)=>v===n.answers[i]);
  } else {
    const v=normPw($('#pwin').value);
    ok = n.answers.includes(v);
  }
  if(ok){
    unlocked[id]=true; store.set(unlocked); updateProgress();
    toast('🔓 '+n.title+' 잠금 해제');
    enteredExploration=true;
    const _tt=trigTrack(id); if(_tt) playTrack(_tt);
    renderNode(id);
    refreshHubBadgeMaybe();
  } else {
    const lc=$('#lc'); lc.classList.remove('shake'); void lc.offsetWidth; lc.classList.add('shake');
    $('#pwerr').textContent='비밀번호가 맞지 않습니다.';
  }
}
function refreshHubBadgeMaybe(){}

// ---- navigation ----
function setRoomBg(id){
  const rb=$('#roomBg'); const u=(DATA.bg&&DATA.bg[id])||null;
  if(u){ rb.style.backgroundImage="linear-gradient(180deg,rgba(7,5,4,.52) 0%,rgba(7,5,4,.74) 52%,rgba(7,5,4,.9) 100%), url('"+u+"')"; rb.classList.add('show'); }
  else { rb.classList.remove('show'); }
}
function navigate(id,fromBack){
  if(!fromBack){ if(stack[stack.length-1]!==id) stack.push(id); }
  window.scrollTo({top:0,behavior:'smooth'});
  if(id===HUB) renderHub(); else if(id===BRIEF) renderBrief(); else if(id===DATA.charactersId) renderCharacters(); else renderNode(id);
  setRoomBg(id);
  // BGM: main theme(Wedding) plays from the hub; a trigger evidence (once revealed) changes it and persists.
  const _tt = (N[id] && isUnlocked(id)) ? trigTrack(id) : null;
  if(_tt) playTrack(_tt);
  $('#backBtn').style.visibility = stack.length>1?'visible':'hidden';
}
function goBack(){
  if(stack.length>1){ stack.pop(); navigate(stack[stack.length-1],true); }
}
$('#briefBtn').onclick=()=>navigate(BRIEF);
$('#charBtn').onclick=()=>{ if(DATA.charactersId) navigate(DATA.charactersId); };
function syncTopPad(){ const tb=$('#topbar'); if(tb.classList.contains('hidden')) return; el.style.paddingTop=(tb.offsetHeight+20)+'px'; }
window.addEventListener('resize',syncTopPad);
$('#homeBtn').onclick=()=>{stack=[HUB];navigate(HUB,true);};
$('#backBtn').onclick=goBack;
$('#resetBtn').onclick=()=>{
  if(confirm('진행 상황(해금된 잠금)을 모두 초기화하고 처음부터 시작할까요?')){
    unlocked={};store.set(unlocked);location.reload();
  }
};

// ---- solution modal ----
// ---- progress (password-locked clues explored) ----
const lockedIds=Object.keys(N).filter(id=>N[id].locked);
function updateProgress(){
  const done=lockedIds.filter(id=>unlocked[id]).length, tot=lockedIds.length||1;
  const pct=Math.round(done/tot*100);
  const p=$('#progress'); if(p){ p.textContent='탐색 '+pct+'%'; p.title='비밀번호 잠금 '+done+'/'+tot+' 해제'; }
}
// ---- accusation ----
function ahash(t){var MOD=1000000007,x=0;for(var i=0;i<t.length;i++){x=(x*131+t.charCodeAt(i))%MOD;}return x;}
function openAccuse(){
  const box=$('#suspectList'); const sus=DATA.suspects.slice();
  for(let i=sus.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=sus[i];sus[i]=sus[j];sus[j]=t;}
  box.innerHTML=sus.map(s=>'<button class="suspect" data-n="'+s.name+'"><img src="'+s.img+'" alt="" loading="lazy"><div class="sinfo"><b>'+s.name+'</b><span>'+s.role+'</span></div></button>').join('');
  $('#accuseFb').textContent=''; $('#accuseFb').className='accuse-feedback';
  $('#accuseReveal').classList.add('hidden'); $('#accuseTitle').textContent='범인 지목';
  box.querySelectorAll('.suspect').forEach(b=>b.onclick=()=>guess(b.getAttribute('data-n'),b));
  $('#accuseModal').classList.remove('hidden');
}
function guess(name,btn){
  const fb=$('#accuseFb');
  if(ahash(name)===DATA.answerHash){
    fb.textContent='맞습니다! 당신은 사건의 진상에 도달했습니다.'; fb.className='accuse-feedback ok';
    $$('.suspect').forEach(b=>{b.disabled=true; if(b===btn) b.classList.add('chosen');});
    $('#accuseReveal').classList.remove('hidden');
    $('#accuseTitle').textContent='정답입니다';
  } else {
    fb.textContent='아닙니다! 단서를 다시 살펴보세요.'; fb.className='accuse-feedback no';
    btn.classList.remove('wrong'); void btn.offsetWidth; btn.classList.add('wrong');
  }
}
$('#accuseClose').onclick=()=>$('#accuseModal').classList.add('hidden');
$('#accuseReveal').onclick=()=>{ $('#accuseModal').classList.add('hidden'); navigate(DATA.solutionId); };

// ---- intro ----
$('#introBg').style.backgroundImage="url('"+DATA.cover+"')";
$('#introBody').innerHTML=DATA.introHtml;
$('#enterBtn').onclick=()=>{
  startIntroMusic(); // 소개 화면: Danse Macabre 재생
  $('#introBody').classList.remove('hidden');
  $('#startBtn').classList.remove('hidden');
  const nt=document.querySelector('.intro-note'); if(nt) nt.classList.remove('hidden');
  const en=document.querySelector('.enter-note'); if(en) en.classList.add('hidden');
  $('#enterBtn').classList.add('hidden');
  setTimeout(()=>{ $('#introBody').scrollIntoView({behavior:'smooth',block:'nearest'}); },60);
};
$('#startBtn').onclick=()=>{
  A.ready=true;
  // prime audio on gesture
  A.els.forEach(a=>{a.volume=0;});
  $('#intro').classList.add('hidden');
  $('#topbar').classList.remove('hidden');
  $('#view').classList.remove('hidden');
  stack=[HUB];
  navigate(HUB,true);
  syncTopPad();
  updateProgress();
  playTrack(DATA.mainTheme); // 전시관 도면(허브)부터는 잔잔한 메인 테마(Wedding)
};
// keyboard: backspace? no. Esc closes modal
// 인트로 화면에서 첫 상호작용 시 Danse Macabre 재생 (자동재생 정책 대응)
var introMusicStarted=false;
function startIntroMusic(){ if(introMusicStarted) return; introMusicStarted=true; A.ready=true; A.els.forEach(a=>a.volume=0); playTrack(DATA.introTheme); }
['pointerdown','wheel','touchstart','keydown'].forEach(ev=>$('#intro').addEventListener(ev,startIntroMusic,{once:true,passive:true}));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') $('#accuseModal').classList.add('hidden'); const st=$('#charStage'); if(st){ if(e.key==='ArrowLeft'){$('#charPrev').click();} else if(e.key==='ArrowRight'){$('#charNext').click();} } });
})();
</script>
</body>
