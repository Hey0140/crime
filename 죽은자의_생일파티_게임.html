<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>죽은 자의 생일파티 · 추리 게임</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
@font-face{font-family:'MaruBuri';src:url('fonts/MaruBuriTTF/MaruBuri-ExtraLight.ttf') format('truetype');font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('fonts/MaruBuriTTF/MaruBuri-Light.ttf') format('truetype');font-weight:300;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('fonts/MaruBuriTTF/MaruBuri-Regular.ttf') format('truetype');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('fonts/MaruBuriTTF/MaruBuri-SemiBold.ttf') format('truetype');font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:'MaruBuri';src:url('fonts/MaruBuriTTF/MaruBuri-Bold.ttf') format('truetype');font-weight:700;font-style:normal;font-display:swap}
:root{
  --bg:#0a0806; --bg2:#130d09; --panel:#16100b; --panel2:#1e160e;
  --gold:#c8a767; --gold2:#ecd49a; --goldsoft:rgba(200,167,103,.16);
  --text:#ece3d4; --muted:#a59377; --dim:#7d6d58; --line:#3a2e21;
  --danger:#cf6b5e; --ok:#8fbf86;
  --serif:'MaruBuri','Gowun Batang','Nanum Myeongjo',serif;
  --sans:'MaruBuri','Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:
    radial-gradient(1200px 700px at 50% -10%, #2a1c10 0%, var(--bg2) 42%, var(--bg) 78%);
  color:var(--text); font-family:var(--sans); line-height:1.75;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::after{ /* vignette + grain */
  content:""; position:fixed; inset:0; pointer-events:none; z-index:1;
  background:radial-gradient(120% 120% at 50% 30%, transparent 55%, rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;
}
.hidden{display:none !important}
a{color:var(--gold2);text-decoration:none}
::selection{background:rgba(200,167,103,.3)}
/* scrollbar */
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:#2c2116;border-radius:8px}

#roomBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;background-repeat:no-repeat;
  opacity:0;transition:opacity .55s ease;will-change:opacity}
#roomBg.show{opacity:1}
/* ---------- INTRO ---------- */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 50% 0%,#1b120a,#070504 70%);overflow:auto;padding:40px 18px}
.intro-card{max-width:760px;width:100%;text-align:center;animation:rise .9s ease both}
#intro{display:block;align-items:initial;justify-content:initial;padding:0;background:#070504}
#introBg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center top;background-repeat:no-repeat;
  animation:kenburns 30s ease-in-out infinite alternate;transform-origin:center 30%}
@keyframes kenburns{from{transform:scale(1.02)}to{transform:scale(1.12)}}
#intro::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(7,5,4,.22) 0%,rgba(7,5,4,.30) 38%,rgba(7,5,4,.72) 74%,rgba(7,5,4,.96) 100%)}
.intro-content{position:relative;z-index:1;min-height:100vh;max-width:720px;margin:0 auto;
  display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 20px 54px;animation:fade 1.1s ease both}
.intro-top{min-height:56vh;width:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding-bottom:20px}
.intro-content h1{font-family:var(--serif);font-weight:700;font-size:clamp(40px,8.5vw,70px);margin:6px 0 0;letter-spacing:.06em;
  background:linear-gradient(180deg,#fff7e2,#e7c987 58%,#b48f52);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 26px rgba(0,0,0,.9))}
.scrolldown{margin-top:14px;color:var(--gold2);font-size:11.5px;letter-spacing:.32em;animation:bob 2.1s ease-in-out infinite;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.enter-note{margin-top:14px;color:var(--dim);font-size:12.5px;text-shadow:0 2px 10px rgba(0,0,0,.85)}
#enterBtn{margin-top:8px}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(6px);opacity:.95}}
.kicker{letter-spacing:.5em;color:var(--gold2);font-size:12px;margin:0;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.intro-card h1{font-family:var(--serif);font-weight:700;font-size:clamp(34px,7vw,58px);margin:0;
  letter-spacing:.06em;text-shadow:0 2px 24px rgba(0,0,0,.7);
  background:linear-gradient(180deg,#fff5dc,#c8a767 70%,#8a6f43);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro-sub{color:#d9c8ab;font-size:14px;letter-spacing:.3em;margin:12px 0 0;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.brief{text-align:left;width:100%;margin:8px 0 26px;border:1px solid var(--line);border-radius:16px;padding:24px 28px;
  background:linear-gradient(180deg,rgba(14,10,7,.85),rgba(8,6,4,.92));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 22px 64px rgba(0,0,0,.6), inset 0 0 40px rgba(0,0,0,.35)}
.brief img{display:block;width:100%;max-width:540px;height:auto;margin:2px auto 20px;border-radius:13px;border:1px solid var(--line);box-shadow:0 16px 46px rgba(0,0,0,.6)}
.brief h2{font-family:var(--serif);color:var(--gold2);font-size:20px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.brief h3{color:var(--gold);font-size:16px;margin:14px 0 6px}
.brief p{margin:8px 0;color:#ded3c0}
.bloodline{color:#d98a7e !important;font-family:var(--serif);font-size:18px;letter-spacing:.04em}
.btn-primary{font-family:var(--serif);font-size:19px;letter-spacing:.2em;cursor:pointer;
  color:#1a130b;background:linear-gradient(180deg,#f0d9a0,#c8a767);border:0;border-radius:999px;
  padding:15px 46px;box-shadow:0 10px 30px rgba(200,167,103,.35);transition:.25s;font-weight:700}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(200,167,103,.5)}
.intro-note{color:var(--dim);font-size:12.5px;margin-top:16px}

/* ---------- TOPBAR ---------- */
#topbar{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:11px 16px;background:linear-gradient(180deg,rgba(12,9,6,.92),rgba(12,9,6,.7));
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#topbar button{font-family:var(--sans);cursor:pointer;color:var(--text);background:rgba(255,255,255,.04);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;transition:.18s}
#topbar button:hover{border-color:var(--gold);color:var(--gold2)}
#crumb{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
#crumb b{color:var(--gold2);font-weight:500}
.spacer{flex:1 1 auto}
#nowplaying{font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;max-width:34vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#nowplaying .eq{display:inline-flex;gap:2px;align-items:flex-end;height:13px}
#nowplaying .eq i{width:2px;background:var(--gold);animation:eq 1s ease-in-out infinite}
#nowplaying.paused .eq i{animation-play-state:paused;opacity:.3}
#nowplaying .eq i:nth-child(2){animation-delay:.2s}#nowplaying .eq i:nth-child(3){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:13px}}
#muteBtn{min-width:42px}
#volSlider{width:82px;height:4px;cursor:pointer;accent-color:var(--gold);background:transparent;vertical-align:middle}
@media(max-width:640px){#volSlider{width:58px}}

/* ---------- VIEW ---------- */
#view{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:86px 20px 110px;animation:fade .5s ease}
.view-head{margin:6px 0 22px}
.eyebrow{letter-spacing:.32em;font-size:11px;color:var(--gold);text-transform:uppercase}
.view-head h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5vw,40px);margin:8px 0 0;letter-spacing:.03em;color:#f3e7cc}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:14px 0 0}

/* HUB */
.hub-intro{color:var(--muted);font-size:14px;margin:0 0 22px;max-width:640px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;cursor:pointer;border:1px solid var(--line);border-radius:16px;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));min-height:150px;display:flex;flex-direction:column;
  transition:.22s;box-shadow:0 8px 26px rgba(0,0,0,.35)}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 18px 44px rgba(0,0,0,.5)}
.card .thumb{height:138px;background-size:cover;background-position:center;background-color:#0c0907;
  filter:brightness(.74) saturate(.96);transition:.3s}
.card:hover .thumb{filter:brightness(.85) saturate(1)}
.card .meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .name{font-family:var(--serif);font-size:17px;color:#f0e3c8;letter-spacing:.02em}
.card .tag{font-size:11.5px;color:var(--dim)}
.card .lockbadge{position:absolute;top:10px;right:10px;font-size:11px;padding:4px 9px;border-radius:999px;
  background:rgba(8,6,4,.78);border:1px solid var(--line);color:var(--muted);backdrop-filter:blur(4px)}
.card.unlocked .lockbadge{color:var(--ok);border-color:rgba(143,191,134,.4)}
.card.locked .lockbadge{color:var(--gold2);border-color:rgba(200,167,103,.4)}
.section-label{display:flex;align-items:center;gap:12px;margin:34px 0 16px;color:var(--gold);font-size:13px;letter-spacing:.28em}
.section-label::before,.section-label::after{content:"";height:1px;background:var(--line);flex:1}
.special-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.chip-card{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:linear-gradient(180deg,var(--panel2),var(--panel));
  display:flex;align-items:center;gap:12px;transition:.2s;flex:1;min-width:200px}
.chip-card:hover{border-color:var(--gold);transform:translateY(-3px)}
.chip-card .ic{font-size:22px}
.chip-card .t{font-family:var(--serif);font-size:16px;color:#efe2c7}
.chip-card .s{font-size:11.5px;color:var(--dim)}
.danger-card{border-color:rgba(207,107,94,.35)}
.danger-card .t{color:#e6a99f}

/* CONTENT (evidence/doc) */
.content{background:linear-gradient(180deg,rgba(26,19,12,.82),rgba(17,12,8,.9));
  border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;
  padding:26px 30px;box-shadow:0 14px 50px rgba(0,0,0,.4)}
.content h1{font-family:var(--serif);font-size:24px;color:var(--gold2);margin:18px 0 8px}
.content h2{font-family:var(--serif);font-size:21px;color:#f0d99a;margin:22px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.content h3{font-size:17px;color:var(--gold);margin:18px 0 6px}
.content p{margin:11px 0;color:#e2d7c4}
.content ul,.content ol{padding-left:22px}.content li{margin:7px 0}
.content blockquote{border-left:3px solid var(--gold);background:var(--goldsoft);padding:12px 18px;border-radius:10px;margin:16px 0;color:#ecdfca;font-family:var(--serif)}
.content hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.content code,.content pre{font-family:ui-monospace,Consolas,monospace;color:#ffe0a1;background:#0b0806;border:1px solid #2c2116;border-radius:8px;padding:2px 6px}
.content pre{padding:14px;overflow:auto}
.content table{width:100%;border-collapse:collapse;margin:16px 0;font-size:14px}
.content th,.content td{border:1px solid var(--line);padding:9px 11px;text-align:left}
.content th{background:rgba(200,167,103,.1);color:var(--gold2);font-weight:500}
.content tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.content img{display:block;max-width:100%;width:auto;height:auto;max-height:84vh;object-fit:contain;margin:18px auto;border-radius:12px;border:1px solid #2c2116;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.content strong{color:#f3deb0}
/* navlinks inside content -> evidence buttons */
.content a.navlink, a.navlink{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  background:linear-gradient(180deg,rgba(40,30,18,.9),rgba(26,19,11,.9));border:1px solid var(--line);
  color:#f0e3c8 !important;border-radius:10px;padding:10px 15px;margin:5px 6px 5px 0;font-size:14.5px;transition:.18s;border-bottom:1px solid var(--line)}
.content a.navlink::before{content:"›";color:var(--gold);font-size:18px;line-height:1}
.content a.navlink:hover{border-color:var(--gold);color:#fff4d6 !important;transform:translateX(3px)}
.content li>a.navlink{margin:3px 0}
.content li{list-style:none}
.content ul:has(a.navlink){padding-left:0}
.subnav{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 6px}

/* CHARACTER CAROUSEL */
.carousel{position:relative;display:flex;align-items:center;gap:10px;margin-top:6px}
.carwin{overflow:hidden;flex:1;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:16px;background:linear-gradient(180deg,rgba(26,19,12,.82),rgba(17,12,8,.9));box-shadow:0 14px 50px rgba(0,0,0,.4)}
.cardstage{display:flex;transition:transform .42s cubic-bezier(.4,0,.2,1)}
.pcard{flex:0 0 100%;display:flex;min-height:420px;max-height:64vh}
.pcard-img{flex:0 0 40%;background:#0c0907;overflow:hidden}
.pcard-img img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block}
.pcard-body{flex:1;padding:26px 30px;text-align:left;overflow:auto}
.pcard-body h2{font-family:var(--serif);font-size:27px;color:#f3e7cc;margin:0 0 6px;font-weight:700}
.pcard-meta{color:var(--gold2);font-size:13px;letter-spacing:.02em;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
.pcard-desc{color:#e2d7c4;font-size:14.5px;line-height:1.8}
.pcard-desc p{margin:10px 0}
.cararrow{flex:0 0 auto;width:46px;height:46px;border-radius:50%;cursor:pointer;background:linear-gradient(180deg,rgba(40,30,18,.95),rgba(20,15,9,.95));border:1px solid var(--line);color:var(--gold2);font-size:24px;line-height:1;transition:.18s}
.cararrow:hover{border-color:var(--gold);color:#fff4d6;transform:scale(1.08)}
.cardots{display:flex;justify-content:center;gap:9px;margin-top:18px}
.cardots .dot{width:9px;height:9px;border-radius:50%;background:#4a3a28;cursor:pointer;transition:.2s}
.cardots .dot.on{background:var(--gold);transform:scale(1.25)}
.carcount{text-align:center;color:var(--dim);font-size:12px;margin-top:8px;letter-spacing:.1em}
@media(max-width:680px){
  .pcard{flex-direction:column;max-height:none;min-height:0}
  .pcard-img{flex:none;height:230px}
  .pcard-img img{object-position:center 10%}
  .pcard-body{padding:18px 18px 22px}
  .cararrow{width:38px;height:38px;font-size:20px}
}
/* LOCK SCREEN */
.lockwrap{display:flex;justify-content:center;padding:14px 0}
.lockcard{max-width:460px;width:100%;text-align:center;background:linear-gradient(180deg,var(--panel2),#0f0b07);
  border:1px solid var(--line);border-radius:20px;padding:38px 30px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.lockcard .lockic{font-size:42px;filter:drop-shadow(0 0 14px rgba(200,167,103,.4))}
.lockcard h2{font-family:var(--serif);color:var(--gold2);font-size:22px;margin:14px 0 4px}
.lockcard p.l{color:var(--muted);font-size:13.5px;margin:6px 0 22px}
.pwrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pwrow input{flex:1;min-width:160px;background:#070504;border:1px solid #4a3a28;color:#fff;border-radius:12px;
  padding:14px 16px;font-size:17px;text-align:center;letter-spacing:.15em;font-family:var(--sans)}
.pwrow input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,167,103,.18)}
.seqrow{display:flex;gap:10px;justify-content:center}
.seqrow .dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.seqrow .dial span{font-size:11px;color:var(--dim);letter-spacing:.2em}
.seqrow input{width:84px;text-align:center}
.lockbtn{margin-top:16px;font-family:var(--serif);letter-spacing:.18em;cursor:pointer;color:#1a130b;
  background:linear-gradient(180deg,#f0d9a0,#c8a767);border:0;border-radius:999px;padding:13px 40px;font-size:16px;font-weight:700;transition:.2s}
.lockbtn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(200,167,103,.4)}
.lockhint{color:var(--dim);font-size:12px;margin-top:14px}
.lockerr{color:var(--danger);font-size:13.5px;margin-top:12px;min-height:18px;font-family:var(--serif)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* solution modal */
#solModal .intro-card{max-width:520px}
.sol-warn{background:linear-gradient(180deg,rgba(60,24,20,.6),rgba(20,12,9,.6));border:1px solid rgba(207,107,94,.4);
  border-radius:16px;padding:26px;text-align:center}
.sol-warn .ic{font-size:40px}
.sol-warn h2{font-family:var(--serif);color:#e9a99f;font-size:22px;margin:12px 0}
.sol-warn p{color:var(--muted);font-size:14px}
.sol-btns{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.btn-ghost{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:12px 26px;font-size:14px;font-family:var(--sans);transition:.2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--text)}
.btn-danger{cursor:pointer;background:linear-gradient(180deg,#b9564a,#7e3329);border:0;color:#fff;border-radius:999px;padding:12px 28px;font-size:14px;font-family:var(--serif);letter-spacing:.1em}
#accuseModal .intro-card{max-width:640px}
.accuse-box{background:linear-gradient(180deg,rgba(26,19,12,.97),rgba(12,9,6,.98));border:1px solid var(--line);border-radius:20px;padding:30px 28px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.accuse-box .ic{font-size:38px}
.accuse-box h2{font-family:var(--serif);color:var(--gold2);font-size:23px;margin:10px 0 6px}
.accuse-box #accuseDesc{color:var(--muted);font-size:13.5px;margin:0 0 18px}
.suspect-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.suspect{cursor:pointer;text-align:center;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;color:var(--text);transition:.18s;display:flex;flex-direction:column;font-family:var(--sans)}
.suspect img{width:100%;height:118px;object-fit:cover;object-position:center 18%;display:block;filter:brightness(.92) saturate(.97);background:#0c0907}
.suspect .sinfo{padding:9px 8px 11px}
.suspect:hover{border-color:var(--gold);transform:translateY(-3px)}
.suspect:hover img{filter:brightness(1.04)}
.suspect b{display:block;font-family:var(--serif);font-size:15.5px;color:#f0e3c8}
.suspect span{font-size:11px;color:var(--dim)}
.suspect.wrong{animation:shake .4s;border-color:var(--danger)}
.suspect.chosen{border-color:var(--ok);box-shadow:0 0 0 2px rgba(143,191,134,.35)}
.suspect:disabled{opacity:.45;cursor:default;transform:none}
.accuse-feedback{min-height:22px;margin:16px 0 4px;font-family:var(--serif);font-size:16px}
.accuse-feedback.no{color:var(--danger)}
.accuse-feedback.ok{color:var(--ok)}
.accuse-actions{display:flex;gap:12px;justify-content:center;margin-top:12px;flex-wrap:wrap}
#progress{font-size:12px;color:var(--gold2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap;background:rgba(255,255,255,.03)}
@media(max-width:640px){.suspect-list{grid-template-columns:1fr 1fr}}

@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);z-index:60;
  background:linear-gradient(180deg,#241a10,#15100b);border:1px solid var(--gold);color:var(--gold2);
  padding:13px 24px;border-radius:999px;font-family:var(--serif);font-size:15px;opacity:0;transition:.4s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.5)}

 도원문화재단, 리조트 사업까지 확장시킨 인물이다. 대중에게는 “상상력을 사업으로 만든 기업가”로 알려져 있으며, 도원랜드의 독특한 테마와 몰입형 전시 기획 역시 그의 취향에서 시작되었다.\u003c/p>\n\u003cp>도진명은 평범한 형식의 행사를 좋아하지 않는다.\u003c/p>\n\u003cp>생일, 기념식, 가족 모임까지도 하나의 무대처럼 꾸미는 것을 즐겼고, 이번 65번째 생일파티 역시 자신이 직접 구상한 전시관 〈도원관: 나의 완벽한 가족〉에서 열기로 했다. 이 전시관은 그의 인생과 가족의 시간을 공간별로 재현한 특별한 장소다.\u003c/p>\n\u003cp>겉으로는 여유롭고 품격 있는 노신사처럼 보이지만, 자신이 세운 기준에는 매우 엄격하다. 사람의 재능과 쓸모를 빠르게 파악하는 편이며, 가까운 가족들에게도 감정보다는 결과와 태도를 중시하는 모습을 보여왔다.\u003c/p>\n\u003cp>특히 체스를 좋아해 중요한 결정을 앞두면 혼자 체스판을 놓고 생각하는 습관이 있다. 주변 사람들은 그를 두고 “모든 사람을 말판 위에 올려놓고 보는 사람”이라고 말하기도 한다.\u003c/p>\n\u003cp>이번 생일파티에는 가족과 가장 가까운 측근들만 초대했다.\u003c/p>\n\u003cp>초대장은 모두 도진명이 직접 고른 문구와 함께 발송되었으며, 그는 이 파티를 자신의 인생을 정리하는 가장 중요한 자리로 여기고 있었다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 08_50_54.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_50_54.png\"/>\u003c/p>\n\u003ch2>도윤재\u003c/h2>\n\u003cp>\u003cstrong>35세 / 도진명의 장남 / 도원그룹 전략기획본부장 / 1989.12.24\u003c/strong>\u003c/p>\n\u003cp>도진명 회장의 장남이자 도원그룹의 실무를 가장 가까이에서 맡아온 인물이다.\u003c/p>\n\u003cp>어릴 때부터 후계자 수업을 받아왔으며, 해외 경영대학원 졸업 후 도원그룹에 입사했다. 현재는 그룹의 신사업과 투자 전략을 총괄하고 있다.\u003c/p>\n\u003cp>말수가 많지 않고 감정을 쉽게 드러내지 않는 편이다.\u003c/p>\n\u003cp>책임감이 강하고 예의 바른 태도를 유지하지만, 가족들 사이에서는 다소 거리감이 있는 인물로 보인다. 회장의 뜻을 가장 잘 이해하는 사람으로 평가받으며, 임직원들 사이에서는 “조용하지만 빈틈없는 사람”이라는 평을 듣는다.\u003c/p>\n\u003cp>공식적인 자리에서는 늘 단정한 정장 차림을 유지하며, 도진명 회장과 함께 그룹 행사에 자주 참석해왔다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 08_30_34.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_30_34.png\"/>\u003c/p>\n\u003ch2>도세아\u003c/h2>\n\u003cp>\u003cstrong>30세 / 도진명의 차녀 / 설치미술가, 도원문화재단 이사 / 1994.08.17\u003c/strong>\u003c/p>\n\u003cp>도진명 회장의 둘째 딸이다.\u003c/p>\n\u003cp>예술대학을 졸업한 뒤 해외에서 설치미술과 전시기획을 공부했고, 현재는 작가 활동과 함께 도원문화재단 이사직을 맡고 있다.\u003c/p>\n\u003cp>감각적이고 자기표현이 분명한 성격이다.\u003c/p>\n\u003cp>가족 행사에서도 형식적인 인사보다 분위기와 연출을 신경 쓰는 편이며, 말투는 부드럽지만 자기 기준이 뚜렷하다. 가족들 중 가장 예술적 취향이 강하고, 도진명 회장의 생일 행사나 전시 콘셉트에도 종종 의견을 내왔다.\u003c/p>\n\u003cp>화려한 옷차림보다는 독특하고 세련된 스타일을 선호하며, 사람들과 대화할 때 상대를 관찰하는 듯한 태도가 있다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 08_32_20.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_32_20.png\"/>\u003c/p>\n\u003ch2>도이준\u003c/h2>\n\u003cp>\u003cstrong>23세 / 도진명의 셋째 아들 / 도원그룹 브랜드기획팀 팀장 / 2003.06.04\u003c/strong>\u003c/p>\n\u003cp>도진명 회장의 막내아들이다.\u003c/p>\n\u003cp>어릴 때부터 자유분방하고 붙임성 있는 성격으로 알려져 있었으며, 정해진 틀 안에 머무르기보다는 새로운 사람을 만나고 분위기를 주도하는 일을 좋아했다. 대학 졸업 후 몇 년간 해외에 머물렀고, 3년 전 도원그룹 브랜드기획팀에 합류했다.\u003c/p>\n\u003cp>말이 빠르고 농담이 많아 무거운 자리에서도 분위기를 가볍게 만드는 데 능하다. 공식 행사에서는 밝고 사교적인 모습을 보이며, 도진명 회장의 생일파티에서도 손님들을 자연스럽게 맞이하는 역할을 맡았다.\u003c/p>\n\u003cp>가족들 사이에서는 여전히 철없는 막내처럼 여겨지지만, 의외로 사람의 표정과 기분을 빠르게 읽는 편이다. 다만 진지한 대화나 책임이 따르는 상황에서는 쉽게 농담으로 넘기거나 자리를 피하려는 경향이 있다.\u003c/p>\n\u003cp>겉으로는 아무 고민 없어 보이는 인물이지만, 최근 몇 년 사이 사생활과 관련된 크고 작은 소문이 이어지며 가족 내에서도 그를 불안하게 바라보는 시선이 생겼다. 도이준은 그런 시선마저 웃어넘기지만, 가까이서 보면 그 밝은 태도에는 어딘가 조급함이 섞여 있다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 1일 오후 06_51_01.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_1%EC%9D%BC_%EC%98%A4%ED%9B%84_06_51_01.png\"/>\u003c/p>\n\u003ch2>서리나\u003c/h2>\n\u003cp>\u003cstrong>38세 / 도진명의 아내 / 전 갤러리 운영자 / 1985.08.09\u003c/strong>\u003c/p>\n\u003cp>도진명 회장의 두 번째 아내다.\u003c/p>\n\u003cp>두 사람은 5년 전 한 자선 미술 행사에서 처음 만났고, 3년 전 정식으로 결혼했다. 결혼 전에는 작은 갤러리를 운영했으며, 예술계와 사교계에 폭넓은 인맥을 가지고 있다.\u003c/p>\n\u003cp>차분하고 우아한 분위기의 인물이다.\u003c/p>\n\u003cp>말투가 느리고 부드럽지만, 낯선 사람 앞에서도 쉽게 주눅 들지 않는다. 사람을 대할 때 적당한 거리를 유지하며, 감정을 노골적으로 드러내기보다는 상황을 조용히 살피는 편이다.\u003c/p>\n\u003cp>도진명 회장과 함께 공식 석상에 자주 모습을 드러냈으며, 최근에는 도원문화재단의 행사에도 참여하고 있다. 가족들 사이에서는 아직 완전히 가까워지지는 못했지만, 겉으로는 늘 품위 있는 태도를 유지한다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 08_36_28.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_36_28.png\"/>\u003c/p>\n\u003ch2>문해준\u003c/h2>\n\u003cp>\u003cstrong>40세 / 도진명의 개인 비서 / 도원그룹 회장실 비서팀장 / 1984.01.20\u003c/strong>\u003c/p>\n\u003cp>도진명 회장을 15년째 보좌하고 있는 개인 비서다.\u003c/p>\n\u003cp>도원그룹 회장실에 입사한 뒤 주요 일정, 외부 행사, 사적인 요청까지 도맡아 처리해왔다. 도진명 회장의 가장 가까운 실무 담당자로, 회장의 취향과 생활 패턴을 누구보다 잘 알고 있다.\u003c/p>\n\u003cp>조용하고 절제된 성격이다.\u003c/p>\n\u003cp>불필요한 말을 거의 하지 않고, 필요한 순간에만 정확하게 말한다. 감정을 드러내지 않는 태도 때문에 차갑게 보이기도 하지만, 일 처리만큼은 철저하다는 평가를 받는다.\u003c/p>\n\u003cp>가족은 아니지만 오랫동안 회장 곁을 지켜왔기 때문에, 도원가 사람들도 그를 단순한 직원 이상으로 대한다. 이번 생일파티에서도 초대장 발송, 좌석 배치, 일정 관리를 담당했다.\u003c/p>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오전 08_48_56.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%93%B1%EC%9E%A5%EC%9D%B8%EB%AC%BC/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_08_48_56.png\"/>\u003c/p>\n\u003ch2>백기태\u003c/h2>\n\u003cp>\u003cstrong>45세 / 도진명의 주치의 / 심장내과 전문의 / 1981.07.18\u003c/strong>\u003c/p>\n\u003cp>도진명 회장의 건강을 관리해온 주치의다.\u003c/p>\n\u003cp>대학병원 심장내과 전문의 출신으로, 8년 전부터 도진명 회장의 정기 검진과 건강 관리를 맡고 있다. 현재는 VIP 전담 클리닉을 운영하며, 도원그룹 주요 인사들의 건강 자문도 함께 담당하고 있다.\u003c/p>\n\u003cp>침착하고 이성적인 성격이다.\u003c/p>\n\u003cp>말투는 건조한 편이지만, 환자에게 필요한 설명은 빠짐없이 하는 스타일이다. 응급 상황에서도 쉽게 흔들리지 않으며, 주 vlink\" data-target=\"37281d1c9e14808fba4be1d566f0c27d\" href=\"javascript:void(0)\">약품 냉장고 접근 기록\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e1480848e9ed576525baccd\" href=\"javascript:void(0)\">약품 라벨 프린터 사용 설명서\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14802cb445cb1fcfa09411\" href=\"javascript:void(0)\">백기태 개인 다이어리 🔒\u003c/a>\u003c/p>\n\u003ch3>도원 남성 VIP 세트 (향수 + 손수건)\u003c/h3>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 2일 오후 01_53_30.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%B0%B1%EA%B8%B0%ED%83%9C%20%EC%A7%84%EB%A3%8C%EC%8B%A4/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%ED%9B%84_01_53_30.png\"/>\u003c/p>\n","track":"soundtrack/solace-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14809d881afddffe61e0d8":{"id":"37381d1c9e14809d881afddffe61e0d8","title":"사건","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\u003cp>도윤재는 평생 도진명의 장남이자 후계자로 살아왔다.\u003c/p>\n\u003cp>그는 어린 시절부터 후계자 교육을 받았고, 도원그룹을 물려받기 위해 살아왔다.\u003c/p>\n\u003cp>하지만 사건 직전 도윤재는 다음 사실을 알게 되었다.\u003c/p>\n\u003cpre>\u003ccode>1. 도진명이 자신을 대표이사 후보에서 제외하려 했다.\n2. 자신이 도진명의 친아들이 아니었다.\n3. 1996년 12월 24일, 자신의 생일에 입양 절차가 처리되었다.\n4. 자신의 친어머니는 1996년 7월 12일 도원유원지 리프트 사고 피해자 백하린이었다.\n5. 그 사고는 안전 점검 누락과 기록 조작으로 은폐되었다.\n6. 도진명은 그 사고와 자신의 입양 사실을 알고도 숨겼다.\n\u003c/code>\u003c/pre>\n\u003cp>도윤재의 서재에서는 친자확인서, 대표이사 후보 제외 문서, 미발송 편지가 발견되었다.\u003c/p>\n\u003cp>친자확인서에는 도윤재와 도진명의 친자관계 가능성이 극히 낮다고 적혀 있었다.\u003c/p>\n\u003cp>도윤재의 편지에는 도윤재에게 강한 살해 동기가 있었음을 보여준다.\u003c/p>\n\u003cp>하지만 편지만으로는 살해 실행이 증명되지 않는다.\u003c/p>\n\u003chr />\n\u003ch2>도윤재를 확정하는 증거\u003c/h2>\n\u003cp>도윤재가 범인으로 확정되는 증거는 세 가지다.\u003c/p>\n\u003chr />\n\u003ch3>증거 1. 약통 뚜껑 안쪽의 향수 성분\u003c/h3>\n\u003cp>약통 뚜껑 안쪽에서는 고급 남성 향수 성분이 검출되었다.\u003c/p>\n\u003cp>처음에는 특정 인물을 바로 지목할 수 없었다.\u003c/p>\n\u003cp>도원그룹 VIP 선물 세트에 비슷한 향수가 포함되어 있었기 때문이다.\u003c/p>\n\u003cp>그러나 도윤재 서재에서 발견된 향수와 약통 안쪽에서 검출된 향료 성분이 주요 성분에서 일치했다.\u003c/p>\n\u003cp>이는 도윤재가 약통 내부를 직접 만졌을 가능성을 높인다.\u003c/p>\n\u003chr />\n\u003ch3>증거 2. 유리관 비상 버튼에 낀 커프스 조각\u003c/h3>\n\u003cp>유리관 관리실 조사 결과, 내부 비상 버튼 틈에서 작은 금속 조각이 발견되었다.\u003c/p>\n\u003cp>이 금속 조각에는 도원가 문양 일부가 남아 있었으며, 처음에는 도세아의 브로치, 도이준의 넥타이핀, 도윤재의 커프스 중 어느 것인지 확정할 수 없었다.\u003c/p>\n\u003cp>그러나 도세아 작업실에서 발견된 브로치의 파손면은 금속 조각과 맞지 않았다.\u003c/p>\n\u003cp>도이준의 넥타이핀 역시 금속 조각의 두께와 문양 방향이 일치하지 않았다.\u003c/p>\n\u003cp>반면 도윤재 서재의 커프스 보관함에서는 한쪽 커프스가 비어 있었고, 남아 있는 커프스의 문양, 금속 두께, 절단면 형태가 유리관 비상 버튼에서 발견된 금속 조각과 일치했다.\u003c/p>\n\u003cp>따라서 도진명이 내부에서 비상 버튼을 눌렀음에도 문이 열리지 않았던 이유는, 도윤재의 커프스 조각이 버튼 틈을 막고 있었기 때문으로 보인다.\u003c/p>\n\u003chr />\n\u003ch3>증거 3. 도이준의 목격 메모\u003c/h3>\n\u003cp>도이준의 휴대폰 잠금 폴더에서는 사건 직후 작성된 임시저장 메모가 발견되었다.\u003c/p>\n\u003cp>그 메모에는 도이준이 사건 당일 18시 40분이 조금 지난 시각, 약품 냉장고 쪽 복도에서 도윤재를 보았다는 내용이 적혀 있었다.\u003c/p>\n\u003cp>도이준은 당시 사채 협박과 금고 문제 때문에 정신이 없었고, 자신이 왜 그곳에 있었는지 들킬까 봐 목격 사실을 숨겼다.\u003c/p>\n\u003cp>메모에 따르면 도윤재는 평소와 달리 검은 장갑을 끼고 있었고, 약품 냉장고 쪽 복도에서 나오는 모습이었다.\u003c/p>\n\u003cp>도이준은 도윤재가 약통을 직접 바꾸는 장면을 본 것은 아니지만, 라벨 프린터 기록이 남은 18시 42분 전후에 도윤재가 약품 냉장고 근처에 있었다는 사실을 증언하는 중요한 목격자다.\u003c/p>\n\u003cp>이 메모는 백기태에게 쏠려 있던 약품실 접근 의심을 도윤재 쪽으로 돌리는 결정적 보조 증거가 된다.\u003c/p>\n\u003chr />\n\u003ch3>증거 4. 녹음기 녹음\u003c/h3>\n\u003cp>중앙 생일홀에서 발견된 녹음기에는 마지막 자동 녹음 파일이 저장되어 있었다.\u003c/p>\n\u003cp>조사 결과 녹음기는 영문 비밀번호로 잠겨 있었다.\u003c/p>\n\u003cp>녹음기에서 복구된 녹음에는 도진명과 도윤재의 대화가 남아 있었다.\u003c/p>\n\u003cp>녹음 속에서 도진명은 도윤재에게 약을 건드렸냐고 물었고, 도윤재는 이를 부정하지 않았다.\u003c/p>\n\u003cp>또한 도진명은 유리관 안에서 문을 열어달라고 요청했지만, 도윤재는 문을 열어주지 않았다.\u003c/p>\n\u003cp>이 녹음은 도윤재가 도진명의 약을 건드렸고, 유리관 밖에 있었으며, 도진명이 살아 있는 상태에서 구조하지 않았다는 사실을 보여준다.\u003c/p>\n\u003cp>따라서 도윤재의 범행이 확정된다.\u003c/p>\n\u003chr />\n\u003ch1>6. 범행 방식\u003c/h1>\n\u003cp>도윤재는 사건 전, 도진명의 약 복용 습관을 확인했다.\u003c/p>\n\u003cp>도진명은 매일 19:00에 심장약을 복용했다.\u003c/p>\n\u003cp>도윤재는 이 약을 바꿔치기하기 위해 약품실 라벨 프린터를 \u003ccode>GUEST PRINT\u003c/code> 방식으로 사용했다.\u003c/p>\n\u003cp>그는 기존 약통과 색이 비슷한 약통에 새 라벨을 붙였고, 그 안에 도진명의 심장 상태에 치명적일 수 있는 혈압 강하 성분을 섞었다.\u003c/p>\n\u003cp>이로 인해 도진명은 19:00 약 복용 이후 급격한 혈압 저하를 겪었다.\u003c/p>\n\u003cp>이후 도윤재는 도세아의 유리관 퍼포먼스 구조를 이용했다.\u003c/p>\n\u003cp>도세아의 유리관은 원래 안전 장치가 있는 전시 장치였으나, 도윤재는 외부 잠금을 실행하고 내부 비상 버튼을 자신의 커프스 조각으로 막았다.\u003c/p>\n\u003cp>도진명은 유리관 안에서 비상 버튼을 눌렀지만 버튼은 작동하지 않았다.\u003c/p>\n\u003cp>도윤재는 도진명이 살아 있는 것을 알면서도 문을 열어주지 않았다.\u003c/p>\n\u003cp>도진명은 결국 약물로 인한 심혈관계 이상과 유리관 내부 감금 상태가 겹치며 사망했다.\u003c/p>","track":"soundtrack/incredulity-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480d79dfad7b5b30914f5":{"id":"37281d1c9e1480d79dfad7b5b30914f5","title":"서리나 파우더룸","locked":true,"lock_type":"single","answers":["0321"],"children":["37281d1c9e148008aeb8c98890c43124","37281d1c9e14804489c5fc9e91fdd6ba","37281d1c9e1480b09744f1128538075e","37281d1c9e14802bb2b3edcc03cbefa6","37381d1c9e14800595fcf63eb05062c2"],"html":"\n\u003ch2>발견 단서\u003c/h2>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e148008aeb8c98890c43124\" href=\"javascript:void(0)\">구매 영수증\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14804489c5fc9e91fdd6ba\" href=\"javascript:void(0)\">이혼 합의서\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e1480b09744f1128538075e\" href=\"javascript:void(0)\">도진명과의 혼전계약서 사본\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37281d1c9e14802bb2b3edcc03cbefa6\" href=\"javascript:void(0)\">0000 000 00 신청서 🔒\u003c/a>\u003c/p>\n\u003cp>\u003ca class=\"navlink\" data-target=\"37381d1c9e14800595fcf63eb05062c2\" href=\"javascript:void(0)\">메신저  🔒\u003c/a>\u003c/p>\n\u003ch3>수면제 봉투\u003c/h3>\n\u003cp>\u003cimg alt=\"ChatGPT Image 2026년 6월 1일 오후 07_28_45.png\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EC%84%9C%EB%A6%AC%EB%82%98%20%ED%8C%8C%EC%9A%B0%EB%8D%94%EB%A3%B8%20%F0%9F%94%92/ChatGPT 6ce2513a45a64a","title":"유리관 전시 설계 스케치","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 중앙 생일홀 전시 구조 스케치\u003c/p>\n\u003cp>작성자: 도세아\u003c/p>\n\u003cp>작성일자: 2024년 06월 03일\u003c/p>\n\u003ch2>스케치 설명\u003c/h2>\n\u003cp>중앙 생일홀 한가운데 유리관이 배치되어 있다.\u003c/p>\n\u003cp>유리관은 단순한 장식장이 아니라, 생일파티의 중심 오브제로 설계되어 있다.\u003c/p>\n\u003cp>도진명이 생일 케이크 앞에 앉으면, 투명한 유리관이 천천히 내려와 그를 감싸는 구조다.\u003c/p>\n\u003cp>스케치 하단에는 도세아의 필체로 다음과 같은 문장이 적혀 있다.\u003c/p>\n\u003chr/>\n\u003ch2>구조 메모\u003c/h2>\n\u003cp>유리관 구성:\u003c/p>\n\u003cul>\n\u003cli>강화 유리 4면\u003c/li>\n\u003cli>외부 수동 잠금장치\u003c/li>\n\u003cli>내부 비상 버튼\u003c/li>\n\u003cli>내부 환기구\u003c/li>\n\u003cli>하단 이동 레일\u003c/li>\n\u003cli>전시 조명 3개\u003c/li>\n\u003cli>테이블 고정 장치\u003c/li>\n\u003c/ul>\n\u003cp>중요 표시:\u003c/p>\n\u003cpre>\u003ccode>내부 비상 버튼은 반드시 정상 작동해야 함.\n전시 중 인물 안전 확보 필수.\n닫히는 속도는 느리게.\n공포감을 주되 실제 위험은 없어야 함.\n\u003c/code>\u003c/pre>\n","track":"soundtrack/reverie-pt-2-by-lucjo.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14804fadadf4f76dcfa9b8":{"id":"37381d1c9e14804fadadf4f76dcfa9b8","title":"작품 기획서: 「아버지를 전시한다」","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 도진명 회장 65세 생일 기념 퍼포먼스 기획안\u003c/p>\n\u003cp>작품명: 아버지를 전시한다\u003c/p>\n\u003cp>작성자: 도세아\u003c/p>\n\u003cp>작성일자: 2026년 12월 20일\u003c/p>\n\u003cp>문서 상태: 출력본 / 일부 문장 형광펜 표시\u003c/p>\n\u003chr/>\n\u003ch2>작품 개요\u003c/h2>\n\u003cp>본 작품은 도진명 회장의 65세 생일을 기념하여 제작되는 일회성 퍼포먼스이다.\u003c/p>\n\u003cp>작품의 중심에는 투명한 유리관이 있다.\u003c/p>\n\u003cp>도진명 회장은 그 유리관 안에 앉아 생일 축하를 받는다.\u003c/p>\n\u003cp>그동안 고생한 아버지에게 가족들이 축하한다.\u003c/p>\n\u003ch2>연출 방식\u003c/h2>\n\u003col>\n\u003cli>생일 케이크가 중앙 테이블에 놓인다.\u003c/li>\n\u003cli>도진명 회장이 자리에 앉는다.\u003c/li>\n\u003cli>생일 축하 음악이 흐른다.\u003c/li>\n\u003cli>유리관 조명이 켜진다.\u003c/li>\n\u003cli>유리관이 닫힌다.\u003c/li>\n\u003cli>가족사진들이 벽면에 투사된다.\u003c/li>\n\u003cli>마지막 화면에 문장이 나타난다.\u003c/li>\n\u003c/ol>\n\u003cp>마지막 문장:\u003c/p>\n\u003cpre>\u003ccode>생일 축하드려요 아버지\n\u003c/code>\u003c/pre>\n\u003chr/>\n\u003ch2>안전 관련 메모\u003c/h2>\n\u003cpre>\u003ccode>유리관 내부 비상 버튼 필수.\n외부 잠금은 연출용으로만 사용.\n닫힘 시간 30초 이상.\n내부 산소 문제 없도록 환기구 개방.\n인물 동의 없이 장시간 폐쇄 금지.\n\u003c/code>\u003c/pre>\n\u003chr/>\n","track":"soundtrack/reverie-pt-2-by-lucjo.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e1480b89822f04d99bdf69d":{"id":"37381d1c9e1480b89822f04d99bdf69d","title":"0000 00 00지","locked":true,"lock_type":"single","answers":["891203"],"children":[],"html":"\n\u003ch1>친자확인 검사 결과지\u003c/h1>\n\u003cp>문서명: 유전자 친자관계 확인 결과 통지서\u003c/p>\n\u003cp>검사기관: 한서유전의학연구소\u003c/p>\n\u003cp>의뢰일자: 2026년 12월 10일\u003c/p>\n\u003cp>결과일자: 2026년 12월 13일\u003c/p>\n\u003cp>문서 상태: 사본\u003c/p>\n\u003cp>의뢰인: 도윤재\u003c/p>\n\u003chr/>\n\u003ch2>1. 검사 대상\u003c/h2>\n\u003cp>검체 A: 도윤재\u003c/p>\n\u003cp>검체 B: 도진명\u003c/p>\n\u003cp>검사 목적: 생물학적 친자관계 확인\u003c/p>\n\u003cp>검사 방식: STR 유전자 마커 비교 분석\u003c/p>\n\u003cp>비고: 본 문서는 극 중 소품용 설정 문서임\u003c/p>\n\u003chr/>\n\u003ch2>2. 검사 결과 요약\u003c/h2>\n\u003cp>검체 A와 검체 B의 유전자 마커 비교 결과, 생물학적 친자관계를 지지하는 유전적 일치 양상이 확인되지 않음.\u003c/p>\n\u003cp>친자관계 가능성: 매우 낮음\u003c/p>\n\u003cp>친자관계 추정 확률: 0.03% 미만\u003c/p>\n\u003cp>\u003cstrong>결론: 생물학적 부자 관계로 보기 어려움\u003c/strong>\u003c/p>\n\u003chr/>\n\u003ch2>3. 세부 소견\u003c/h2>\n\u003cp>일부 유전자 좌위에서 부자 관계일 경우 기대되는 일치 패턴이 확인되지 않았다.\u003c/p>\n\u003cp>\u003cstrong>검사 결과상 검체 B가 검체 A의 생물학적 부친일 가능성은 극히 낮은 것으로 판단된다.\u003c/strong>\u003c/p>\n","track":"soundtrack/the-things-that-keep-us-here-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14803c80afd89c3280c948":{"id":"37381d1c9e14803c80afd89c3280c948","title":"대표이사 후보 제외 검토 문서","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 차기 대표이사 후보군 조정 검토안\u003c/p>\n\u003cp>작성부서: 도원그룹 회장실 / 전략기획실\u003c/p>\n\u003cp>작성일자: 2026년 12월 10일\u003c/p>\n\u003cp>문서 등급: 극비\u003c/p>\n\u003cp>문서 상태: 도윤재 서재에서 찢어진 상태로 발견\u003c/p>\n\u003chr/>\n\u003ch2>1. 검토 배경\u003c/h2>\n\u003cp>도원그룹은 도진명 회장 고령화 및 건강 악화에 따라 \u003cstrong>차기 대표이사 후보군\u003c/strong>을 재정비하고자 한다.\u003c/p>\n\u003cp>기존 유력 후보자인 도윤재 상무는 장기간 후계자 교육을 이수하였으나, 최근 회장 지시에 따라 대표이사 후보군에서 제외하는 방안을 검토한다.\u003c/p>\n\u003chr/>\n\u003ch2>2. 후보 제외 사유\u003c/h2>\n\u003ch3>1. 경영 판단 독립성 부족\u003c/h3>\n\u003cp>도윤재 상무는 주요 의사결정 과정에서 도진명 회장의 판단을 우선 확인하는 경향이 강하다.\u003c/p>\n\u003cp>위기 상황에서 즉각적인 책임 판단보다 내부 승인 절차를 우선시하는 태도가 반복적으로 확인되었다.\u003c/p>\n\u003ch3>2. 회장 개인 판단\u003c/h3>\n\u003cp>도진명 회장은 도윤재 상무의 대표이사 선임에 대해 “아직 때가 아니다”라는 의견을 전달하였다.\u003c/p>\n\u003chr/>\n\u003ch2>3. 대체 후보 검토\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>후보\u003c/th>\n\u003cth>검토 의견\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>전문경영인 A\u003c/td>\n\u003ctd>외부 평판 안정적, 오너 리스크 낮음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>도세아\u003c/td>\n\u003ctd>경영 경험 부족, 대외 이미지 활용 가능\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>도이준\u003c/td>\n\u003ctd>경영 리스크 큼, 후보 제외\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>도윤재\u003c/td>\n\u003ctd>장기 교육 이수자이나 법무 리스크 존재\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>문해준\u003c/td>\n\u003ctd>도진명 회장 추천.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>4. 결론\u003c/h2>\n\u003cp>도윤재 상무는 \u003cstrong>장기 후계자 교육 이수자이나 차기 대표이사 후보군에서 제외하는 방안을 우선 검토\u003c/strong>한다.\u003c/p>\n\u003cp>대표이사 선임은 도진명 회장의 생일 행사 이후 별도 이사회에서 논의한다.\u003c/p>\n","track":"soundtrack/the-things-that-keep-us-here-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e1480d99a86c43fdf7c4387":{"id":"37381d1c9e1480d99a86c43fdf7c4387","title":"도윤재 후계자 교육 일정표","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 도원그룹 후계자 경영 승계 교육 일정표\u003c/p>\n\u003cp>관리부서: 도원그룹 전략기획실 / 인사전략팀\u003c/p>\n\u003cp>대상자: 도윤재\u003c/p>\n\u003cp>문서 작성일: 2012년 01월 10일\u003c/p>\n\u003cp>최종 수정일: 2025년 11월 03일\u003c/p>\n\u003cp>문서 상태: 내부 교육용 사본\u003c/p>\n\u003chr/>\n\u003ch2>1. 교육 목적\u003c/h2>\n\u003cp>본 일정표는 도원그룹 장기 승계 계획에 따라 도윤재 상무를 차기 경영권 후보자로 육성하기 위해 작성된 내부 교육 자료이다.\u003c/p>\n\u003cp>도윤재 상무는 도진명 회장의 장남으로서 그룹 주요 계열사의 사업 구조, 재무 관리, 대외 협상, 위기 대응, 임원 리더십 과정을 단계적으로 이수한다.\u003c/p>\n\u003chr/>\n\u003ch2>2. 장기 교육 과정\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>연도\u003c/th>\n\u003cth>교육 과정\u003c/th>\n\u003cth>담당 부서\u003c/th>\n\u003cth>비고\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>2012\u003c/td>\n\u003ctd>그룹 계열사 순환 근무\u003c/td>\n\u003ctd>인사전략팀\u003c/td>\n\u003ctd>제조, 유통, 테마파크 계열사\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2013\u003c/td>\n\u003ctd>재무제표 및 투자 검토 교육\u003c/td>\n\u003ctd>재무관리실\u003c/td>\n\u003ctd>회장실 보고 동행\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2015\u003c/td>\n\u003ctd>해외 법인 실무 파견\u003c/td>\n\u003ctd>글로벌사업부\u003c/td>\n\u003ctd>싱가포르 법인 8개월\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2017\u003c/td>\n\u003ctd>위기관리 및 언론 대응 교육\u003c/td>\n\u003ctd>대외협력실\u003c/td>\n\u003ctd>사고 대응 시뮬레이션 포함\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2019\u003c/td>\n\u003ctd>이사회 보고 실습\u003c/td>\n\u003ctd>전략기획실\u003c/td>\n\u003ctd>분기별 보고 참여\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2021\u003c/td>\n\u003ctd>계열사 대표 회의 배석\u003c/td>\n\u003ctd>회장실\u003c/td>\n\u003ctd>의결권 없음\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2023\u003c/td>\n\u003ctd>도원랜드 리뉴얼 사업 총괄 보좌\u003c/td>\n\u003ctd>테마파크사업본부\u003c/td>\n\u003ctd>실무 총괄 후보\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2025\u003c/td>\n\u003ctd>대표이사 후보자 사전 평가\u003c/td>\n\u003ctd>인사위원회\u003c/td>\n\u003ctd>평가 보류\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>3. 회장 지시 사항\u003c/h2>\n\u003cp>도진명 회장 수기 지시:\u003c/p>\n\u003cp>“윤재는 성실하다.\u003c/p>\n\u003cp>그러나 성실함만으로 회사를 맡길 수는 없다.\u003c/p>\n\u003cp>결정적인 순간에 자기 판단보다 내 판단을 먼저 기다린다.\u003c/p>\n\u003cp>\u003cstrong>후계자는 지시를 잘 따르는 사람이 아니라, 책임을 혼자 질 수 있는 사람\u003c/strong>이어야 한다.”\u003c/p>\n\u003chr/>\n\u003ch2>4. 평가 메모\u003c/h2>\n\u003cp>인사전략팀 내부 평가:\u003c/p>\n\u003cp>도윤재 상무는 조직 이해도와 대외 이미지가 안정적이며, 임직원 신뢰도도 높은 편이다.\u003c/p>\n\u003cp>다만 \u003cstrong>회장 의존도가 높고\u003c/strong>, 위기 상황에서 독자적 결정을 피하는 경향이 있다.\u003c/p>\n\u003cp>2025년 하반기 대표이사 후보자 평가에서 최종 검토 대상에 포함되었으나, \u003cstrong>회장 판단에 따라 평가가 보류\u003c/strong>되었다.\u003c/p>\n","track":"soundtrack/the-things-that-keep-us-here-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14809ea5bdf82eecddb94a":{"id":"37381d1c9e14809ea5bdf82eecddb94a","title":"아버지에게","locked":true,"lock_type":"single","answers":["891203"],"children":[],"html":"\n\u003ch1>보내지 못한 편지\u003c/h1>\n\u003cp>발견 위치: 도윤재 서재 책상 서랍\u003c/p>\n\u003cblockquote>\n\u003cp>아버지께.\u003c/p>\n\u003cp>아직도 이 말을 쓰는 게 맞는지 모르겠습니다.\u003c/p>\n\u003cp>아버지.\u003c/p>\n\u003cp>저는 평생 그 말을 의심해본 적이 없습니다.\u003c/p>\n\u003cp>아버지의 성을 쓰고, 아버지의 집에서 자랐고, 아버지의 회사를 물려받기 위해 살았습니다.\u003c/p>\n\u003cp>늘 아버지의 관심을 받으려고 애쓰면서 살았습니다.\u003c/p>\n\u003cp>어릴 때부터 사람들은 저를 후계자라고 불렀습니다.\u003c/p>\n\u003cp>장남이라고 불렀습니다.\u003c/p>\n\u003cp>도진명 회장의 아들이라고 불렀습니다.\u003c/p>\n\u003cp>그래서 저도 그런 줄 알았습니다.\u003c/p>\n\u003cp>그런데 오늘 알았습니다.\u003c/p>\n\u003cp>저는 당신의 자식이 아니었습니다.\u003c/p>\n\u003cp>친자확인서도 봤습니다.\u003c/p>\n\u003cp>입양 확정서도 봤습니다.\u003c/p>\n\u003cp>1996년 12월 24일.\u003c/p>\n\u003cp>제 생일에 맞춰 처리된 그 서류를 봤습니다.\u003c/p>\n\u003cp>누군가는 그걸 선물이라고 생각했을지도 모르겠습니다.\u003c/p>\n\u003cp>고아가 된 아이를 도원가로 데려온 아름다운 이야기라고 포장할 수도 있겠지요.\u003c/p>\n\u003cp>하지만 저는 이제 압니다.\u003c/p>\n\u003cp>제 어머니 백하린.\u003c/p>\n\u003cp>그 이름이 왜 당신 서류 속에 있었습니까.\u003c/p>\n\u003cp>왜 1996년 7월 12일 사고 기록이 대표이사 후보 제외 문서에 붙어 있었습니까.\u003c/p>\n\u003cp>왜 어머니의 진술은 빠지고, 기사에는 어머니가 안전 수칙을 어겼다고 나갔습니까.\u003c/p>\n\u003cp>아버지.\u003c/p>\n\u003cp>아니, 회장님.\u003c/p>\n\u003cp>제 어머니를 죽인 겁니까.\u003c/p>\n\u003cp>아니면 죽게 두고, 그 책임을 어머니에게 떠넘긴 겁니까.\u003c/p>\n\u003cp>그것도 모자라 그 아들을 데려와 장남으로 키운 겁니까.\u003c/p>\n\u003cp>저는 평생 회사를 지키는 법을 배웠습니다.\u003c/p>\n\u003cp>위기를 덮는 법도 배웠고, 사람들 앞에서 흔들리지 않는 법도 배웠습니다.\u003c/p>\n\u003cp>당신은 그것을 경영이라고 불렀습니다.\u003c/p>\n\u003cp>묻고 싶습니다.\u003c/p>\n\u003cp>단 한 번이라도 저를 아들로 사랑한 적이 있었습니까.\u003c/p>\n\u003cp>아니면 제가 당신을 아버지라고 부를 때마다, 진심으로 제 아버지라고 생각하신 적이 있습니까?\u003c/p>\n\u003cp>저는 모르겠습니다.\u003c/p>\n\u003cp>하지만 한 가지는 압니다.\u003c/p>\n\u003cp>제가 평생 믿었던 가족은\u003c/p>\n\u003cp>당신이 만든 가장 오래된 거짓말이었습니다.\u003c/p>\n\u003cp>사랑했습니다. 회장님.\u003c/p>\n\u003c/blockquote>\n","track":"soundtrack/the-long-way-home-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e148000bd66e4883d996069":{"id":"37281d1c9e148000bd66e4883d996069","title":"000 000 메모","locked":true,"lock_type":"single","answers":["610505"],"children":[],"html":"\u003ch1>000 000 메모 🔒\u003c/h1>\n\u003ch1>회장실 비공개 메모\u003c/h1>\n\u003cp>문서명: 정인 관련 처리 메모\u003c/p>\n\u003cp>작성일자: 1984년 01월경\u003c/p>\n\u003cp>작성자: 도원가 법무 대리인 추정\u003c/p>\n\u003cp>문서 상태: 사본 / 원본 위치 불명\u003c/p>\n\u003chr />\n\u003ch2>메모 내용\u003c/h2>\n\u003cp>정인 씨와 아이 문제는 더 이상 외부로 확산되지 않도록 정리할 것.\u003c/p>\n\u003cp>\u003cstrong>도진명 전무는 직접 관여하지 않는 것\u003c/strong>으로 처리한다.\u003c/p>\n\u003cp>도원그룹 장학재단을 통해 후원 형식으로 지원한다.\u003c/p>\n\u003cp>아이의 성은 그대로 둔다.\u003c/p>\n\u003cp>도씨 가문과의 관계는 어떠한 문서에도 명시하지 않는다.\u003c/p>\n\u003cp>\u003cstrong>문정인에게는 별도 생활비를 지급하되, 도진명 전무와의 직접 접촉은 제한\u003c/strong>한다.\u003c/p>\n\u003cp>\u003cstrong>문정인과 도진명의 혼인 문제는 회장님 반대로 종결된 사안임.\u003c/strong>\u003c/p>","track":"soundtrack/echoes-of-home-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e148060ad9df6023e1caf88":{"id":"37281d1c9e148060ad9df6023e1caf88","title":"문해준 개인 다이어리","locked":true,"lock_type":"single","answers":["610505"],"children":[],"html":"\n\u003ch3>사진\u003c/h3>\n\u003cp>\u003cimg alt=\"엄마 사진…\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%AC%B8%ED%95%B4%EC%A4%80%20%EB%B9%84%EC%84%9C%EC%8B%A4%20%F0%9F%94%92/%EB%AC%B8%ED%95%B4%EC%A4%80%20%EA%B0%9C%EC%9D%B8%20%EB%8B%A4%EC%9D%B4%EC%96%B4%EB%A6%AC%20%F0%9F%94%92/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%ED%9B%84_12_12_27.png\"/>\u003c/p>\n\u003cp>엄마 사진…\u003c/p>\n\u003ch3>편지\u003c/h3>\n\u003cblockquote>\n\u003cp>나는 오늘 사진을 보았다.\u003c/p>\n\u003cp>회장님의 낡은 지갑 안쪽,\n오래되어 색이 바랜 작은 사진 한 장.\u003c/p>\n\u003cp>누구에게도 보여주지 않았을 법한 사진이었다.\u003c/p>\n\u003cp>젊은 회장님 옆에 한 여자가 서 있었다.\u003c/p>\n\u003cp>처음에는 믿지 않았다.\n그저 어머니와 닮은 사람이라고 생각했다.\u003c/p>\n\u003cp>하지만 사진 뒷면에 적힌 이름을 보고,\n더 이상 모른 척할 수 없었다.\u003c/p>\n\u003cp>정인.\u003c/p>\n\u003cp>어머니의 이름이었다.\u003c/p>\n\u003cp>나는 어릴 때 한동안 보육원에 있었다.\u003c/p>\n\u003cp>그렇다고 어머니와 완전히 끊어진 것은 아니었다.\n어머니는 가끔 나를 보러 왔다.\n늘 미안한 얼굴로, 조금만 더 기다려달라고 했다.\u003c/p>\n\u003cp>지금은 데려갈 수 없지만,\n언젠가는 꼭 같이 살 수 있을 거라고 했다.\u003c/p>\n\u003cp>나는 그 말을 믿었다.\u003c/p>\n\u003cp>아버지에 대해서는 늘 같은 말뿐이었다.\u003c/p>\n\u003cp>돌아가셨다고.\n네가 아주 어릴 때 사고로 세상을 떠났다고.\u003c/p>\n\u003cp>그래서 그런 줄 알았다.\u003c/p>\n\u003cp>없는 사람을 원망할 수는 없었다.\n죽은 사람을 기다릴 수도 없었다.\u003c/p>\n\u003cp>그런데 아니었다.\u003c/p>\n\u003cp>그는 살아 있었다.\u003c/p>\n\u003cp>그것도 아주 가까이에 있었다.\u003c/p>\n\u003cp>그는 알고 있었다.\n처음부터 알고 있었다.\u003c/p>\n\u003cp>다만 아들이라는 말 대신,\n후원금이라는 이름을 선택했을 뿐이다.\u003c/p>\n\u003cp>나는 평생 그 사람을 회장님이라고 불렀다.\u003c/p>\n\u003cp>일정을 정리하고,\n차를 준비하고,\n가족 행사의 좌석을 확인하고,\n그의 자식들이 앉을 자리를 배치했다.\u003c/p>\n\u003cp>마흔을 훌쩍 넘겨서야 아버지가 나타나는 이야기는 우습다.\u003c/p>\n\u003cp>더 우스운 것은,\n내가 어쩌면 그 사람을 오래 기다리고 있었는지도 모른다는 사실이다.\u003c/p>\n\u003cp>그는 내가 누구인지 알고 있었다.\u003c/p>\n\u003cp>그런데도 나를 비서로 곁에 두었다.\n철저히 타인처럼 대했다.\u003c/p>\n\u003cp>가족이 아닌 의사조차 가족 테이블에 앉는 자리에서,\n내 자리는 늘 한 발 뒤였다.\u003c/p>\n\u003cp>비서로서는 정확한 자리였다.\u003c/p>\n\u003cp>내 자리는 어디였을까.\u003c/p>\n\u003cp>비서실장 자리였나.\u003c/p>\n\u003cp>가족석이었나.\u003c/p>\n\u003cp>아니면 끝내,\n사진 뒷면에만 남을 자리였나.\u003c/p>\n\u003c/blockquote>\n","track":"soundtrack/faith-by-vishmak.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14805aa0d2c542366b7243":{"id":"37281d1c9e14805aa0d2c542366b7243","title":"문해준의 오래된 후원금 서류","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 장기 후원금 지급 내역 확인서\u003c/p>\n\u003cp>관리번호: DW-FND-1991-0417\u003c/p>\n\u003cp>작성기관: 도원그룹 장학재단\u003c/p>\n\u003cp>문서 상태: 사본\u003c/p>\n\u003cp>보관 위치: 문해준 비서실 하단 서랍\u003c/p>\n\u003chr/>\n\u003ch2>후원 대상자 정보\u003c/h2>\n\u003cp>성명: 문해준\u003c/p>\n\u003cp>성별: 남\u003c/p>\n\u003cp>생년월일: 1984년 01월 20일\u003c/p>\n\u003cp>최초 후원 시작일: 1985년 04월 17일\u003c/p>\n\u003cp>후원 시작 당시 연령: 만 0세\u003c/p>\n\u003cp>후원 구분: 비공개 장기 후원\u003c/p>\n\u003cp>후원 명의: 도원그룹 장학재단\u003c/p>\n\u003cp>실제 승인자: 도진명\u003c/p>\n\u003chr/>\n\u003ch2>후원 내역 요약\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>기간\u003c/th>\n\u003cth>지원 항목\u003c/th>\n\u003cth>비고\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>1985.04.17 ~ 1997.12.31\u003c/td>\n\u003ctd>생활비 지원\u003c/td>\n\u003ctd>보호자 계좌로 월 지급\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1998.01.01 ~ 2006.02.28\u003c/td>\n\u003ctd>교육비 지원\u003c/td>\n\u003ctd>사립학교 등록금 일부 지원\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2005.03.01 ~ 2011.08.31\u003c/td>\n\u003ctd>대학 등록금 지원\u003c/td>\n\u003ctd>장학재단 특별 장학생 처리\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2012.01.01 ~ 2015.12.31\u003c/td>\n\u003ctd>해외 연수비 일부 지원\u003c/td>\n\u003ctd>회장실 승인 건\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2016.03.01 이후\u003c/td>\n\u003ctd>도원그룹 회장실 채용 연계\u003c/td>\n\u003ctd>개인 비서직 배치\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>특이사항\u003c/h2>\n\u003cp>후원 대상자는 일반 장학생 명단에 등재되어 있으나, 심사 기록이 존재하지 않는다.\u003c/p>\n\u003cp>최초 후원 사유, 가족관계 확인서, 보호자 면담 기록은 별도 비공개 파일로 분리 보관되어 있다.\u003c/p>\n\u003cp>후원금은 장학재단 명의로 지급되었으나, 내부 결재 문서에는 매년 도진명 회장의 직접 승인 표시가 남아 있다.\u003c/p>\n","track":"soundtrack/echoes-of-home-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480319f9fd999dcf63cdb":{"id":"37281d1c9e1480319f9fd999dcf63cdb","title":"도진명 심장질환 진료기록","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 도진명 회장 심혈관계 정기 진료기록\u003c/p>\n\u003cp>진료기관: 도원메디컬센터 VIP 진료실\u003c/p>\n\u003cp>담당의: 백기태\u003c/p>\n\u003cp>환자명: 도진명\u003c/p>\n\u003cp>생년월일: 1961년 12월 25일\u003c/p>\n\u003cp>최근 진료일: 2026년 12월 22일\u003c/p>\n\u003cp>문서 상태: 사본\u003c/p>\n\u003chr/>\n\u003ch2>1. 주요 진단명\u003c/h2>\n\u003col>\n\u003cli>만성 심부전\u003c/li>\n\u003cli>불안정성 부정맥\u003c/li>\n\u003cli>고혈압성 심장질환\u003c/li>\n\u003cli>과거 심근 허혈 의심 소견\u003c/li>\n\u003cli>저혈압성 실신 병력 있음\u003c/li>\n\u003c/ol>\n\u003cp>환자는 최근 6개월간 피로감, 흉부 답답함, 불규칙한 심박, 어지럼을 반복적으로 호소하였다.\u003c/p>\n\u003cp>특히 야간 행사, 음주, 과로, 수면 부족 이후 혈압 변동이 심해지는 경향이 확인되었다.\u003c/p>\n\u003chr/>\n\u003ch2>2. 최근 상태 요약\u003c/h2>\n\u003cp>최근 검사상 심장 기능이 이전보다 저하되어 있으며, 급격한 혈압 저하 또는 심박 불안정이 발생할 경우 실신, 호흡곤란, 심정지 위험이 있다.\u003c/p>\n\u003cp>환자는 외부 행사와 가족 모임을 이유로 입원 관찰 권고를 거부하였다.\u003c/p>\n\u003cp>담당의 소견:\u003c/p>\n\u003cp>“행사 당일 음주, 진정제, 수면유도제, 과도한 스트레스는 피해야 함.\u003c/p>\n\u003cp>특히 기존 심장약 복용 시간 전후로 다른 안정제 계열 약물을 임의 복용할 경우, 혈압 및 심박 조절에 문제가 발생할 수 있음.”\u003c/p>\n\u003chr/>\n\u003ch2>3. 약물 관련 주의사항\u003c/h2>\n\u003cp>현재 환자는 심박 조절제와 혈압 조절제를 함께 복용 중이다.\u003c/p>\n\u003cp>다음 약물 또는 상황은 위험할 수 있음.\u003c/p>\n\u003cul>\n\u003cli>수면유도제 계열 약물\u003c/li>\n\u003cli>강한 진정 작용이 있는 안정제\u003c/li>\n\u003cli>혈압을 추가로 낮추는 약물\u003c/li>\n\u003cli>과량의 음주\u003c/li>\n\u003cli>탈수 상태\u003c/li>\n\u003cli>장시간 금식 후 약 복용\u003c/li>\n\u003cli>과도한 스트레스 직후 약 복용\u003c/li>\n\u003c/ul>\n\u003cp>주의:\u003c/p>\n\u003cp>수면유도제나 진정제 자체가 곧바로 치명적이라는 의미는 아니나,\u003c/p>\n\u003cp>도진명처럼 심장 기능이 불안정한 환자의 경우 기존 심장약, 음주, 피로, 혈압 변동이 겹치면 위험성이 커질 수 있음.\u003c/p>\n\u003cp>특히 환자가 매일 복용하는 심장약이 다른 혈압 강하 성분과 혼합될 경우, 급격한 혈압 저하와 의식 소실 가능성이 있음.\u003c/p>\n\u003chr/>\n","track":"soundtrack/solace-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14802cb445cb1fcfa09411":{"id":"37281d1c9e14802cb445cb1fcfa09411","title":"백기태 개인 다이어리","locked":true,"lock_type":"single","answers":["960712"],"children":[],"html":"\n\u003ch1>백기태의 가족 사진\u003c/h1>\n\u003cp>\u003cimg alt=\"내가 세상에서 제일 사랑하는 우리 누나랑 조카 윤종이!\" loading=\"lazy\" src=\"notion_mystery_game_html/%E3%80%8A%EC%A3%BD%EC%9D%80%20%EC%9E%90%EC%9D%98%20%EC%83%9D%EC%9D%BC%ED%8C%8C%ED%8B%B0%E3%80%8B/%EB%B0%B1%EA%B8%B0%ED%83%9C%20%EC%A7%84%EB%A3%8C%EC%8B%A4/%EB%B0%B1%EA%B8%B0%ED%83%9C%20%EA%B0%9C%EC%9D%B8%20%EB%8B%A4%EC%9D%B4%EC%96%B4%EB%A6%AC%20%F0%9F%94%92/ChatGPT_Image_2026%EB%85%84_6%EC%9B%94_2%EC%9D%BC_%EC%98%A4%EC%A0%84_09_40_46.png\"/>\u003c/p>\n\u003cp>내가 세상에서 제일 사랑하는 우리 누나랑 조카 윤종이!\u003c/p>\n\u003cp>발견 위치: 진료실 책상 아래 서랍\u003c/p>\n\u003cblockquote>\n\u003cp>누나의 사고는 아직 끝나지 않았다.\u003c/p>\n\u003cp>그날의 리프트는 멈췄어야 했다.\n점검표에는 분명 이상이 적혀 있었다.\n그런데 다음 날 기사에는 누나가 안전수칙을 어긴 사람으로 나왔다.\u003c/p>\n\u003cp>그 사고로 누나는 죽었다.\u003c/p>\n\u003cp>그리고 누나의 아들, 내 조카 윤종이는\n사고 이후 전문 기관으로 인계되었다.\n나는 그 아이의 얼굴조차 제대로 보지 못했다.\u003c/p>\n\u003cp>어른들은 모두 절차라고 했다.\n보호를 위한 조치라고 했다.\u003c/p>\n\u003cp>나는 매년 7월 12일이 되면 같은 꿈을 꾼다.\u003c/p>\n\u003cp>누나가 떨어지고,\n윤종이가 낯선 사람들의 손에 이끌려 사라지고,\n나는 아무것도 붙잡지 못한 채 그 자리에 남겨지는 꿈.\u003c/p>\n\u003cp>내 전부를 빼앗은 사람…\u003c/p>\n\u003cp>도진명은 오래 살 자격이 있는가.\u003c/p>\n\u003c/blockquote>\n","track":"soundtrack/there-was-a-time-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e14805e9adcd240662c5f43":{"id":"37281d1c9e14805e9adcd240662c5f43","title":"심장약 복용 시간표","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 도진명 회장 개인 복약 관리표\u003c/p>\n\u003cp>관리자: 백기태\u003c/p>\n\u003cp>최종 수정일: 2026년 12월 23일\u003c/p>\n\u003cp>보관 위치: 백기태 진료실 책상 서랍\u003c/p>\n\u003chr/>\n\u003ch2>도진명 회장 일일 복약 루틴\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>시간\u003c/th>\n\u003cth>복용 내용\u003c/th>\n\u003cth>비고\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>08:00\u003c/td>\n\u003ctd>아침 혈압 조절제\u003c/td>\n\u003ctd>식후 복용\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13:00\u003c/td>\n\u003ctd>보조 순환제\u003c/td>\n\u003ctd>점심 이후 복용\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>19:00\u003c/td>\n\u003ctd>\u003cstrong>심장 리듬 안정제\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>반드시 정량 복용\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>22:30\u003c/td>\n\u003ctd>야간 안정용 보조약\u003c/td>\n\u003ctd>상태에 따라 생략 가능\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>19:00 복용 약 상세\u003c/h2>\n\u003cp>약품 코드: D-CARDIN 19\u003c/p>\n\u003cp>구분: 심장 리듬 안정제\u003c/p>\n\u003cp>보관 03ch2>2. 기본 출력 방식\u003c/h2>\n\u003cp>라벨 출력은 두 가지 방식으로 가능하다.\u003c/p>\n\u003ch3>A. 등록 사용자 출력\u003c/h3>\n\u003cp>의료진 개인 계정으로 로그인하여 출력한다.\u003c/p>\n\u003cp>이 경우 출력 로그에 사용자 이름이 남는다.\u003c/p>\n\u003ch3>B. 게스트 출력\u003c/h3>\n\u003cp>약품실 내부 네트워크에 연결된 상태에서 임시 라벨을 출력한다.\u003c/p>\n\u003cp>이 경우 출력 로그에는 사용자 이름이 남지 않고, “GUEST PRINT”로 기록된다.\u003c/p>\n\u003cp>게스트 출력은 응급 상황에서 빠르게 라벨을 출력하기 위해 허용된 기능이다.\u003c/p>\n\u003chr/>\n\u003ch2>3. 게스트 출력 제한사항\u003c/h2>\n\u003cp>게스트 출력 시 다음 정보는 자동 기록된다.\u003c/p>\n\u003cul>\n\u003cli>출력 시각\u003c/li>\n\u003cli>라벨 양식 번호\u003c/li>\n\u003cli>프린터 번호\u003c/li>\n\u003cli>출력 매수\u003c/li>\n\u003cli>연결된 단말기 번호\u003c/li>\n\u003c/ul>\n\u003cp>단, 사용자의 개인 이름은 기록되지 않는다.\u003c/p>\n\u003cp>주의:\u003c/p>\n\u003cp>게스트 출력 기록만으로 실제 출력자를 특정할 수 없다.\u003c/p>\n\u003cp>약품실 출입 기록, CCTV, 지문, 라벨 부착 흔적 등과 함께 확인해야 한다.\u003c/p>\n\u003chr/>\n\u003ch2>4. 최근 출력 로그 예시\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>출력 시각\u003c/th>\n\u003cth>출력 방식\u003c/th>\n\u003cth>라벨 양식\u003c/th>\n\u003cth>출력 매수\u003c/th>\n\u003cth>사용자\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>18:21\u003c/td>\n\u003ctd>등록 사용자\u003c/td>\n\u003ctd>일반 처방 라벨\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>백기태\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18:42\u003c/td>\n\u003ctd>게스트 출력\u003c/td>\n\u003ctd>VIP 개인약품 라벨\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>GUEST PRINT\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>18:57\u003c/td>\n\u003ctd>등록 사용자\u003c/td>\n\u003ctd>응급 트레이 라벨\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>간호팀 공용\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003chr/>\n\u003ch2>5. 라벨 양식 정보\u003c/h2>\n\u003cp>라벨 양식: VIP 개인약품 라벨\u003c/p>\n\u003cp>포함 항목:\u003c/p>\n\u003cul>\n\u003cli>환자명\u003c/li>\n\u003cli>약품 코드\u003c/li>\n\u003cli>복용 시간\u003c/li>\n\u003cli>보관 위치\u003c/li>\n\u003cli>담당자 확인란\u003c/li>\n\u003c/ul>\n\u003cp>라벨 양식 예시:\u003c/p>\n\u003cp>환자명: 도진명\u003c/p>\n\u003cp>약품 코드: D-CARDIN 19\u003c/p>\n\u003cp>복용 시간: 19:00\u003c/p>\n\u003cp>보관 위치: C-2\u003c/p>\n\u003cp>담 분할 청구권을 주장하지 않는다.\u003c/p>\n\u003chr/>\n\u003ch2>제3조 혼인 중 생활비 및 증여\u003c/h2>\n\u003cp>도진명은 서리나에게 혼인 기간 중 생활비, 주거, 차량, 수행 인력, 의전 비용을 제공할 수 있다.\u003c/p>\n\u003cp>단, 해당 제공은 혼인 관계 유지 중의 편의 제공일 뿐, 서리나의 소유권으로 보지 않는다.\u003c/p>\n\u003cp>도진명이 별도로 증여계약서를 작성하지 않은 물품은 이혼 시 반환 대상이 될 수 있다.\u003c/p>\n\u003chr/>\n\u003ch2>제4조 이혼 시 지급 조건\u003c/h2>\n\u003cp>쌍방 합의 이혼 시 서리나는 다음 금액을 지급받는다.\u003c/p>\n\u003cul>\n\u003cli>혼인 기간 1년 미만: 1억 원\u003c/li>\n\u003cli>혼인 기간 3년 미만: 3억 원\u003c/li>\n\u003cli>혼인 기간 5년 미만: 5억 원\u003c/li>\n\u003c/ul>\n\u003cp>단, 서리나의 계약 위반, 외부 폭로, 개인 금고 접근, 유언장 또는 보험 관련 문서 무단 열람이 확인될 경우 지급액은 전액 취소될 수 있다.\u003c/p>\n\u003chr/>\n\u003ch2>제5조 사망 및 상속 관련 조항\u003c/h2>\n\u003cp>도진명의 사망 시 상속은 민법 및 도진명의 유언장에 따른다.\u003c/p>\n\u003cp>단, 서리나는 혼인 전 본 계약을 통해 도진명의 도원그룹 지분 및 경영권에 대한 권리를 주장하지 않기로 한다.\u003c/p>\n\u003cp>보험금 및 별도 수익자 지정 재산은 각 계약서의 수익자 지정에 따른다.\u003c/p>\n\u003chr/>\n\u003ch2>제6조 비밀유지 조항\u003c/h2>\n\u003cp>서리나는 도진명의 건강 상태, 가족관계, 유언장, 후계자 선정, 보험 계약, 개인 금고, 도원그룹 내부 분쟁에 대해 외부에 발설하지 않는다.\u003c/p>\n\u003cp>위반 시 도진명은 즉시 이혼을 요구할 수 있으며, 서리나는 제4조의 지급액을 청구할 수 없다.\u003c/p>\n\u003chr/>\n\u003ch2>제7조 특약\u003c/h2>\n\u003cp>서리나가 도진명 개인 금고 또는 도원그룹 법무팀 보관 서류에 무단 접근한 사실이 확인될 경우, 이는 중대한 계약 위반으로 본다.\u003c/p>\n\u003cp>본 계약 원본은 도진명 개인 금고에 보관하며, 사본은 법무대리인과 도원그룹 법무팀이 각각 보관한다.\u003c/p>\n\u003chr/>\n","track":"soundtrack/source-damour-by-arthur-marie-brillouin.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e14800595fcf63eb05062c2":{"id":"37381d1c9e14800595fcf63eb05062c2","title":"메신저","locked":true,"lock_type":"single","answers":["840120"],"children":[],"html":"\u003ch1>메신저  🔒\u003c/h1>\n\u003ch2>사진 한 장\u003c/h2>\n\u003cp>\u003cimg src=\"notion_mystery_game_html/《죽은 자의 생일파티》/서리나 파우더룸 🔒/%EB%A9%94%EC%8B%A0%EC%A0%80%20%F0%9F%94%92/ca86c967-2843-48be-afcb-eba475752f4b.png\" alt=\"내가 진심으로 사랑하는 해준씨와 나\" />\u003c/p>\n\u003cp>내가 진심으로 사랑하는 해준씨와 나\u003c/p>\n\u003ch1>문해준과의 메신저 내용\u003c/h1>\n\u003cp>대화 상대: 문해준\u003c/p>\n\u003cp>대화 기간: 2026년 12월 22일 ~ 2026년 12월 25일\u003c/p>\n\u003ch2>2026년 12월 22일\u003c/h2>\n\u003cp>\u003cstrong>22:41 서리나\u003c/strong>\u003c/p>\n\u003cp>오늘도 회장님은 나한테 “조용히 있으면 된다”고 했어요.\u003c/p>\n\u003cp>나는 아내가 아니라, 이 집 분위기 해치지 말라고 들여놓은 장식 같아요.\u003c/p>\n\u003cp>\u003cstrong>22:43 문해준\u003c/strong>\u003c/p>\n\u003cp>그런 말씀은 여기 남기지 않는 게 좋습니다.\u003c/p>\n\u003cp>\u003cstrong>22:44 서리나\u003c/strong>\u003c/p>\n\u003cp>늘 그렇게 말하죠.\u003c/p>\n\u003cp>조심하라고. 남기지 말라고. 들키면 안 된다고.\u003c/p>\n\u003cp>\u003cstrong>22:45 문해준\u003c/strong>\u003c/p>\n\u003cp>제가 걱정하는 겁니다.\u003c/p>\n\u003cp>\u003cstrong>22:46 서리나\u003c/strong>\u003c/p>\n\u003cp>걱정이면 이렇게 늦은 시간에 답장하지 말았어야죠.\u003c/p>\n\u003cp>\u003cstrong>22:48 문해준\u003c/strong>\u003c/p>\n\u003cp>사모님.\u003c/p>\n\u003cp>\u003cstrong>22:49 서리나\u003c/strong>\u003c/p>\n\u003cp>그렇게 부르지 마요.\u003c/p>\n\u003cp>당신이 그렇게 부르면 내가 정말 그 사람 아내인 것 같아서 싫어요.\u003c/p>\n\u003cp>\u003cstrong>22:51 문해준\u003c/strong>\u003c/p>\n\u003cp>리나 씨.\u003c/p>\n\u003cp>\u003cstrong>22:52 서리나\u003c/strong>\u003c/p>\n\u003cp>그렇게 불러줘요.\u003c/p>\n\u003cp>오늘은 그게 듣고 싶었어요.\u003c/p>\n\u003chr />\n\u003ch2>2026년 12월 23일\u003c/h2>\n\u003cp>\u003cstrong>00:13 서리나\u003c/strong>\u003c/p>\n\u003cp>나 정말 이혼하면 아무것도 못 받아요?\u003c/p>\n\u003cp>\u003cstrong>00:15 문해준\u003c/strong>\u003c/p>\n\u003cp>혼전계약서 원본 기준으로는 그렇습니다.\u003c/p>\n\u003cp>사본에 적힌 조항이 그대로라면, 재산분할은 거의 불가능합니다.\u003c/p>\n\u003cp>\u003cstrong>00:16 서리나\u003c/strong>\u003c/p>\n\u003cp>그 사람은 나를 사랑한 적 없어요! 나도 마찬가지고!\u003c/p>\n\u003cp>\u003cstrong>00:18 문해준\u003c/strong>\u003c/p>\n\u003cp>원본을 확인해야 합니다.\u003c/p>\n\u003cp>사본과 다른 특약이 있을 수 있습니다.\u003c/p>\n\u003cp>\u003cstrong>00:19 서리나\u003c/strong>\u003c/p>\n\u003cp>원본은 어디 있어요?\u003c/p>\n\u003cp>\u003cstrong>00:23 문해준\u003c/strong>\u003c/p>\n\u003cp>회장님 개인 금고로 추정됩니다.\u003c/p>\n\u003cp>\u003cstrong>00:24 서리나\u003c/strong>\u003c/p>\n\u003cp>추정?\u003c/p>\n\u003cp>\u003cstrong>00:26 문해준\u003c/strong>\u003c/p>\n\u003cp>제가 직접 본 건 아닙니다.\u003c/p>\n\u003cp>다만 법무팀에서 원본 보관 위치를 묻는 문서가 올라온 적이 있습니다.\u003c/p>\n\u003cp>\u003cstrong>00:27 서리나\u003c/strong>\u003c/p>\n\u003cp>당신은 알고 있잖아요.\u003c/p>\n\u003cp>회장님이 뭘 어디에 숨기는지.\u003c/p>\n\u003cp>\u003cstrong>00:30 문해준\u003c/strong>\u003c/p>\n\u003cp>전부 아는 건 아닙니다.\u003c/p>\n\u003cp>\u003cstrong>00:31 서리나\u003c/strong>\u003c/p>\n\u003cp>거짓말.\u003c/p>\n\u003cp>당신은 그 사람보다 그 사람을 더 잘 알아요.\u003c/p>\n\u003cp>\u003cstrong>00:35 문해준\u003c/strong>\u003c/p>\n\u003cp>금고 위치는 확인해보겠습니다.\u003c/p>\n\u003cp>하지만 원본을 가져가는 건 다른 문제입니다.\u003c/p>\n\u003cp>\u003cstrong>00:36 서리나\u003c/strong>\u003c/p>\n\u003cp>나 혼자 못 해요. 해줄 수 있잖아요.\u003c/p>\n\u003cp>\u003cstrong>00:38 문해준\u003c/strong>\u003c/p>\n\u003cp>저도 해드릴 수 있는 일과 없는 일이 있습니다.\u003c/p>\n\u003cp>\u003cstrong>00:39 서리나\u003c/strong>\u003c/p>\n\u003cp>그럼 사랑한다는 말은요?\u003c/p>\n\u003cp>\u003cstrong>00:42 문해준\u003c/strong>\u003c/p>\n\u003cp>그 말은 지금 하지 마십시오.\u003c/p>\n\u003cp>\u003cstrong>00:43 서리나\u003c/strong>\u003c/p>\n\u003cp>왜요?\u003c/p>\n\u003cp>\u003cstrong>00:47 문해준\u003c/strong>\u003c/p>\n\u003cp>리나 씨를 사랑합니다.\u003c/p>\n\u003cp>그래서 더 무섭습니다.\u003c/p>\n\u003cp>\u003cstrong>00:49 서리나\u003c/strong>\u003c/p>\n\u003cp>나는 그 말 하나 들으려고 이렇게 오래 버틴 것 같아요.\u003c/p>\n\u003chr />\n\u003ch2>2026년 12월 24일\u003c/h2>\n\u003cp>\u003cstrong>18:02 문해준\u003c/strong>\u003c/p>\n\u003cp>내일 행사 동선 확인했습니다.\u003c/p>\n\u003cp>회장님은 18:50부터 중앙 생일홀에 계실 예정입니다.\u003c/p>\n\u003cp>19:00 약 복용 확인 후 19:20까지는 대기실 이동 가능성이 있습니다.\u003c/p>\n\u003cp>\u003cstrong>18:04 서리나\u003c/strong>\u003c/p>\n\u003cp>그럼 금고는 언제 볼 수 있어요?\u003c/p>\n\u003cp>\u003cstrong>18:05 문해준\u003c/strong>\u003c/p>\n\u003cp>행사 시작 전은 어렵습니다.\u003c/p>\n\u003cp>사람이 너무 많습니다.\u003c/p>\n\u003cp>\u003cstrong>18:06 서리나\u003c/strong>\u003c/p>\n\u003cp>끝난 뒤에는 늦어요.\u003c/p>\n\u003cp>이혼 합의서 사인하라고 할 거예요.\u003c/p>\n\u003cp>\u003cstrong>18:08 문해준\u003c/strong>\u003c/p>\n\u003cp>회장님 개인 대기실 뒤쪽 벽면 액자.\u003c/p>\n\u003cp>그 뒤에 금고가 있습니다.\u003c/p>\n\u003cp>\u003cstrong>18:09 서리나\u003c/strong>\u003c/p>\n\u003cp>비밀번호는요?\u003c/p>\n\u003cp>\u003cstrong>18:12 문해준\u003c/strong>\u003c/p>\n\u003cp>아마 전 부인 결혼 기념일 인 것 같습니다.\u003c/p>\n\u003cp>\u003cstrong>18:16 서리 진명 회장의 19:00 복용 심장약이 보관된 VIP 약품 냉장고 C구역이다.\u003c/p>\n\u003cp>해당 약품은 평소 C-2 트레이에 보관되며, 백기태 담당의의 복약 관리표에는 다음과 같이 기록되어 있다.\u003c/p>\n\u003cpre>\u003ccode>환자명: 도진명\n복용 시간: 매일 19:00\n보관 위치: VIP 약품 냉장고 C-2\n약품 코드: D-CARDIN 19\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2>2. 현장 상태\u003c/h2>\n\u003cp>약품 냉장고 외부 문은 닫힌 상태로 발견되었다.\u003c/p>\n\u003cp>냉장고 외관에는 강제 개방 흔적이 없었으며, 손잡이 부분에 다수의 지문이 확인되었다.\u003c/p>\n\u003cp>C-2 트레이 내부에는 도진명 회장의 이름이 적힌 약통 1개가 보관되어 있었다.\u003c/p>\n\u003cp>약통 겉면에는 다음 라벨이 부착되어 있었다.\u003c/p>\n\u003cpre>\u003ccode>도진명\nD-CARDIN 19\n19:00 복용\nC-2 보관\n\u003c/code>\u003c/pre>\n\u003chr />\n\u003ch2>3. 지문 및 접촉 흔적\u003c/h2>\n\u003ch3>냉장고 손잡이\u003c/h3>\n\u003cp>냉장고 외부 손잡이에서 백기태의 지문이 확인되었다.\u003c/p>\n\u003cp>해당 지문은 선명하며, 최근 접촉 흔적으로 보인다.\u003c/p>\n\u003ch3>C-2 트레이 외부\u003c/h3>\n\u003cp>C-2 트레이 앞쪽 가장자리에서는 부분 지문이 검출되었으나, 훼손이 심해 신원 특정 불가.\u003c/p>\n\u003ch3>약통 외부\u003c/h3>\n\u003cp>약통 겉면에서는 여러 개의 흐릿한 지문이 검출되었으나, 라벨 재부착 흔적으로 인해 식별이 어렵다.\u003c/p>\n\u003ch3>약통 뚜껑 안쪽\u003c/h3>\n\u003cp>약통 뚜껑 안쪽에서는 신원 미상의 부분 지문과 미세한 향료 성분이 검출되었다.\u003c/p>\n\u003chr />\n\u003ch2>4. 약통 상태\u003c/h2>\n\u003cp>C-2 트레이에 보관된 약통은 기존 관리 기록에 남아 있는 약통과 색상이 미묘하게 달랐다.\u003c/p>\n\u003cp>기존 기록상 약통은 반투명 흰색 용기였으나, 발견된 약통은 약간 푸른빛이 도는 흰색 용기였다.\u003c/p>\n\u003cp>약품 내용물은 \u003cstrong>심장 리듬 안정제가 아닌 약물로 의심된다.\u003c/strong>\u003c/p>\n\u003chr />\n\u003ch2>5. 약품 성분 예비 확인\u003c/h2>\n\u003cp>\u003cstrong>약통 안에는 도진명의 평소 심장약과 외형이 비슷한 알약이 들어 있었다.\u003c/strong>\u003c/p>\n\u003cp>그러나 예비 확인 결과, 일부 알약에서 기존 심장약과 다른 \u003cstrong>혈압 강하 성분이\u003c/strong> 섞여 있는 것으로 확인되었다.\u003c/p>\n\u003cp>주의:\u003c/p>\n\u003cp>본 문서는 예비 조사 파일이며, 최종 약물 감정서는 별도 작성 예정.\u003c/p>\n\u003chr />","track":"soundtrack/hitman-by-kevin-macleod.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37381d1c9e1480bbb606c12ea4403a63":{"id":"37381d1c9e1480bbb606c12ea4403a63","title":"내부 비상 버튼 오류 조사 메모","locked":false,"lock_type":null,"answers":[],"children":[],"html":"\n\u003cp>문서명: 내부 비상 버튼 1차 점검 메모\u003c/p>\n\u003cp>작성자: 도원관 전시기술팀\u003 3ccode>19:09:38\nERROR CODE: E-BTN-09\nBUTTON RETURN FAILURE\n\n내부 비상 버튼이 눌린 상태로 복귀하지 않음.\n버튼 주변 물리적 걸림 또는 이물질 삽입 가능성.\n\u003c/code>\u003c/pre>\n\u003chr/>\n","track":"soundtrack/the-complex-by-kevin-macleod.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480009b17e98839289adb":{"id":"37281d1c9e1480009b17e98839289adb","title":"녹음기","locked":true,"lock_type":"single","answers":["gentle"],"children":[],"html":"\u003ch2>녹음기\u003c/h2>\n\u003ch2>녹음 transcript\u003c/h2>\n\u003cp>[19:07:42]\u003c/p>\n\u003cp>작게 유리 울리는 소리.\u003c/p>\n\u003cp>멀리서 생일 음악이 희미하게 들린다.\u003c/p>\n\u003cp>도진명의 숨소리가 거칠다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야.\u003c/p>\n\u003cp>잠시 침묵.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야, 거기 있지.\u003c/p>\n\u003cp>유리 바깥쪽에서 낮은 발소리.\u003c/p>\n\u003cp>누군가 유리관 가까이 다가오는 소리가 난다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>움직이지 마세요.\u003c/p>\n\u003cp>그러면 더 힘드실 겁니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>내 약.\u003c/p>\n\u003cp>방금 먹은 약 말이다.\u003c/p>\n\u003cp>짧은 기침 소리.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>그 약, 네가 건드린 거냐.\u003c/p>\n\u003cp>잠시 침묵.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아버지는 참 이상하시네요.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>대답해라.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>이런 순간에도 확인부터 하세요.\u003c/p>\n\u003cp>누가 했는지, 어디서 잘못됐는지, 어떻게 수습할 수 있는지.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>평생 그렇게 사셨잖아요.\u003c/p>\n\u003cp>사람이 죽어도 사고였는지, 책임은 누구한테 넘길 수 있는지, 기록은 어디까지 고칠 수 있는지.\u003c/p>\n\u003cp>유리 안쪽에서 손바닥으로 벽을 짚는 소리.\u003c/p>\n\u003cp>도진명의 호흡이 더 가빠진다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>문 열어라.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아직 대답 안 하셨습니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>무슨 대답.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>1996년 7월 12일.\u003c/p>\n\u003cp>그날, 제 어머니가 정말 안전수칙을 어긴 겁니까.\u003c/p>\n\u003cp>긴 침묵.\u003c/p>\n\u003cp>멀리서 사람들 웃음소리와 잔 부딪히는 소리가 들린다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>그 이야기는 여기서 할 일이 아니다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그럼 어디서 할 일이었습니까.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야, 지금은—\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>저도 그 말을 참 많이 들었습니다.\u003c/p>\n\u003cp>지금은 아니다.\u003c/p>\n\u003cp>나중에 하자.\u003c/p>\n\u003cp>때가 아니다.\u003c/p>\n\u003cp>목소리가 낮게 떨린다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>제가 아들이 아니라는 것도,\u003c/p>\n\u003cp>어머니 사고가 묻힌 것도,\u003c/p>\n\u003cp>제가 대표이사 후보에서 빠진 것도\u003c/p>\n\u003cp>전부 나중에 알게 하려고 하셨습니까?\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>나는 널 버리지 않았다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>네.\u003c/p>\n\u003cp>데려오셨죠.\u003c/p>\n\u003cp>작은 웃음.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>자기 생일 전 날 피해자 자식을 입양한다니 참 다정한 날짜네요.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>그건 네가 혼자가 되지 않게 하려던—\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아니요.\u003c/p>\n\u003cp>발소리.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아버지는 저를 구한 게 아닙니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야, 문 열어라.\u003c/p>\n\u003cp>내가 설명하겠다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>설명은 항상 늦었습니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>아직 늦지 않았다.\u003c/p>\n\u003cp>유리관 안쪽에서 버튼을 누르는 듯한 딸깍거리는 소리.\u003c/p>\n\u003cp>곧이어 낮은 오류음.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>이게 왜 안 열려.\u003c/p>\n\u003cp>다시 버튼 누르는 소리.\u003c/p>\n\u003cp>오류음.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야.\u003c/p>\n\u003cp>비상 버튼이 안 된다.\u003c/p>\n\u003cp>짧은 침묵.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>네가 한 거냐.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야!\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>문 열어라.\u003c/p>\n\u003cp>아직 늦지 않았다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>늦었습니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야, 제발.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>저도 그렇게 말하고 싶었던 날이 있었습니다.\u003c/p>\n\u003cp>도윤재의 숨소리가 잠깐 흔들린다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아버지.\u003c/p>\n\u003cp>제발.\u003c/p>\n\u003cp>저를 한 번만 봐달라고.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>나는 널 아들로 키웠다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>키우셨죠.\u003c/p>\n\u003cp>잠시 침묵.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>회사를 물려받을 사람으로.\u003c/p>\n\u003cp>당신 과거를 모르게 할 사람으로.\u003c/p>\n\u003cp>당신이 만든 집 안에서 가장 오래 거짓말을 믿을 사람으로.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>나는 널 사랑했다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그 말은 제가 묻기 전에 하셨어야죠.\u003c/p>\n\u003cp>멀리서 누군가 “회장님?” 하고 부르는 듯한 소리.\u003c/p>\n\u003cp>아주 작게 들리고 금세 사라진다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>사람들이 올 거다.\u003c/p>\n\u003cp>네가 지금 문을 열면—\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그러면 또 정리하시겠죠.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>약을 잘못 먹었다고 하실 겁니다.\u003c/p>\n\u003cp>심장이 안 좋았다고 하실 겁니다.\u003c/p>\n\u003cp>도세아의 장치가 오작동했다고 하실 수도 있겠네요.\u003c/p>\n\u003cp>아니면 백 선생에게 책임을 넘기시겠습니까?\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>그만해라.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>평생 배웠습니다.\u003c/p>\n\u003cp>위기는 그렇게 처리하는 거라고.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>너는 내 아들이다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>아니요.\u003c/p>\n\u003cp>도윤재의 목소리가 낮아진다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그렇게 생각하신 적도 없으시잖아요.\u003c/p>\n\u003cp>유리 안쪽에서 거친 숨소리.\u003c/p>\n\u003cp>도진명이 다시 유리를 두드린다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야, 문을 열어라.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>오늘은 제가 묻겠습니다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>뭘.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>단 한 번이라도,\u003c/p>\n\u003cp>저를 아들로 사랑한 적이 있었습니까.\u003c/p>\n\u003cp>긴 침묵.\u003c/p>\n\u003cp>도진명의 숨소리만 들린다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>있었다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그럼 왜 저는 오늘에서야 알아야 했습니까.\u003c/p>\n\u003cp>도진명은 대답하지 못한다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>대답이 없네요.\u003c/p>\n\u003cp>유리관 외부에서 금속 손잡이가 살짝 움직이는 소리.\u003c/p>\n\u003cp>하지만 문은 열리지 않는다.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야.\u003c/p>\n\u003cp>내가 잘못했다.\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>그 말도 늦었습니다.\u003c/p>\n\u003cp>음악 소리가 잠깐 커진다.\u003c/p>\n\u003cp>생일 축하 노래의 앞부분이 희미하게 들린다.\u003c/p>\n\u003cp>짧은 숨.\u003c/p>\n\u003cp>\u003cstrong>도진명:\u003c/strong>\u003c/p>\n\u003cp>윤재야!\u003c/p>\n\u003cp>\u003cstrong>도윤재:\u003c/strong>\u003c/p>\n\u003cp>생일 축하드립니다. 아버지\u003c/p>\n\u003cp>도윤재의 발소리가 멀어진다.\u003c/p>\n\u003cp>유리 안쪽에서 도진명이 몇 번 더 두드리는 소리.\u003c/p>\n\u003cp>비상 버튼 오류음이 한 번 더 들린다.\u003c/p>\n\u003cp>이후 도진명의 숨소리가 점점 약해진다.\u003c/p>\n\u003cp>[녹음 종료]\u003c/p>","track":"soundtrack/at-the-end-of-all-things-by-scott-buckley.mp3","locked_track":"soundtrack/demised-to-shield-by-ghostrifter-official.mp3"},"37281d1c9e1480658a23fa9250763df4":{"id":"37281d1c9e1480658a23fa9250763df4","t
